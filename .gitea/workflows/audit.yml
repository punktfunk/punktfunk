# Supply-chain advisory scan for EVERY dependency tree the project ships or publishes, plus the
# license-allowlist gate (CRA Annex I Part II: know your components; catch a bad dep the moment
# it lands).
#   * cargo-audit → the (network-facing, crypto-heavy) Rust tree, against the RustSec advisory DB.
#                   ⚠ ALL SEVEN Rust lockfiles, each named with its own `--file`: a bare `cargo audit`
#                   reads only the root one, which is how the drivers lock went unscanned for so
#                   long despite already being in this job's `paths:` filter.
#   * cargo-deny  → where each crate comes from, over the same seven Rust workspaces (deny.toml): a
#                   registry or git repository outside the allowlist fails. Duplicate versions
#                   print as warnings.
#   * bun audit   → each Bun-managed tree that ships or publishes: web (the mgmt console BFF —
#                   login gate, session sealing, mgmt bearer token), sdk (@punktfunk/host),
#                   plugin-kit (@punktfunk/plugin-kit).
#   * pnpm audit  → clients/decky (the Steam Deck plugin).
#   * docs-site   → scanned NON-blocking. Its `overrides` lift the chains fumadocs and @unom/ui
#                   pull in (@ai-sdk/provider-utils, dompurify, undici), as web's do; it carries
#                   web's ignore for the same reason.
#   * vendored-inventory → every `vendor/` tree has a CVE-watch row in
#                   compliance/vendored-components.md.
#   * cargo-about → license-allowlist gate over the host, driver and seat-keeper workspaces (about.toml `accepted`);
#                   fails if any crate carries a license outside the allowlist. Android dependencies
#                   are locked and checksum-verified by Gradle in android.yml.
#   * miri        → interpretation of the few FFI-free leaf crates, one of them
#                   cross-compiled to MSVC layout. Not a supply-chain scan; it lives here because
#                   audit.yml already has exactly the shape it needs (weekly cron,
#                   workflow_dispatch, the rust-ci container, the same cache pattern) and because
#                   ci.yml runs on every push against a fleet where 37 of 46 jobs contend for
#                   ubuntu-24.04. See the `miri:` job below for what it does and does not buy.
#   * c-abi-asan  → ASAN+LSAN run of the C ABI harness (tests/c/run.sh under
#                   PF_SAN=address): both sides of the C ABI boundary instrumented at once, and
#                   the only automated check on its Box::into_raw/from_raw leak contract. Same
#                   here-not-ci.yml reasoning as miri — plus -Zbuild-std defeats sccache, so it
#                   must not ride the per-push leg.
#   * careful     → the leaf and host crates' own tests against a std rebuilt with its debug
#                   assertions. See the `careful:` job.
#   * tsan        → the core, zerocopy and host tests under ThreadSanitizer. See the `tsan:` job.
#   * fuzz        → libFuzzer over the wire, bitstream and RTSP decoders (fuzz/), five minutes
#                   a target. Here for the same reasons as miri. See the `fuzz:` job.
# Triggers: weekly (catch newly-disclosed CVEs in pinned deps), on every lockfile/allowlist
# change, and on demand.
# To silence a known-unfixable Rust advisory, add it to `.cargo/audit.toml` ([advisories] ignore=[…]).
name: audit
# One pending run per workflow+ref: a newer push supersedes the queued/running one and cancels
# it (a canary only needs the latest commit; each release tag is its own ref so tag runs never
# cancel each other). Keeps a busy push cadence from piling ~10 queued runs per commit onto the
# runner fleet. Gitea honors this for push triggers (PR triggers: see gitea#35933).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'packaging/windows/drivers/Cargo.lock'
      - 'packaging/windows/pf-vkhdr-layer/Cargo.lock'
      - 'tools/win-input-matrix/Cargo.lock'
      - 'tools/hid-descriptor-dump/Cargo.lock'
      - 'crates/host/pf-seat-keeper/Cargo.lock'
      - 'fuzz/Cargo.lock'
      - 'web/bun.lock'
      - 'docs-site/bun.lock'
      - 'sdk/bun.lock'
      - 'plugin-kit/bun.lock'
      - 'clients/decky/pnpm-lock.yaml'
      - 'about.toml'
      - 'deny.toml'
      - 'compliance/vendored-components.md'
      - 'ci/tsan.supp'
      - '.gitea/workflows/audit.yml'
  workflow_dispatch:
# NOTE on the `paths:` list above and the `miri:` job: `crates/host/pf-driver-proto/**` is deliberately
# NOT listed, even though that crate is what the Miri job exists to watch. `paths:` is a
# WORKFLOW-level filter — adding it would fire all six jobs (three bun trees, pnpm, cargo-audit,
# the license gate) on every driver-proto edit, onto a fleet where 37 of 46 jobs contend for
# ubuntu-24.04, to run one 2-minute job. Weekly cron + workflow_dispatch is the day-one cadence;
# revisit once the job has a green history, and if you do, prefer moving miri to its own workflow
# file over widening this filter.

jobs:
  cargo-audit:
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cache /usr/local/cargo so the cargo-audit binary (and the advisory DB clone) persist.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/bin
            /usr/local/cargo/registry
          key: cargo-audit-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-audit-
      - name: cargo audit
        run: |
          git config --global --add safe.directory "$PWD"
          command -v cargo-audit >/dev/null 2>&1 || cargo install --locked cargo-audit
          # Bare `cargo audit` scans only the root lock. Scan each separate workspace
          # explicitly. `--deny unsound` fails memory-safety advisories while
          # unmaintained findings remain visible warnings.
          cargo audit --deny unsound
          cargo audit --deny unsound --file packaging/windows/drivers/Cargo.lock
          cargo audit --deny unsound --file packaging/windows/pf-vkhdr-layer/Cargo.lock
          cargo audit --deny unsound --file tools/win-input-matrix/Cargo.lock
          cargo audit --deny unsound --file tools/hid-descriptor-dump/Cargo.lock
          cargo audit --deny unsound --file crates/host/pf-seat-keeper/Cargo.lock
          cargo audit --deny unsound --file fuzz/Cargo.lock

  # cargo-audit matches registry crates by name and version, so a vendored tree has no feed but
  # its row in compliance/vendored-components.md. Every `vendor/<tree>` needs one.
  vendored-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every vendored tree has an inventory row
        run: |
          missing=0
          for d in $(git ls-files crates clients packaging | awk -F/vendor/ 'NF > 1 { split($2, t, "/"); print $1 "/vendor/" t[1] }' | sort -u); do
            grep -qF "\`$d\`" compliance/vendored-components.md \
              || { echo "::error::$d has no row in compliance/vendored-components.md"; missing=1; }
          done
          exit $missing

  bun-audit:
    strategy:
      fail-fast: false
      matrix:
        tree: [web, sdk, plugin-kit]
    runs-on: ubuntu-24.04
    container:
      image: oven/bun:1.4.4
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ matrix.tree }}
    steps:
      # oven/bun's slim base lacks a CA bundle + git — actions/checkout's HTTPS fetch needs them
      # (same preamble as web-screenshots.yml / ci.yml's web job).
      - name: Install git + CA certs
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `bun audit` queries the registry advisory DB for the versions pinned in the tree's
      # bun.lock. No install/build needed — it reads the manifest + lockfile. Fails the job on any
      # advisory, the same fail-on-vulnerability stance as cargo-audit above; triage a finding by
      # bumping the dep (or, if genuinely unfixable + inapplicable, pinning a resolution and
      # noting why here).
      #
      # web carries one ignore, the ONLY one in a blocking tree: deepmerge (GHSA-gcqx-w48m-w2h4,
      # prototype poisoning in mergeObject). It is unfixable AND unreachable:
      #   * unfixable — the vulnerable range ends at 4.3.1, the latest release. Upstream has
      #     published no patched version, so no override can clear it.
      #   * unreachable — `nitropack › @rollup/plugin-node-resolve` calls it once at load, on
      #     that plugin's own constants. payload is a peer of @unom/ui that only its `./richtext`
      #     export needs, which the console never imports. The built `.output` holds neither.
      # Drop it the moment upstream ships a fix — the bare `bun audit` is then green. Scoped
      # per-tree so sdk/plugin-kit stay strictly fail-on-any.
      - name: bun audit
        run: |
          if [ "${{ matrix.tree }}" = "web" ]; then
            bun audit --ignore=GHSA-gcqx-w48m-w2h4
          else
            bun audit
          fi

  # Kept OUT of the bun-audit matrix so this tree's known-advisory state can't normalize failure
  # in a shipping tree. Non-blocking via a step-level `||` (NOT job-level continue-on-error, which
  # act_runner does not reliably honor — a red job here would take the whole run red). The full
  # advisory list still lands in the log; the warning marks it wasn't clean.
  docs-site-audit:
    runs-on: ubuntu-24.04
    container:
      image: oven/bun:1.4.4
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Install git + CA certs
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bun audit (non-blocking)
        run: |
          bun audit --ignore=GHSA-gcqx-w48m-w2h4 \
            || echo "::warning::docs-site has a new advisory — lift it with an override, as web does"

  pnpm-audit:
    runs-on: ubuntu-24.04
    container:
      image: node:22-bookworm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/decky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # decky is pnpm-managed (pnpm-lock.yaml lockfileVersion 9.0 → pnpm 10 reads it). Like
      # bun audit, `pnpm audit` needs no install/build — lockfile + registry advisory DB only.
      # --prod: rollup bundles only the prod deps into the shipped plugin; devDependencies are
      # build tooling that never leaves CI (auditing them fails on toolchain advisories that
      # can't reach a user — the docs-site problem in miniature).
      - name: pnpm audit
        run: |
          npm install -g pnpm@10
          pnpm audit --prod

  # The regression guard about.toml documents: fail if any crate in a shipped Rust workspace carries
  # a license outside the `accepted` allowlist (e.g. a copyleft dep silently entering the linked
  # set). cargo-about is version-pinned: the config uses the per-crate `accepted` syntax
  # validated against exactly this version.
  license-gate:
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/bin
            /usr/local/cargo/registry
          key: cargo-about-0.9.1
          restore-keys: cargo-about-
      - name: cargo about license gate (host, driver and seat-keeper workspaces)
        run: |
          git config --global --add safe.directory "$PWD"
          command -v cargo-about >/dev/null 2>&1 || cargo install --locked cargo-about --version 0.9.1 --features cli
          cargo about generate about.hbs --fail -o /dev/null
          cargo about generate -m packaging/windows/drivers/Cargo.toml -c about.toml about.hbs --fail -o /dev/null
          cargo about generate -m crates/host/pf-seat-keeper/Cargo.toml -c about.toml about.hbs --fail -o /dev/null

  # Where each crate comes from, which no job above checks: a registry or git repository that
  # deny.toml does not list fails.
  cargo-deny:
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    timeout-minutes: 30
    env:
      # Also in the cache keys below, so a bump reinstalls instead of finding the old binary.
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/bin
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deny-${{ env.CARGO_DENY_VERSION }}-
      - name: cargo deny (bans, sources) over all seven Rust workspaces
        run: |
          git config --global --add safe.directory "$PWD"
          command -v cargo-deny >/dev/null 2>&1 || cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          # `check bans sources`, never a bare `check`: advisories belong to cargo-audit and
          # licenses to cargo-about.
          for m in Cargo.toml \
                   packaging/windows/drivers/Cargo.toml \
                   packaging/windows/pf-vkhdr-layer/Cargo.toml \
                   tools/win-input-matrix/Cargo.toml \
                   tools/hid-descriptor-dump/Cargo.toml \
                   crates/host/pf-seat-keeper/Cargo.toml \
                   fuzz/Cargo.toml; do
            cargo deny --manifest-path "$m" --config deny.toml check bans sources
          done

  # ── Miri ─────────────────────────────────────────────────────────────────────────────────────
  # WHAT THIS BUYS, precisely — one thing, and it is worth having:
  #   It interprets `pf-driver-proto` CROSS-COMPILED TO `x86_64-pc-windows-msvc`, on a Linux
  #   runner, with no Windows box anywhere in the loop. Its only unsafe is the section view every
  #   Windows section owner reads through. It is path-dep'd by BOTH workspaces, so it is the layout
  #   oracle for every frame and IOCTL crossing that boundary — and drift there is silent
  #   corruption, not a compile error. Nothing else in CI checks it at MSVC layout.
  #   On the first run ever performed against this repo it found a real defect: a layout test
  #   reading an align-8 struct out of an align-1 stack buffer, which had passed on every machine
  #   and every CI leg since it was written because a stack `[u8; 40]` usually lands 8-aligned.
  #
  # WHAT IT DOES NOT BUY — do not let anyone report this as unsafe coverage, and do not publish a
  #   "Miri coverage" percentage; it would be noise. Miri can execute on the order of 2% of the
  #   host's unsafe. It cannot run ash, windows-rs, libva, CUDA or the WDK, and in those crates
  #   the unsafe *is* the foreign call, so there is nothing for an interpreter to execute. This
  #   job is a targeted instrument for three leaf surfaces, not a safety net.
  #
  # BLOCKING: a step that exits non-zero or reports no passing test fails the run. audit.yml is
  # not a pull-request check, so a miss turns the weekly or main-push run red and gates no merge.
  # The nightly is pinned by date. Prove a bump with a `workflow_dispatch` run on its branch
  # before merging it.
  #
  # Do NOT add crates here because they merely compile under Miri. Add them because they contain
  # pure-Rust unsafe or a layout contract worth interpreting. Explicitly excluded:
  #   * pf-bitstream    — its compile did not finish in 27 min at 2.1 GB RSS, and it is
  #                       `forbid(unsafe_code)`, so there is nothing to find. Do not re-add it.
  #   * pf-update-check — ring; every FFI crate — dies on the first foreign call. Structural.
  #   * punktfunk-core in bulk — `-- fec packet crypto` selects 63 tests and was killed at a
  #                       25-minute cap with not one test reported complete. Only the narrow
  #                       `fec::gf8` selection below is affordable, and it was timed before it
  #                       was committed. Do not widen this filter without timing the result.
  #
  # MEASURED, not estimated — 192.168.1.25 (Ubuntu, 8 cores), on the DATED toolchain this job
  # actually installs, with a COLD target dir and a COLD sysroot cache (so each step's figure
  # includes building the Miri sysroot it needs) and a warm cargo registry. Every step below has
  # been run start to finish; nothing here is extrapolated:
  #   step A   21 + 12 + 4 pass    43 s
  #   step B          21 pass      26 s
  #   step C           2 pass      63 s
  #   TOTAL 132 s cold. Interpretation itself is ~10 s of that; the rest is compiling, plus ~38 s
  #   of one-time sysroot builds (21 s host + 17 s MSVC) that the cache below then carries.
  #   Warm, the three steps are ~6 s / ~3 s / ~10 s. `timeout-minutes: 30` is therefore vast
  #   headroom, kept deliberately so a first fully-uncached run — which additionally downloads a
  #   ~400 MB toolchain and the registry — cannot trip it.
  # If you add a step, MEASURE IT FIRST. The estimate this job replaced said "under 15 s across
  # all four steps" and was extrapolated from a partial run; the real punktfunk-core figure was
  # >25 min. Extrapolation is exactly how that happened.
  miri:
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    timeout-minutes: 30
    env:
      # A DATED nightly, bumped deliberately — exactly like rust-toolchain.toml, and for the same
      # reason. The cache keys below carry this value, so bumping it self-invalidates them.
      # ⚠ `nightly-<date>` names the day rustup PUBLISHED the build, and that build is compiled
      # from the PREVIOUS day's commit. This pin therefore resolves to
      # `rustc 1.99.0-nightly (969b803cb 2026-08-09)` [verified by installing it], NOT the
      # `12c36e253 2026-08-10` that the rust-safety programme doc's §7 table cites — that figure
      # came from the ROLLING `nightly` channel and was mislabelled as the dated one. Harmless,
      # but do not "fix" the date to chase that hash: all three steps below were re-run and are
      # green on the dated toolchain this job actually installs.
      MIRI_TOOLCHAIN: nightly-2026-08-10
      # A GUARD, not a fix for a present problem: audit.yml sets no sccache — only ci.yml does, at
      # workflow level (ci.yml:27). `cargo-miri` REPLACES rustc and cannot be wrapped; it prints
      # "Ignoring `RUSTC_WRAPPER` environment variable, Miri does not support wrapping" and
      # carries on [verified]. This keeps a future workflow-level sccache from becoming a puzzle.
      RUSTC_WRAPPER: ""
      # -Zmiri-disable-isolation: pf-gpu's tests mkdir, and Miri aborts them without it [verified].
      # -Zmiri-symbolic-alignment-check: the whole point — it refuses to let an accidentally
      #   favourable stack slot stand in for an alignment guarantee. This is the flag that caught
      #   the pf-driver-proto defect.
      # NOTE the absence of -Zmiri-ignore-leaks. Miri leak-checks by DEFAULT, and that is the one
      #   leak-detection capability it offers here. None of the crates below leaks, so the job is
      #   green. The tree does contain DELIBERATE leaks (pf-umdf-util/src/section.rs `ViewCell`,
      #   gamepad_raii.rs leak-on-timeout) — when coverage ever reaches them, annotate those two
      #   sites; do not blanket-disable the check.
      MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-symbolic-alignment-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two caches, split on purpose so a Cargo.lock change does not re-download a ~400 MB
      # toolchain. Both use their OWN `miri-` key prefix — never a shared one.
      # The Miri sysroot is per-toolchain and per-target (two are built here: host + MSVC), so it
      # belongs with the toolchain, not with the lockfile.
      - name: cache the nightly toolchain + Miri sysroots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/rustup/toolchains/${{ env.MIRI_TOOLCHAIN }}-x86_64-unknown-linux-gnu
            ~/.cache/miri
          key: miri-toolchain-v1-${{ env.MIRI_TOOLCHAIN }}
      - name: cache the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/cargo/registry
          key: miri-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: miri-registry-v1-

      # The image needs no change for this: ci/rust-ci.Dockerfile:51-54 installs via rustup and
      # `chmod -R a+w`s both RUSTUP_HOME and CARGO_HOME, so a job can add a toolchain at runtime.
      # `rust-src` is required — cargo-miri builds its sysroot from source, per target.
      #
      # This does NOT disturb the 1.96.0 pin: `cargo +<toolchain>` overrides rust-toolchain.toml
      # for that single invocation only, so `cargo fmt` / `clippy` keep resolving 1.96.0 and the
      # fmt-parity contract is untouched. The two echo lines below keep that claim
      # honest in the log. They are deliberately NOT `rustup show active-toolchain`: that command
      # RESOLVES the toolchain file and would install the whole 1.96.0 toolchain just to print a
      # line, in a job where every cargo call is `+$MIRI_TOOLCHAIN` and 1.96.0 is never needed.
      # Deliberately NOT `rustup override set` — that writes persistent per-directory state into
      # the runner's rustup config, which leaks into unrelated later jobs on a self-hosted fleet.
      # Deliberately NOT a second rust-toolchain.toml in a subdirectory — that would apply to
      # every cargo invocation under that subtree including fmt, which is the drift the root pin
      # exists to prevent.
      - name: install the pinned nightly + miri
        run: |
          git config --global --add safe.directory "$PWD"
          rustup toolchain install "$MIRI_TOOLCHAIN" \
            --profile minimal \
            --component miri,rust-src \
            --target x86_64-pc-windows-msvc
          echo "root pin, untouched by this job: $(grep -E '^channel' rust-toolchain.toml)"
          cargo +"$MIRI_TOOLCHAIN" --version

      # A run that reports `0 passed` is a selection that matched nothing, not a success — that
      # exact mistake has already cost one round-trip here. So each step below checks a zero exit
      # AND that at least one target reported a non-zero pass count, which is what catches a
      # crate rename or a `--` filter that stops matching. (Each step legitimately prints several
      # `0 passed` lines too — the empty bin/doctest targets — so the check is "at least one
      # non-zero", not "no zeroes".) Expected counts at the time of writing: 21 + 12 + 4.
      - name: miri — FFI-free leaf crates (native)
        run: |
          set -o pipefail
          ok=1
          cargo +"$MIRI_TOOLCHAIN" miri test \
            -p pf-driver-proto -p pf-host-config -p pf-gpu 2>&1 | tee /tmp/miri-native.log || ok=0
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/miri-native.log || ok=0
          [ "$ok" = 1 ] || { echo "::error::miri (FFI-free leaf crates, native) did not pass; see punktfunk-planning design/rust-safety-programme.md §7"; exit 1; }

      # THE step that justifies the job: pf-driver-proto at MSVC layout, on Linux, no Windows box.
      # Expected: 21 passed. If this one ever goes red, treat it as a layout-contract break
      # between the host and driver workspaces until proven otherwise.
      - name: miri — pf-driver-proto at x86_64-pc-windows-msvc layout
        run: |
          set -o pipefail
          ok=1
          cargo +"$MIRI_TOOLCHAIN" miri test \
            -p pf-driver-proto --target x86_64-pc-windows-msvc 2>&1 | tee /tmp/miri-msvc.log || ok=0
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/miri-msvc.log || ok=0
          [ "$ok" = 1 ] || { echo "::error::miri (pf-driver-proto @ MSVC layout) did not pass: this is the layout oracle for every frame and IOCTL; see design/rust-safety-programme.md §7"; exit 1; }

      # fec-rs dispatches its GF(2^8) multiply through RUNTIME `is_x86_feature_detected!`. Under
      # Miri that detection reports the COMPILE-TIME target features, so WITHOUT these RUSTFLAGS
      # the step silently interprets the scalar fallback and is worthless. Verified both ways on
      # 192.168.1.25: bare, `avx2=false ssse3=false`; with the flags, `avx2=true ssse3=true` and
      # `_mm256_shuffle_epi8` genuinely executes under the interpreter. GFNI stays false either
      # way — Miri does not implement it — so the gfni branch is simply not covered here.
      #
      # ⚠ x86_64 ONLY, and it must stay that way. A RUSTFLAGS env var OVERRIDES config rustflags
      # ENTIRELY — it does not merge. That used to cost the aarch64 `--cfg aes_armv8` /
      # `--cfg polyval_armv8` decrypt flags; the aes 0.9 / polyval 0.7 bump retired those cfgs
      # (see the tombstone in .cargo/config.toml), so there is nothing left for an override to
      # drop here. Keep the pin anyway: these target-features are meaningless off x86_64.
      # Narrow selection is mandatory, not an optimisation: see the punktfunk-core note above.
      - name: miri — punktfunk-core fec::gf8, taking the real AVX2/SSSE3 branches
        env:
          RUSTFLAGS: -C target-feature=+avx2,+ssse3
        run: |
          set -o pipefail
          ok=1
          cargo +"$MIRI_TOOLCHAIN" miri test \
            -p punktfunk-core --lib -- fec::gf8 2>&1 | tee /tmp/miri-gf8.log || ok=0
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/miri-gf8.log || ok=0
          [ "$ok" = 1 ] || { echo "::error::miri (punktfunk-core fec::gf8, AVX2/SSSE3) did not pass; see design/rust-safety-programme.md §7"; exit 1; }

  # ASAN + LSAN over the C ABI harness — §6.1 of design/rust-safety-programme.md, its rank-1
  # tooling item. crates/client/punktfunk-ffi/tests/c/run.sh already proves the staticlib links and
  # round-trips 4 frames byte-exact from C on every push (ci.yml); PF_SAN=address rebuilds BOTH
  # sides instrumented — the staticlib on nightly with -Zsanitizer/-Zbuild-std (std itself
  # included), the harness with clang -fsanitize — so ASAN sees the seam a Rust-only tool cannot,
  # and LSAN (detect_leaks=1, the script's default) becomes the one automated check on the ABI's
  # Box::into_raw/from_raw leak contract.
  # Proven to fail on 192.168.1.25: deleting a single punktfunk_session_free() from harness.c
  # makes LSAN report the ~308 Rust-side allocations behind the handle and run.sh exit 1.
  # What it does NOT see: the invalid-InputKind-discriminant UB in the ABI (that needs the
  # validator, tracked in §5 of the programme doc), and nothing GPU/Windows — this is the
  # default-feature (quic-less, opus-less) ABI only.
  c-abi-asan:
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    timeout-minutes: 30
    env:
      # The SAME dated pin as the miri job above, deliberately — one nightly date to bump for
      # both jobs (they have no toolchain interaction; sharing the date just halves the chores).
      SAN_TOOLCHAIN: nightly-2026-08-10
      # Same guard as the miri job: audit.yml sets no sccache today, and -Zbuild-std could not
      # use it anyway. Keeps a future workflow-level sccache from becoming a puzzle.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Own `san-` key prefixes — never shared with the miri caches, per the cache-poisoning
      # note there (and so an incomplete save from one job can never starve the other).
      - name: cache the nightly toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/rustup/toolchains/${{ env.SAN_TOOLCHAIN }}-x86_64-unknown-linux-gnu
          key: san-toolchain-v1-${{ env.SAN_TOOLCHAIN }}
      - name: cache the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/cargo/registry
          key: san-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: san-registry-v1-

      # rust-src is required: -Zbuild-std compiles std from source so it is instrumented too —
      # without that, LSAN cannot attribute allocations made inside std (Vec, Box, HashMap).
      - name: install the pinned nightly + rust-src
        run: |
          git config --global --add safe.directory "$PWD"
          rustup toolchain install "$SAN_TOOLCHAIN" --profile minimal --component rust-src
          echo "root pin, untouched by this job: $(grep -E '^channel' rust-toolchain.toml)"
          cargo +"$SAN_TOOLCHAIN" --version

      # The image installs clang but Ubuntu does not always pull the compiler-rt sanitizer
      # runtime with it (verified absent on a stock 26.04 box). Probe with an actual ASAN link
      # and self-heal via apt if it fails — container jobs on this fleet run as root (the
      # bun-audit job's apt-get above relies on the same fact).
      - name: ensure clang's ASAN runtime
        run: |
          if ! echo 'int main(void){return 0;}' | clang -fsanitize=address -x c - -o /tmp/asan-probe 2>/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
            echo 'int main(void){return 0;}' | clang -fsanitize=address -x c - -o /tmp/asan-probe
          fi

      # run.sh handles everything behind PF_SAN (nightly build, target path, clang flags,
      # ASAN_OPTIONS=detect_leaks=1) and exits non-zero on any report. The grep is the
      # proved-it-ran guard, same reasoning as the miri steps: a script change that silently
      # skips the harness must not read as green. run.sh expects bash and PATH cargo — both true
      # in this container. PF_SAN_TOOLCHAIN pins the script's `cargo +<toolchain>` to the dated
      # nightly installed above — without it the script would ask for the ROLLING `nightly`
      # channel, which this job deliberately does not install.
      - name: C ABI harness under ASAN+LSAN
        run: |
          set -o pipefail
          ok=1
          PF_SAN=address PF_SAN_TOOLCHAIN="$SAN_TOOLCHAIN" \
            bash crates/client/punktfunk-ffi/tests/c/run.sh 2>&1 | tee /tmp/asan-harness.log || ok=0
          grep -q 'PASS: 4 frames round-tripped byte-exact' /tmp/asan-harness.log || ok=0
          [ "$ok" = 1 ] || { echo "::error::c-abi-asan did not pass; see design/rust-safety-programme.md §6.1. An LSAN report here means the C ABI's into_raw/from_raw contract broke."; exit 1; }

  # ── cargo-careful ────────────────────────────────────────────────────────────────────────────
  # The tests ci.yml already runs, against a std rebuilt with its debug assertions on: a
  # `from_raw_parts` or a pointer read on a null or misaligned pointer, a
  # `copy_nonoverlapping` that overlaps, an out-of-range `get_unchecked`, a `mem::zeroed` of a
  # type with no zero value. Unlike miri it runs the real test binary, FFI included, so it
  # reaches the host crates miri cannot. It does not see uninitialised memory.
  #
  # It sees only what a test executes. Every GPU test is `#[ignore]`d and no Windows code
  # compiles here, so most of the host's unsafe stays out of its reach: this checks the paths
  # the existing tests walk, and is no coverage number.
  #
  # NOT BLOCKING until it has a green history: a failure is a warning on the step.
  #
  # MEASURED on 192.168.1.21 (12 cores), on the dated toolchain this job installs, cold target
  # dir and cold sysroot, warm registry:
  #   careful sysroot   17 s
  #   the nine crates  148 s: 2118 passed, 35 ignored. 5.2 GB of target dir.
  # Each crate alone, cold and in this order: pf-driver-proto 49 s, pf-host-config 10,
  # pf-frame 49, punktfunk-core 91, pf-zerocopy 7, pf-encode 28, pf-vdisplay 62, pf-inject 29,
  # pf-capture 39. None is near the ten minutes that would drop it. If you add a crate, measure
  # it first.
  careful:
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    timeout-minutes: 45
    env:
      # The miri, c-abi-asan and fuzz pin: one nightly date to bump for all four.
      CAREFUL_TOOLCHAIN: nightly-2026-08-10
      # Also in the cache key below, so a bump reinstalls instead of finding the old binary.
      CARGO_CAREFUL_VERSION: 0.4.10
      # A rebuilt std could not use sccache; same guard as the jobs above.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Own `careful-` prefixes. The careful sysroot is per toolchain, so it rides with it.
      - name: cache the nightly toolchain and the careful sysroot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/rustup/toolchains/${{ env.CAREFUL_TOOLCHAIN }}-x86_64-unknown-linux-gnu
            ~/.cache/cargo-careful
          key: careful-toolchain-v1-${{ env.CAREFUL_TOOLCHAIN }}
      - name: cache cargo-careful and the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/bin
            /usr/local/cargo/registry
          key: careful-cargo-v1-${{ env.CARGO_CAREFUL_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: careful-cargo-v1-${{ env.CARGO_CAREFUL_VERSION }}-

      - name: install the pinned nightly, rust-src and cargo-careful
        run: |
          git config --global --add safe.directory "$PWD"
          rustup toolchain install "$CAREFUL_TOOLCHAIN" --profile minimal --component rust-src
          echo "root pin, untouched by this job: $(grep -E '^channel' rust-toolchain.toml)"
          command -v cargo-careful >/dev/null 2>&1 || cargo install --locked cargo-careful --version "$CARGO_CAREFUL_VERSION"
          cargo +"$CAREFUL_TOOLCHAIN" careful setup

      # A non-zero pass count is the proved-it-ran guard, as in the miri steps.
      - name: careful — the leaf and host subsystem crates
        run: |
          set -o pipefail
          ok=1
          cargo +"$CAREFUL_TOOLCHAIN" careful test --locked \
            -p pf-driver-proto -p pf-host-config -p pf-frame -p punktfunk-core -p pf-zerocopy \
            -p pf-encode -p pf-vdisplay -p pf-inject -p pf-capture \
            --features punktfunk-core/quic 2>&1 | tee /tmp/careful.log || ok=0
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/careful.log || ok=0
          [ "$ok" = 1 ] || echo "::warning::cargo-careful did not pass; see punktfunk-planning design/rust-safety-programme.md §6.4"

  # ── ThreadSanitizer ──────────────────────────────────────────────────────────────────────────
  # The session, transport, audio and IPC tests with every memory access instrumented: two
  # threads touching one location with no lock or atomic between them, in whatever the tests
  # run. std is rebuilt instrumented too (`-Zbuild-std`); without that its mutexes and channels
  # read as races.
  #
  # WHAT IT CANNOT SEE, which is most of what has actually gone wrong in this tree:
  #   * a GPU-timeline race. The capture ring that rotated onto a slot NVENC was still reading
  #     was ordered by a D3D11 keyed mutex, not by anything a CPU sanitizer models.
  #   * a cross-process race: every shared section the host and a driver or worker both write.
  #   * anything on Windows. TSan has no MSVC target, which removes IDD push, the pad backends
  #     and the driver workspace.
  #   * C it does not instrument (libpipewire, libopus, the GPU drivers), except where that code
  #     calls into libc.
  # So this is CPU concurrency in the host's own Rust on Linux, and no more.
  #
  # ci/tsan.supp holds every race this job hides, each with its reason. A new entry needs one.
  # One test is skipped: it bounds a simulation by wall clock, and the sanitizer is the slowdown.
  #
  # NOT BLOCKING until it has a green history: a report or a failure is a warning on the step.
  #
  # MEASURED on 192.168.1.21 (12 cores), on the dated toolchain this job installs, cold target
  # dir, warm registry:
  #   punktfunk-core + pf-zerocopy   138 s: 1005 passed, 8 ignored. std is rebuilt in this step.
  #   punktfunk-host                 306 s: 1058 passed, 6 ignored
  # 11 GB of target dir. Before ci/tsan.supp existed the same two runs printed 103 reports of
  # three kinds; each kind is an entry there now. If you add a crate, measure it first.
  tsan:
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    timeout-minutes: 60
    env:
      # The miri, c-abi-asan, careful and fuzz pin: one nightly date to bump for all five.
      TSAN_TOOLCHAIN: nightly-2026-08-10
      # -Zbuild-std could not use sccache; same guard as the jobs above.
      RUSTC_WRAPPER: ""
      # x86_64 only. A RUSTFLAGS variable replaces any config rustflags; .cargo/config.toml
      # holds none today and says why. With `--target`, build scripts stay uninstrumented.
      RUSTFLAGS: -Zsanitizer=thread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Own `tsan-` prefixes, never shared with the other sanitizer caches.
      - name: cache the nightly toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/rustup/toolchains/${{ env.TSAN_TOOLCHAIN }}-x86_64-unknown-linux-gnu
          key: tsan-toolchain-v1-${{ env.TSAN_TOOLCHAIN }}
      - name: cache the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/cargo/registry
          key: tsan-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: tsan-registry-v1-

      - name: install the pinned nightly + rust-src
        run: |
          git config --global --add safe.directory "$PWD"
          rustup toolchain install "$TSAN_TOOLCHAIN" --profile minimal --component rust-src
          echo "root pin, untouched by this job: $(grep -E '^channel' rust-toolchain.toml)"
          cargo +"$TSAN_TOOLCHAIN" --version

      # A test binary with a report exits 66 after its tests pass, so `cargo test` fails on one.
      # The pass count is the proved-it-ran guard, as in the miri steps. `--lib --tests` leaves
      # the doc-tests out: rustdoc builds them uninstrumented, and they then refuse to link.
      - name: tsan — punktfunk-core and pf-zerocopy
        run: |
          set -o pipefail
          export TSAN_OPTIONS="suppressions=$PWD/ci/tsan.supp halt_on_error=0"
          ok=1
          cargo +"$TSAN_TOOLCHAIN" test -Zbuild-std --target x86_64-unknown-linux-gnu --locked \
            -p punktfunk-core -p pf-zerocopy --features punktfunk-core/quic --lib --tests -- \
            --skip ten_minutes_at_the_top_of_the_range_simulates_in_under_a_second \
            2>&1 | tee /tmp/tsan-core.log || ok=0
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/tsan-core.log || ok=0
          [ "$ok" = 1 ] || echo "::warning::tsan (punktfunk-core, pf-zerocopy) reported a race or did not pass; see punktfunk-planning design/rust-safety-programme.md §6.3"

      # The host is a binary crate, so its tests are the bin target's.
      - name: tsan — punktfunk-host
        run: |
          set -o pipefail
          export TSAN_OPTIONS="suppressions=$PWD/ci/tsan.supp halt_on_error=0"
          ok=1
          cargo +"$TSAN_TOOLCHAIN" test -Zbuild-std --target x86_64-unknown-linux-gnu --locked \
            -p punktfunk-host --bin punktfunk-host 2>&1 | tee /tmp/tsan-host.log || ok=0
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/tsan-host.log || ok=0
          [ "$ok" = 1 ] || echo "::warning::tsan (punktfunk-host) reported a race or did not pass; see punktfunk-planning design/rust-safety-programme.md §6.3"

  # ── Fuzzing ──────────────────────────────────────────────────────────────────────────────────
  # Three libFuzzer targets (fuzz/) on bytes a peer controls, five minutes each:
  #   core_wire       every decoder punktfunk-core runs on the wire: frames, datagrams, the media
  #                   header, the pairing an older client speaks, mDNS text. A decoder with an
  #                   encoder must also settle: what decodes encodes to bytes that decode the same.
  #   bitstream_plan  the client's H.264, H.265 and AV1 planners on a host's stream, seeded with
  #                   the vendored vectors as they stand.
  #   rtsp            the GameStream RTSP text layer, which a LAN peer reaches before pairing.
  # None of that code holds an unsafe block, so a finding is a panic: a peer stopping a host or
  # a client's decode thread, not a memory bug.
  #
  # `--build-std` builds std under fuzz/Cargo.toml's profile, so it is sanitized and runs its
  # own debug assertions. That manifest also says why the vendored parser alone keeps overflow
  # checks off. The corpus rides a cache: each run starts where the last one stopped.
  #
  # A crash input is uploaded with the run. `cargo fuzz run <target> <file>` replays it; the fix
  # carries the input as a `#[test]` in the crate it hit, where ci.yml replays it on stable.
  #
  # NOT BLOCKING until it has a green history, as miri and c-abi-asan began: a crash or a build
  # failure is a warning on the step.
  #
  # MEASURED on 192.168.1.21 (12 cores), on the dated toolchain this job installs, with a cold
  # target dir and a warm registry:
  #   build    43 s for the first target, which compiles std and every dependency, then 1 s
  #            for each of the other two. 634 MB of target dir.
  #   fuzzing  300 s a target. From an empty corpus core_wire ran 51 000 inputs a second,
  #            rtsp 22 000 and bitstream_plan 2 200.
  #   A `data[0]` planted on the empty input stopped core_wire in 2 s, build included.
  # About 16 minutes in all. The timeout leaves room for a first run that also downloads the
  # toolchain. If you add a target, measure it first.
  fuzz:
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    # Seven targets at five minutes each, after a build that now carries the QUIC stack.
    timeout-minutes: 60
    env:
      # The miri and c-abi-asan pin: one nightly date to bump for all three.
      FUZZ_TOOLCHAIN: nightly-2026-08-10
      # Also in the cache key below, so a bump reinstalls instead of finding the old binary.
      CARGO_FUZZ_VERSION: 0.13.2
      # -Zbuild-std could not use sccache; same guard as the two jobs above.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Own `fuzz-` prefixes, never shared with the miri or san caches.
      - name: cache the nightly toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/rustup/toolchains/${{ env.FUZZ_TOOLCHAIN }}-x86_64-unknown-linux-gnu
          key: fuzz-toolchain-v1-${{ env.FUZZ_TOOLCHAIN }}
      - name: cache cargo-fuzz and the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/bin
            /usr/local/cargo/registry
          key: fuzz-cargo-v1-${{ env.CARGO_FUZZ_VERSION }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: fuzz-cargo-v1-${{ env.CARGO_FUZZ_VERSION }}-
      # A key per run, so every run saves what it found; the prefix restores the newest.
      - name: cache the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: fuzz-corpus-v1-

      - name: install the pinned nightly, rust-src and cargo-fuzz
        run: |
          git config --global --add safe.directory "$PWD"
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --component rust-src
          echo "root pin, untouched by this job: $(grep -E '^channel' rust-toolchain.toml)"
          command -v cargo-fuzz >/dev/null 2>&1 || cargo install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"
          cargo +"$FUZZ_TOOLCHAIN" fuzz --version

      # `Done N runs` is the proved-it-ran guard: a target that never started must not read as
      # green. No `-a`: it would put overflow checks back on the crate the manifest exempts.
      - name: fuzz each target for five minutes
        run: |
          set -o pipefail
          V=crates/codec/pf-bitstream/vendor/cros-codecs/src/codec
          fuzz() {
            t=$1; shift
            ok=1
            cargo +"$FUZZ_TOOLCHAIN" fuzz run --build-std "$t" -- \
              -max_total_time=300 -rss_limit_mb=4096 "$@" 2>&1 | tee "/tmp/fuzz-$t.log" || ok=0
            grep -qE 'Done [0-9]+ runs' "/tmp/fuzz-$t.log" || ok=0
            [ "$ok" = 1 ] || echo "::warning::fuzz target $t found a crash or did not run; its input is in this run's artifacts. See punktfunk-planning design/rust-safety-programme.md §6.2"
          }
          fuzz core_wire
          fuzz rtsp
          fuzz control_wire
          fuzz cursor_shape
          fuzz reassembler -max_len=65536
          # The C behind the audio decoders (libopus) instrumented too: cargo-fuzz sets the
          # Rust side only, and the C objects resolve `__asan_*` against the runtime rustc links.
          (export CC=clang CFLAGS=-fsanitize=address; fuzz audio_plane)
          fuzz bitstream_plan -max_len=16384 \
            -seed_inputs=$V/h264/test_data/64x64-I-P-B-P.h264,$V/h264/test_data/64x64-I-P-B-P-high.h264,$V/h265/test_data/64x64-I-P-B-P.h265,$V/av1/test_data/test-25fps.ivf.av1

      - name: attach crash inputs to the run
        if: always()
        # v3, not v4: Gitea's artifact backend identifies as GHES, which upload-artifact@v4 refuses.
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: fuzz-crash-inputs
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
