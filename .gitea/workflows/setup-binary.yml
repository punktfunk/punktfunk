# Build and publish the guided installer binary that scripts/install.sh fetches.
#
# The stub at the canonical URL is a dumb passthrough: it downloads THIS artifact, checks its
# sha256 and execs it. So this job is what makes `curl | sh` work at all, and it has to have
# run on main at least once before a stub that points at `latest` can ship.
#
# musl needs no C cross-toolchain here — punktfunk-setup is pure Rust, so rust-lld plus the
# target's self-contained crt objects link a static-pie for both architectures (measured:
# ~1 MB, seconds). See design/installer-v2.md D8 and WP4.1.
name: setup-binary
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - crates/install/punktfunk-setup/**
      - crates/host/pf-host-config/**
      - crates/host/pf-paths/**
      - data/platforms.json
      - Cargo.lock
      - .gitea/workflows/setup-binary.yml
  pull_request:
    paths:
      - crates/install/punktfunk-setup/**
      - crates/host/pf-host-config/**
      - crates/host/pf-paths/**
      - data/platforms.json
      - Cargo.lock
      - .gitea/workflows/setup-binary.yml
  workflow_dispatch:

env:
  REGISTRY: git.unom.io
  OWNER: unom
  PKG: punktfunk-setup

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    env:
      # rust-lld and the musl target's bundled crt objects; no musl-gcc anywhere. rustc strips
      # the binary itself: the image's GNU strip cannot read the aarch64 ELF.
      RUSTFLAGS: -C linker=rust-lld -C link-self-contained=yes -C strip=symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked -p punktfunk-setup --target ${{ matrix.target }}
      # A dynamically linked binary would fail on exactly the boxes this exists for: a fresh
      # one, where nothing is installed yet.
      - name: Assert it is static
        run: |
          BIN=target/${{ matrix.target }}/release/punktfunk-setup
          # No PT_INTERP = nothing to load on a pristine box. The ELF type differs by arch —
          # x86_64-musl links static-pie (ET_DYN), aarch64-musl static (ET_EXEC) — so the
          # absent interpreter header is the one invariant. readelf, not file(1): the
          # rust-ci image ships binutils but no file.
          if readelf -l "$BIN" | grep -q 'INTERP'; then
            echo "::error::$BIN has PT_INTERP — dynamically linked, not static"; exit 1
          fi
          ls -l "$BIN"
      - name: Checksum
        run: |
          BIN=target/${{ matrix.target }}/release/punktfunk-setup
          NAME=punktfunk-setup_${{ matrix.arch }}
          cp "$BIN" "$NAME"
          sha256sum "$NAME" | awk '{print $1}' > "$NAME.sha256"
          cat "$NAME.sha256"
      # It has to actually run, not merely link. x86_64 only: the runner cannot execute arm64.
      - name: Smoke the artifact
        if: matrix.arch == 'x86_64'
        run: ./punktfunk-setup_${{ matrix.arch }} --help | grep -q 'PUNKTFUNK_INSTALL_OMARCHY_SETUP'
      # v3: Gitea's API rejects upload-artifact@v4 (see apple.yml). Download is a zip.
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: punktfunk-setup-${{ matrix.arch }}
          path: |
            punktfunk-setup_${{ matrix.arch }}
            punktfunk-setup_${{ matrix.arch }}.sha256
      # publish reads these from the run-scoped cache, not the artifact: the artifact download
      # client re-encodes the storage redirect's presigned URL (%2F -> %252F), which breaks its
      # signature and the storage answers 400. The upload stays for humans.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            punktfunk-setup_${{ matrix.arch }}
            punktfunk-setup_${{ matrix.arch }}.sha256
          key: punktfunk-setup-${{ matrix.arch }}-${{ github.run_id }}

  # The only job that touches the PUBLISHED binary. Everything else builds from the tree, on
  # purpose — the smoke must exercise the checked-out code. This asks the other question: does
  # the thing a user actually reaches still work? A red here means the distribution channel is
  # broken (a bad upload, a missing alias, a stale checksum), not that the code is.
  probe:
    name: probe the published channel
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    timeout-minutes: 10
    steps:
      # nodejs runs actions/checkout below; debian:trixie ships no node.
      - name: Prepare the container
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No PUNKTFUNK_SETUP_BIN: the stub downloads `latest` and verifies its checksum, exactly
      # as it does on a user's box. --dry-run so nothing is installed.
      - name: The stub fetches the published binary and runs it
        run: |
          sh scripts/install.sh --dry-run --yes \
            | grep -q 'sudo apt install -y punktfunk-host punktfunk-web punktfunk-scripting'

  publish:
    name: publish to the generic registry
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: 192.168.1.58:5010/punktfunk-rust-ci:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            punktfunk-setup_x86_64
            punktfunk-setup_x86_64.sha256
          key: punktfunk-setup-x86_64-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            punktfunk-setup_aarch64
            punktfunk-setup_aarch64.sha256
          key: punktfunk-setup-aarch64-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Publish
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          BASE="https://${REGISTRY}/api/packages/${OWNER}/generic/${PKG}"
          # The versioned path is immutable (409 on a repeat is fine); the `latest` alias is
          # what the stub fetches, so it is deleted and re-uploaded.
          for f in punktfunk-setup_x86_64 punktfunk-setup_x86_64.sha256 \
                   punktfunk-setup_aarch64 punktfunk-setup_aarch64.sha256; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --user "enricobuehler:${REGISTRY_TOKEN}" \
              --upload-file "$f" "$BASE/$VERSION/$f")
            case "$code" in
              2*) echo "published ($code): $VERSION/$f" ;;
              409) echo "already published (409, immutable): $VERSION/$f" ;;
              *) echo "::error::upload failed (HTTP $code): $VERSION/$f"; exit 1 ;;
            esac
            curl -fsS -o /dev/null --user "enricobuehler:${REGISTRY_TOKEN}" \
              -X DELETE "$BASE/latest/$f" 2>/dev/null || true
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --user "enricobuehler:${REGISTRY_TOKEN}" \
              --upload-file "$f" "$BASE/latest/$f")
            case "$code" in
              2*) echo "published ($code): latest/$f" ;;
              *) echo "::error::alias upload failed (HTTP $code): latest/$f"; exit 1 ;;
            esac
          done
