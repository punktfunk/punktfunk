# The macOS host on the self-hosted `macos-arm64` runner (home-mac-mini-1;
# scripts/ci/setup-macos-runner.sh), in dependency order:
#
#   check    — `punktfunk-host` compiles for Apple silicon, and the installer engine's tests pass.
#              Pushes and pull requests.
#   package  — needs: check. The release build, the web console and runner payloads, the menu bar
#              UI, "Punktfunk Host.app" and its disk image (packaging/macos/README.md). Never on a
#              pull request. A stable tag, or a dispatch with `dmg`, signs with Developer ID,
#              notarizes and publishes the image as apple.yml's `distribute` does the client's;
#              any other push builds an ad hoc image, checks it and drops it.
#
# Not a job in apple.yml: that workflow's `paths:` are the client's, so a host edit would never
# fire it, and its `distribute` must not wait on a host build.
#
# Secrets for a release: MACOS_HOST_PROFILE (the host's Developer ID provisioning profile,
# base64), ASC_API_KEY_P8 / ASC_API_KEY_ID / ASC_API_ISSUER_ID (notarization, as apple.yml),
# REGISTRY_TOKEN (release attachment and registry). The Developer ID Application identity signs
# from the runner user's login keychain, as in apple.yml.
name: macos-host

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '.cargo/**'
      - 'crates/client/punktfunk-ffi/**'
      - 'crates/codec/pf-bitstream/**'
      - 'crates/core/pf-update-check/**'
      - 'crates/core/punktfunk-core/**'
      - 'l10n/**'
      - 'crates/host/pf-audio/**'
      - 'crates/host/pf-capture/**'
      - 'crates/host/pf-clipboard/**'
      - 'crates/host/pf-driver-proto/**'
      - 'crates/host/pf-encode/**'
      - 'crates/host/pf-encode-core/**'
      - 'crates/host/pf-frame/**'
      - 'crates/host/pf-gpu/**'
      - 'crates/host/pf-host-config/**'
      - 'crates/host/pf-inject/**'
      - 'crates/host/pf-paths/**'
      - 'crates/host/pf-paths-win/**'
      - 'crates/host/pf-portal/**'
      - 'crates/host/pf-seats/**'
      - 'crates/host/pf-vdisplay/**'
      - 'crates/host/pf-win-display/**'
      - 'crates/host/pf-zerocopy/**'
      - 'crates/host/punktfunk-host/**'
      - 'crates/install/punktfunk-setup/**'
      - 'packaging/macos/**'
      - 'web/**'
      - 'sdk/**'
      - 'ci/bun.env'
      - 'LICENSE-MIT'
      - 'LICENSE-APACHE'
      - 'THIRD-PARTY-NOTICES.txt'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/ci/ensure-sccache.sh'
      - 'scripts/ci/mac-cargo-target.sh'
      - 'scripts/ci/pf-version.sh'
      - 'scripts/ci/gitea-release.sh'
      - 'ci/install-rustup.sh'
      - 'ci/rustup.env'
      - '.gitea/workflows/macos-host.yml'
    # A `vX.Y.Z` tag is the release; tag runs skip the paths filter.
    tags: ['v*']
  pull_request:
    paths:
      - '.cargo/**'
      - 'crates/client/punktfunk-ffi/**'
      - 'crates/codec/pf-bitstream/**'
      - 'crates/core/pf-update-check/**'
      - 'crates/core/punktfunk-core/**'
      - 'l10n/**'
      - 'crates/host/pf-audio/**'
      - 'crates/host/pf-capture/**'
      - 'crates/host/pf-clipboard/**'
      - 'crates/host/pf-driver-proto/**'
      - 'crates/host/pf-encode/**'
      - 'crates/host/pf-encode-core/**'
      - 'crates/host/pf-frame/**'
      - 'crates/host/pf-gpu/**'
      - 'crates/host/pf-host-config/**'
      - 'crates/host/pf-inject/**'
      - 'crates/host/pf-paths/**'
      - 'crates/host/pf-paths-win/**'
      - 'crates/host/pf-portal/**'
      - 'crates/host/pf-seats/**'
      - 'crates/host/pf-vdisplay/**'
      - 'crates/host/pf-win-display/**'
      - 'crates/host/pf-zerocopy/**'
      - 'crates/host/punktfunk-host/**'
      - 'crates/install/punktfunk-setup/**'
      - 'packaging/macos/**'
      - 'web/**'
      - 'sdk/**'
      - 'ci/bun.env'
      - 'LICENSE-MIT'
      - 'LICENSE-APACHE'
      - 'THIRD-PARTY-NOTICES.txt'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/ci/ensure-sccache.sh'
      - 'scripts/ci/mac-cargo-target.sh'
      - 'scripts/ci/pf-version.sh'
      - 'scripts/ci/gitea-release.sh'
      - 'ci/install-rustup.sh'
      - 'ci/rustup.env'
      - '.gitea/workflows/macos-host.yml'
  workflow_dispatch:
    inputs:
      dmg:
        description: "Sign, notarize and publish the host image to the registry's canary/ path (true/false)"
        required: false
        default: "false"

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: unom-ci-sccache
  SCCACHE_ENDPOINT: https://storage.unom.io
  SCCACHE_REGION: home-central
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
  CARGO_INCREMENTAL: "0"

jobs:
  # SECURITY: same caveat as apple.yml's `swift` job — this compiles PULL-REQUEST code on the
  # host-mode, persistent runner that apple.yml's signing job also uses. The `if:` is the same
  # fail-closed backstop: only a PR whose head repo IS this repo runs.
  check:
    runs-on: macos-arm64
    if: >-
      gitea.event_name != 'pull_request' ||
      gitea.event.pull_request.head.repo.full_name == gitea.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (self-healing on a fresh runner)
        run: |
          if ! command -v rustup >/dev/null && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            sh ci/install-rustup.sh -y --no-modify-path --profile minimal
          fi
          RUSTUP="$(command -v rustup || echo "$HOME/.cargo/bin/rustup")"
          dirname "$RUSTUP" >> "$GITHUB_PATH"

      # target/ outlives the job on this persistent runner (see the script), so a run recompiles
      # only what changed.
      - name: Persistent cargo target dir
        run: |
          dir="$(sh scripts/ci/mac-cargo-target.sh macos-host)"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      # Cargo judges path crates by mtime, and this checkout is new. Every job that builds into
      # this target dir must run this first: scripts/ci/src-mtimes.rs.
      - name: Carry source mtimes (unchanged crates stay fresh)
        continue-on-error: true
        run: |
          rustc -O scripts/ci/src-mtimes.rs -o "$RUNNER_TEMP/src-mtimes"
          "$RUNNER_TEMP/src-mtimes" "$CARGO_TARGET_DIR"

      - name: sccache (self-healing install)
        run: sh scripts/ci/ensure-sccache.sh

      # The mic pump decodes with `opus`, which vendors libopus through CMake — the same
      # requirement, and the same self-healing install, as apple.yml's xcframework build.
      - name: CMake (for the vendored libopus builds)
        run: |
          # Runner steps run with `bash --noprofile --norc`, so Homebrew's bin dir isn't on PATH.
          for B in /opt/homebrew/bin/brew /usr/local/bin/brew; do [ -x "$B" ] && BREW="$B" && break; done
          if [ -z "$BREW" ]; then echo "::error::Homebrew not found on the runner"; exit 1; fi
          BREW_BIN="$(dirname "$BREW")"; export PATH="$BREW_BIN:$PATH"
          command -v cmake >/dev/null || "$BREW" install cmake
          echo "$BREW_BIN" >> "$GITHUB_PATH"

      # `check`, not `clippy`, and no `-D warnings`: the graph carries code that is dead on macOS
      # (`pf-encode::vbv_frames_env`, the `hidout` sink in `native/input.rs`). Failing the gate on
      # that would only teach people to ignore it. This asks one question — does it compile.
      - name: Check (punktfunk-host, default features)
        run: cargo check -p punktfunk-host --locked

      # Tests, not `check`: the installer engine promises the whole flow is reviewable off-box
      # (design/installer-v2.md D9), and that only stays true while facts/plan take no unix-only
      # type. This runner is what enforces it — the suite is pure and needs no Linux.
      - name: Test (punktfunk-setup, the installer engine)
        run: cargo test -p punktfunk-setup --locked

      - name: sccache stats (visibility only)
        if: always()
        run: sccache --show-stats

  # Never on a pull request: a release run loads signing material on this shared runner.
  package:
    needs: check
    if: gitea.event_name != 'pull_request'
    runs-on: macos-arm64
    timeout-minutes: 120
    env:
      TEAM_ID: F4H37KF6WC
      RELEASE: ${{ startsWith(gitea.ref, 'refs/tags/v') || inputs.dmg == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Xcode for the UI build, actool and notarytool only; cargo keeps the system linker, as in
      # apple.yml.
      - name: Select release Xcode
        run: |
          DEV_DIR=""
          for app in /Applications/Xcode.app /Applications/Xcode_*.app /Applications/Xcode-*.app; do
            case "$app" in *beta*|*Beta*) continue;; esac
            [ -x "$app/Contents/Developer/usr/bin/xcodebuild" ] && DEV_DIR="$app/Contents/Developer" && break
          done
          [ -n "$DEV_DIR" ] || { echo "::error::no release Xcode on the runner"; exit 1; }
          echo "XCODE_DEV_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEV_DIR" xcodebuild -version

      - name: Version
        run: |
          eval "$(bash scripts/ci/pf-version.sh)"
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}"; V="${V%%-*}" ;;
            *)            V="$PF_BASE" ;;
          esac
          printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z, got '$V'"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: |
          RUSTUP="$(command -v rustup || echo "$HOME/.cargo/bin/rustup")"
          dirname "$RUSTUP" >> "$GITHUB_PATH"

      # The cargo target dir, bun and dmgbuild (both pinned by hash) outlive the job here.
      - name: Persistent dirs
        run: |
          dir="$(sh scripts/ci/mac-cargo-target.sh macos-host)"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "PF_CACHE=$HOME/ci/packaging-cache" >> "$GITHUB_ENV"

      - name: Carry source mtimes (unchanged crates stay fresh)
        continue-on-error: true
        run: |
          rustc -O scripts/ci/src-mtimes.rs -o "$RUNNER_TEMP/src-mtimes"
          "$RUNNER_TEMP/src-mtimes" "$CARGO_TARGET_DIR"

      - name: sccache (self-healing install)
        run: sh scripts/ci/ensure-sccache.sh

      # CMake for the vendored libopus; Python 3.10 or later for dmgbuild.
      - name: CMake + Python (self-healing install)
        run: |
          for B in /opt/homebrew/bin/brew /usr/local/bin/brew; do [ -x "$B" ] && BREW="$B" && break; done
          if [ -z "$BREW" ]; then echo "::error::Homebrew not found on the runner"; exit 1; fi
          BREW_BIN="$(dirname "$BREW")"; export PATH="$BREW_BIN:$PATH"
          command -v cmake >/dev/null || "$BREW" install cmake
          echo "$BREW_BIN" >> "$GITHUB_PATH"
          PY="$BREW_BIN/python3.13"
          [ -x "$PY" ] || "$BREW" install python@3.13
          echo "PF_PYTHON=$PY" >> "$GITHUB_ENV"

      - name: Build the host (release)
        env:
          PUNKTFUNK_BUILD_VERSION: ${{ env.VERSION }}
        run: cargo build --release -p punktfunk-host --locked

      - name: bun, the web console and the plugin runner
        run: |
          BUN="$(sh packaging/macos/fetch-bun.sh "$PF_CACHE")"
          echo "BUN=$BUN" >> "$GITHUB_ENV"
          bash scripts/ci/retry.sh 3 sh packaging/macos/build-payloads.sh -u "$BUN" -o "$RUNNER_TEMP/payloads"

      # A release signs with Developer ID and the host's Developer ID profile; any other run signs
      # ad hoc, which needs neither.
      - name: Bundle
        env:
          HOST_PROFILE: ${{ secrets.MACOS_HOST_PROFILE }}
        run: |
          if [ "$RELEASE" = true ]; then
            if [ -z "$HOST_PROFILE" ]; then
              echo "::error::MACOS_HOST_PROFILE is empty: a release needs the host's Developer ID profile (packaging/macos/README.md)"
              exit 1
            fi
            printf '%s' "$HOST_PROFILE" | base64 -D > "$RUNNER_TEMP/host.provisionprofile"
            export PF_IDENTITY="Developer ID Application" PF_PROFILE="$RUNNER_TEMP/host.provisionprofile" PF_TEAM_ID="$TEAM_ID"
          else
            export PF_IDENTITY=-
          fi
          APP="$(DEVELOPER_DIR="$XCODE_DEV_DIR" sh packaging/macos/bundle.sh \
            -b "$CARGO_TARGET_DIR/release/punktfunk-host" -v "$VERSION" -o "$RUNNER_TEMP/dist" \
            -u "$BUN" -w "$RUNNER_TEMP/payloads")"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "IDENTITY=$PF_IDENTITY" >> "$GITHUB_ENV"

      # Everything runs from inside the signed bundle: the profile matches the host's
      # entitlements, bun's JIT entitlements hold, and the console boots on the bundled bun.
      - name: Smoke the bundle
        run: |
          "$APP/Contents/MacOS/punktfunk-host" --version
          "$APP/Contents/Helpers/bun" --version
          "$APP/Contents/Helpers/bun" -e 'let s = 0; for (let i = 0; i < 1e8; i++) s += i % 7; console.log(s)'
          mkdir -p "$RUNNER_TEMP/web-smoke"
          PORT=3019 HOST=127.0.0.1 PUNKTFUNK_UI_PASSWORD=ci PUNKTFUNK_CONFIG_DIR="$RUNNER_TEMP/web-smoke" \
            "$APP/Contents/Helpers/bun" "$APP/Contents/Resources/web/.output/server/index.mjs" &
          NP=$!; sleep 4
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3019/login || echo 000)
          kill "$NP" 2>/dev/null || true
          echo "web console from the bundle: /login -> $code"
          [ "$code" = 200 ] || { echo "::error::the bundled web console didn't boot"; exit 1; }

      - name: Stage App Store Connect API key
        if: startsWith(gitea.ref, 'refs/tags/v') || inputs.dmg == 'true'
        env:
          ASC_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_P8" > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"

      # Release order: notarize the app and staple it, then build, sign and notarize the image.
      - name: Notarize the app
        if: startsWith(gitea.ref, 'refs/tags/v') || inputs.dmg == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          export ASC_API_KEY_PATH="$RUNNER_TEMP/asc.p8" DEVELOPER_DIR="$XCODE_DEV_DIR"
          sh packaging/macos/notarize.sh "$APP"

      - name: Disk image
        run: |
          DMG="$(sh packaging/macos/dmg.sh -a "$APP" -v "$VERSION" -i "$IDENTITY" -o "$RUNNER_TEMP/dist")"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize the disk image
        if: startsWith(gitea.ref, 'refs/tags/v') || inputs.dmg == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          export ASC_API_KEY_PATH="$RUNNER_TEMP/asc.p8" DEVELOPER_DIR="$XCODE_DEV_DIR"
          sh packaging/macos/notarize.sh "$DMG"

      - name: Attach the image to the Gitea release (stable tags only)
        if: startsWith(gitea.ref, 'refs/tags/v')
        env:
          GITEA_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          . scripts/ci/gitea-release.sh
          RID=$(ensure_release "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" auto)
          upsert_asset "$RID" "$DMG" "Punktfunk-Host-$VERSION.dmg"

      # As apple.yml: a tag fills the immutable versioned path and latest/, a dispatch canary/.
      - name: Publish the image to the generic registry
        if: startsWith(gitea.ref, 'refs/tags/v') || inputs.dmg == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          BASE="https://git.unom.io/api/packages/unom/generic/punktfunk-host-macos"
          put() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --user "enricobuehler:$REGISTRY_TOKEN" --upload-file "$1" "$2")
            case "$code" in
              2*|409) echo "published ($code): $2" ;;
              *) echo "upload failed (HTTP $code): $2"; exit 1 ;;
            esac
          }
          case "$GITHUB_REF" in
            refs/tags/v*) put "$DMG" "$BASE/$VERSION/Punktfunk-Host-$VERSION.dmg"; ALIAS=latest ;;
            *) ALIAS=canary ;;
          esac
          curl -sS -o /dev/null --user "enricobuehler:$REGISTRY_TOKEN" -X DELETE "$BASE/$ALIAS/Punktfunk-Host.dmg" || true
          put "$DMG" "$BASE/$ALIAS/Punktfunk-Host.dmg"

      - name: Drop the signing inputs
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/host.provisionprofile"

      - name: sccache stats (visibility only)
        if: always()
        run: sccache --show-stats
