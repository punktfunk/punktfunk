# Build the punktfunk Decky Loader plugin (Gaming-Mode QAM launcher) into a distribution zip
# and publish it to Gitea's GENERIC package registry, giving Decky's "install from URL" a
# stable link. On tags the zip is ALSO attached to the Gitea release.
#
#   PUT/GET  https://git.unom.io/api/packages/unom/generic/punktfunk-decky/<version>/punktfunk.zip
#
# The plugin backend is PURE PYTHON (clients/decky/main.py — no compiled binary), so we do NOT
# need the Decky CLI (which requires Docker + rust-nightly only to compile native backends).
# We build the frontend with pnpm and stage the store-layout tree with the SAME script local
# builds use (clients/decky/scripts/package.sh) — the plugin's file list lives in exactly ONE
# place, so a file added there (bin/, assets/, controller_config/, …) can never be silently
# missing from the published build. (Hand-assembling the zip here is how the shipped plugin
# lost the shortcut artwork + Steam Input layout for a while.) CI only adds `update.json` on
# top: the {channel, manifest} pointer the plugin's self-update check polls.
#
# SELF-UPDATE (no Decky store): alongside the zip we also publish a tiny per-channel
# `manifest.json` ({version, artifact=<that channel's alias zip URL>, sha256}). The installed
# plugin polls it (main.py check_update), and the frontend drives Decky's own install RPC to
# apply a newer build. See clients/decky/README.md "Updating".
#
# REGISTRY_TOKEN: repo Actions secret, a PAT with write:package scope (shared with deb/rpm/docker).
name: decky
# One pending run per workflow+ref: a newer push supersedes the queued/running one and cancels
# it (a canary only needs the latest commit; each release tag is its own ref so tag runs never
# cancel each other). Keeps a busy push cadence from piling ~10 queued runs per commit onto the
# runner fleet. Gitea honors this for push triggers (PR triggers: see gitea#35933).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
    # Scope canary builds to what this artifact is built FROM — a docs-only or
    # web-only push should not light up the whole fleet. Applies to branch pushes;
    # tag runs are matched by `tags:` (proven by flatpak/windows-msix releases).
    paths:
      - 'clients/decky/**'
      - 'scripts/ci/gitea-release.sh'
      - 'scripts/ci/pf-version.sh'
      - '.gitea/workflows/decky.yml'
      - 'l10n/**'
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: git.unom.io
  OWNER: unom
  PACKAGE: punktfunk-decky        # generic-registry package name
  # The plugin's ON-DISK dir == the zip's top-level dir. Deliberately NOT plugin.json "name"
  # (that is the brand-cased label Decky lists, and it locates a plugin by matching it, not by
  # the folder) — see clients/decky/scripts/package.sh.
  PLUGIN: punktfunk

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: node:22-bookworm     # node + corepack(pnpm); matches the @decky toolchain
    defaults:
      run:
        working-directory: clients/decky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm
        run: |
          corepack enable
          # The repo's pnpm-lock.yaml + package.json devDeps target pnpm 9 (the version the
          # @decky toolchain and the local build use). Pin it so --frozen-lockfile holds.
          corepack prepare pnpm@9 --activate

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build          # rollup -> clients/decky/dist/index.js

      - name: Version + channel + stamp
        # Tag vX.Y.Z -> X.Y.Z (stable `latest/` alias + Gitea Release); main push -> <next-minor>.<run>
        # (base one minor ahead of the latest stable tag via scripts/ci/pf-version.sh)
        # (`canary/` alias). Decky reads a plugin's INSTALLED version from package.json (NOT
        # plugin.json), and the plugin's own update check (clients/decky/main.py check_update)
        # compares against it — so the build version is STAMPED into package.json here (mirrored
        # into plugin.json for store parity). Canary is a PLAIN numeric semver, never a
        # `-ci<N>` prerelease: compare-versions orders prerelease identifiers lexically
        # (ci10 < ci9), which would break update detection; the run number is monotonic.
        working-directory: ${{ gitea.workspace }}
        run: |
          eval "$(bash scripts/ci/pf-version.sh)"   # -> PF_MAJOR/PF_MINOR (base one minor ahead of latest stable)
          case "$GITHUB_REF" in
            # A release refreshes canary/ too: it is newer than every canary built before it,
            # and the next push under clients/decky may be weeks away. That copy is numbered
            # like every canary, one minor ahead (pf-version.sh's rule).
            refs/tags/v*) V="${GITHUB_REF_NAME#v}"; ALIAS=latest
                          CANARY_VERSION="${PF_MAJOR}.$((PF_MINOR + 1)).${GITHUB_RUN_NUMBER}" ;;
            # Canary MUST be a plain monotonic numeric semver (see the note above): <major>.<minor>.<run>,
            # where major.minor track one minor ahead of the latest stable and the run number climbs.
            *)            V="${PF_MAJOR}.${PF_MINOR}.${GITHUB_RUN_NUMBER}"; ALIAS=canary; CANARY_VERSION="" ;;
          esac
          BASE="https://$REGISTRY/api/packages/$OWNER/generic/$PACKAGE"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "CANARY_VERSION=$CANARY_VERSION" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "decky version $V -> alias '$ALIAS'${CANARY_VERSION:+ (+ canary $CANARY_VERSION)}"
          VERSION="$V" node -e 'const fs=require("fs");for(const f of ["clients/decky/package.json","clients/decky/plugin.json"]){const j=JSON.parse(fs.readFileSync(f,"utf8"));j.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n");}'

      - name: Assemble store-layout zip
        working-directory: ${{ gitea.workspace }}
        run: |
          # node:22-bookworm ships python3 (a package.sh dep) but not zip; install both anyway
          # so an image change can't silently break the build.
          apt-get update && apt-get install -y --no-install-recommends zip python3 >/dev/null
          # Stage the canonical plugin tree (dist/, main.py, py_modules/, bin/, assets/,
          # controller_config/, LICENSE, …) with the same script local/sideload builds use — see
          # the header comment.
          # Runs AFTER the version stamp, so the staged package.json carries $VERSION.
          bash clients/decky/scripts/package.sh
          DEST="clients/decky/out/$PLUGIN"
          # One zip per channel this run feeds. They differ only in the stamped version and in
          # update.json, the {channel, manifest} pointer the backend polls (main.py
          # check_update). The manifest names the channel's ALIAS zip, uploaded right beside it:
          # the registry's cleanup rule prunes canary version numbers after a week, so a
          # per-version URL 404s as soon as the newest canary build is that old.
          bundle() {  # <version> <alias>  ->  $RUNNER_TEMP/<alias>/{punktfunk.zip,manifest.json}
            local v="$1" alias="$2" out="$RUNNER_TEMP/$2" f sha
            mkdir -p "$out"
            for f in package.json plugin.json; do
              VERSION="$v" node -e 'const fs=require("fs"),f=process.argv[1];const j=JSON.parse(fs.readFileSync(f,"utf8"));j.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n");' "$DEST/$f"
            done
            printf '{"channel":"%s","manifest":"%s/%s/manifest.json"}\n' "$alias" "$BASE" "$alias" > "$DEST/update.json"
            rm -f "$out/punktfunk.zip"
            ( cd clients/decky/out && zip -r "$out/punktfunk.zip" "$PLUGIN" )
            # Backstop against packaging drift: the runtime-loaded pieces MUST be in the zip.
            # A missing backend module is a dead backend, and the self-update runs through it.
            for f in main.py dist/index.js bin/punktfunkrun.sh assets/grid.png \
                     controller_config/punktfunk.vdf update.json \
                     py_modules/pf_decky/__init__.py py_modules/pf_decky/client.py \
                     py_modules/pf_decky/steam_input.py py_modules/pf_decky/update.py; do
              unzip -l "$out/punktfunk.zip" "$PLUGIN/$f" >/dev/null || { echo "MISSING $f" >&2; exit 1; }
            done
            # Decky verifies the download against this hash and aborts on a mismatch.
            sha=$(sha256sum "$out/punktfunk.zip" | cut -d' ' -f1)
            printf '{"version":"%s","artifact":"%s/%s/punktfunk.zip","sha256":"%s"}\n' \
              "$v" "$BASE" "$alias" "$sha" > "$out/manifest.json"
            cat "$out/manifest.json"
          }
          bundle "$VERSION" "$ALIAS"
          [ -z "$CANARY_VERSION" ] || bundle "$CANARY_VERSION" canary
          ls -lh "$RUNNER_TEMP"/*/punktfunk.zip
          unzip -l "$RUNNER_TEMP/$ALIAS/punktfunk.zip"

      - name: Publish to the Gitea generic registry
        working-directory: ${{ gitea.workspace }}
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          BASE="https://$REGISTRY/api/packages/$OWNER/generic/$PACKAGE"
          # Per channel: the versioned copy (a pinnable URL, also the release asset), then the
          # alias the manifest names and "install from URL" links to. The registry 409s a
          # re-upload of an existing version/file (a re-tagged release re-fires this workflow),
          # so delete any prior copy first (404 on the first publish is fine). The zip lands
          # before the manifest, so a manifest never names a zip that is not there yet.
          publish() {  # <version> <alias>
            local dest f
            for dest in "$1" "$2"; do
              for f in punktfunk.zip manifest.json; do
                curl -fsS -o /dev/null --user "enricobuehler:$TOKEN" -X DELETE "$BASE/$dest/$f" || true
                curl -fsS --user "enricobuehler:$TOKEN" --upload-file "$RUNNER_TEMP/$2/$f" "$BASE/$dest/$f"
              done
            done
            echo "install-from-URL link: $BASE/$2/punktfunk.zip"
            echo "update manifest:       $BASE/$2/manifest.json"
          }
          publish "$VERSION" "$ALIAS"
          [ -z "$CANARY_VERSION" ] || publish "$CANARY_VERSION" canary

      - name: Attach zip to the Gitea release (stable tags only)
        if: startsWith(gitea.ref, 'refs/tags/v')
        working-directory: ${{ gitea.workspace }}
        env:
          GITEA_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          . scripts/ci/gitea-release.sh
          RID=$(ensure_release "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" auto)
          upsert_asset "$RID" "$RUNNER_TEMP/$ALIAS/punktfunk.zip" "punktfunk-${VERSION}.zip"
