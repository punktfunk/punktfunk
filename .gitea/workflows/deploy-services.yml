# Deploy-only: bring up the unom-1 pieces that live in THIS repo but whose normal deploys
# are coupled to heavy build workflows — docs to docker.yml's 5-image matrix, the flatpak
# server to flatpak.yml's full flatpak-builder run, the nix cache to nix.yml's full Rust
# build. This workflow does NONE of those builds: it just (re)places the compose files and
# pulls the already-published images, so unom/infra's deploy-all can bring a fresh unom-1
# fully up in a single dispatch without triggering those rebuilds.
#
#   docs      -> pulls git.unom.io/unom/punktfunk-docs:latest (built by docker.yml) and
#                brings it up on :3220.
#   flatpak   -> brings up the caddy:2-alpine static server on :3230. The OSTree repo
#                CONTENT (./site) is NOT shipped here — it is regenerated by flatpak.yml
#                on the next client build, or restored from the unom-1 backup
#                (unom/infra scripts/restore-unom-1.sh, `files` tag). A fresh box serves
#                an empty repo until then; that is expected.
#   nix-cache -> brings up the caddy:2-alpine Nix binary cache on :3250. Same content/config
#                split: the cache CONTENT is republished by nix.yml on the next main push
#                that moves the flake. An empty cache is harmless — every path 404s and
#                users build from source, which is the pre-cache status quo.
#   winget    -> brings up the winget REST source on :3240; catalogue shipped by
#                windows-host.yml on stable tags.
#
# Dispatched by unom/infra scripts/deploy-all.sh: `dispatch-and-wait.sh punktfunk
# deploy-services.yml`. Same secrets as docker.yml/flatpak.yml: DEPLOY_HOST/USER/PORT/SSH_KEY,
# DEPLOY_KNOWN_HOSTS (the pinned host key, scripts/ci/unom1-ssh.sh) and REGISTRY_TOKEN.
# A `deploy_host` input is a box deploy-all just provisioned; its new host key is accepted.
name: deploy-services
run-name: ${{ gitea.actor }} deploy docs + flatpak server

on:
  workflow_dispatch:
    inputs:
      deploy_host:
        description: "Box IP to deploy to; deploy-all passes the freshly-provisioned target IP. Blank (push) uses the DEPLOY_HOST secret."
        required: false

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync compose file, pull and start docs
        env:
          DEPLOY_HOST: ${{ inputs.deploy_host || secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          UNOM1_TRUST_NEW: ${{ inputs.deploy_host && '1' || '0' }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          . scripts/ci/unom1-ssh.sh
          $SSH "$DEST" 'mkdir -p ~/punktfunk-docs'
          $SCP compose.production.yml "$DEST:punktfunk-docs/"
          # The token rides stdin, never the command line. Logged out on every exit path.
          printf '%s' "$REGISTRY_TOKEN" | $SSH "$DEST" 'set -eu
            trap "docker logout git.unom.io >/dev/null 2>&1 || true" EXIT
            docker login git.unom.io -u enricobuehler --password-stdin
            cd ~/punktfunk-docs
            docker compose -f compose.production.yml pull docs
            docker compose -f compose.production.yml up -d --no-build docs'

  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync the flatpak server and start it
        env:
          DEPLOY_HOST: ${{ inputs.deploy_host || secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          UNOM1_TRUST_NEW: ${{ inputs.deploy_host && '1' || '0' }}
        run: |
          . scripts/ci/unom1-ssh.sh
          # ./site (the OSTree repo) is NOT shipped here. The bind-mount source must exist for
          # caddy to start; content comes from the unom-1 backup or flatpak.yml's next publish.
          $SSH "$DEST" 'mkdir -p ~/unom-flatpak/site/repo'
          $SCP packaging/flatpak/server/compose.production.yml packaging/flatpak/server/Caddyfile \
            "$DEST:unom-flatpak/"
          $SSH "$DEST" 'set -eu
            cd ~/unom-flatpak
            docker compose -f compose.production.yml up -d'

  nix-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync the nix cache server and start it
        env:
          DEPLOY_HOST: ${{ inputs.deploy_host || secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          UNOM1_TRUST_NEW: ${{ inputs.deploy_host && '1' || '0' }}
        run: |
          . scripts/ci/unom1-ssh.sh
          # ./site (the cache content) is NOT shipped here: nix.yml rsyncs it. An empty cache
          # 404s every path and users build from source.
          $SSH "$DEST" 'mkdir -p ~/unom-nix-cache/site/nar'
          $SCP packaging/nix/server/compose.production.yml packaging/nix/server/Caddyfile \
            packaging/nix/server/prune.sh "$DEST:unom-nix-cache/"
          $SSH "$DEST" 'set -eu
            cd ~/unom-nix-cache
            docker compose -f compose.production.yml up -d
            sleep 3
            curl -fsS http://127.0.0.1:3250/nix-cache-info \
              || echo "NOTE: no cache content yet - push to main with the flake touched to populate it"'

  winget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync the winget REST source and start it
        env:
          DEPLOY_HOST: ${{ inputs.deploy_host || secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          UNOM1_TRUST_NEW: ${{ inputs.deploy_host && '1' || '0' }}
        run: |
          . scripts/ci/unom1-ssh.sh
          # ./data/data.json is NOT shipped here: windows-host.yml ships it on each stable tag.
          # The container serves 503 until the first catalogue lands.
          $SSH "$DEST" 'mkdir -p ~/unom-winget/data'
          $SCP packaging/winget/server/compose.production.yml packaging/winget/server/server.mjs \
            packaging/winget/server/handler.mjs "$DEST:unom-winget/"
          $SSH "$DEST" 'set -eu
            cd ~/unom-winget
            # Recreate: the server imports handler.mjs once, and an unchanged compose file
            # would leave the running container on the old code.
            docker compose -f compose.production.yml up -d --force-recreate
            sleep 3
            curl -fsS http://127.0.0.1:3240/healthz \
              || echo "NOTE: no catalogue yet - publish a stable tag to populate it"'
