# Engine tests on real Windows. The Linux/macOS lanes run this suite too, but they cannot see
# Windows-only failure modes — the first real run caught three (backslash joins leaking into
# transcripts, autocrlf corrupting the golden fixtures, console's Windows-only encode_unicode
# dep breaking type inference). This lane is cheap on purpose: pure Rust, no WDK, no packaging —
# everything it needs is baked into the runner image, so there is deliberately no
# ensure-windows-toolchain step.
name: setup-windows

on:
  push:
    branches: [main]
    paths:
      - "crates/install/punktfunk-setup/**"
      - "crates/install/punktfunk-setup-win/**"
      - "crates/host/pf-paths/**"
      - "crates/host/pf-paths-win/**"
      - "crates/host/pf-host-config/**"
      - "data/platforms.json"
      - ".gitea/workflows/setup-windows.yml"
  pull_request:
    paths:
      - "crates/install/punktfunk-setup/**"
      - "crates/install/punktfunk-setup-win/**"
      - "crates/host/pf-paths/**"
      - "crates/host/pf-paths-win/**"
      - "crates/host/pf-host-config/**"
      - "data/platforms.json"
      - ".gitea/workflows/setup-windows.yml"

env:
  CARGO_TERM_COLOR: always
  SCCACHE_BUCKET: unom-ci-sccache
  SCCACHE_ENDPOINT: https://storage.unom.io
  SCCACHE_REGION: home-central
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
  CARGO_INCREMENTAL: "0"

jobs:
  # The Windows setup test is opt-in on a pull request: add the `ci:windows-host` label, or `ci:all`. Only someone with
  # write access can label, so this is also the trust boundary. Pushes and tags are unaffected.
  #
  # Shell rather than a label expression on the job's `if`, because the event payload is a
  # snapshot: a label added after the last push is not in it, and a re-run replays the old one.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.gate.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide whether this pull request runs Windows setup test
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sh scripts/ci/pr-gate.sh --self-test
          if [ "$EVENT" != "pull_request" ]; then
            echo "heavy=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          API="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/pulls/$PR"
          curl -fsS "$API" -H "Authorization: token $GITEA_TOKEN" > /tmp/pr.json || true
          [ -s /tmp/pr.json ] || curl -fsS "$API" > /tmp/pr.json || true
          sh scripts/ci/pr-gate.sh --label ci:windows-host < /tmp/pr.json | tee -a "$GITHUB_OUTPUT"

  # Same fork backstop as windows-client.yml: this persistent host-mode runner also handles
  # release signing, so fork-PR code stays off it. Fails closed — head repo must be this repo.
  test:
    runs-on: windows-amd64
    needs: gate
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository
      && needs.gate.outputs.heavy == 'true')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test, lint, format
        shell: pwsh
        run: |
          # Own short target dir: dodges MAX_PATH under the runner's deep workdir and never
          # collides with the client/host trees in C:\t / C:\t-a64.
          $env:CARGO_TARGET_DIR = 'C:\t-setup'
          # Unchanged crates stay fresh across checkouts; see scripts/ci/src-mtimes.rs.
          rustc -O scripts/ci/src-mtimes.rs -o "$env:RUNNER_TEMP\src-mtimes.exe"
          if ($LASTEXITCODE -eq 0) { & "$env:RUNNER_TEMP\src-mtimes.exe" $env:CARGO_TARGET_DIR }
          cargo test -p punktfunk-setup
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The wizard crate: the headless reactor-harness flow tests (tests/wizard_flow.rs).
          # Its build.rs stages the WinAppSDK runtime (one nupkg download, cached per runner).
          cargo test -p punktfunk-setup-win
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo clippy -p punktfunk-setup -p punktfunk-setup-win --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo fmt -p punktfunk-setup -p punktfunk-setup-win -- --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
