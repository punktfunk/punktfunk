# Build the punktfunk-host RPM and publish it to Gitea's RPM package registry, so Bazzite /
# Fedora Atomic hosts layer + update it with rpm-ostree. Counterpart to deb.yml (apt). Each leg
# compiles in its own distro's builder image (ci/fedora-rpm.Dockerfile per Fedora release,
# ci/opensuse-rpm.Dockerfile for Tumbleweed) so the RPM's auto library Requires match the
# target's sonames.
#
# Registry (public, unom org), one group per leg (`bazzite`, `fedora-44`, `fedora-45`,
# `opensuse-tumbleweed`):
#   repo file  https://git.unom.io/api/packages/unom/rpm/bazzite.repo
# Box setup (once): see packaging/rpm/README.md
#
# REGISTRY_TOKEN: repo Actions secret, a PAT with write:package scope (shared with docker.yml).
name: rpm
# One pending run per workflow+ref: a newer push supersedes the queued/running one and cancels
# it (a canary only needs the latest commit; each release tag is its own ref so tag runs never
# cancel each other). Keeps a busy push cadence from piling ~10 queued runs per commit onto the
# runner fleet. Gitea honors this for push triggers (PR triggers: see gitea#35933).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
    # Scope canary builds to what this artifact is built FROM — a docs-only or
    # web-only push should not light up the whole fleet. Applies to branch pushes;
    # tag runs are matched by `tags:`.
    paths:
      - 'crates/client/**'
      - 'crates/codec/pf-bitstream/**'
      - 'crates/codec/pf-libva/**'
      - 'crates/codec/pf-v4l2/**'
      - 'crates/codec/pf-v4l2dec/**'
      - 'crates/codec/pf-vaapi/**'
      - 'crates/codec/pf-vkdecode/**'
      - 'crates/codec/pyrowave-sys/**'
      - 'crates/core/**'
      - 'crates/host/pf-audio/**'
      - 'crates/host/pf-capture/**'
      - 'crates/host/pf-clipboard/**'
      - 'crates/host/pf-driver-proto/**'
      - 'crates/host/pf-encode/**'
      - 'crates/host/pf-encode-core/**'
      - 'crates/host/pf-frame/**'
      - 'crates/host/pf-gpu/**'
      - 'crates/host/pf-host-config/**'
      - 'crates/host/pf-inject/**'
      - 'crates/host/pf-paths/**'
      - 'crates/host/pf-paths-win/**'
      - 'crates/host/pf-portal/**'
      - 'crates/host/pf-seats/**'
      - 'crates/host/pf-vdisplay/**'
      - 'crates/host/pf-win-display/**'
      - 'crates/host/pf-zerocopy/**'
      - 'crates/host/punktfunk-encode-worker/**'
      - 'crates/host/punktfunk-host/**'
      - 'crates/install/pf-update/**'
      - 'crates/install/punktfunk-tray/**'
      - 'clients/linux/**'
      - 'clients/session/**'
      - 'clients/shared/**'
      - 'clients/cli/**'
      - 'l10n/**'
      - 'web/**'
      - 'l10n/messages/**'
      - 'sdk/**'
      - 'api/openapi.json'
      - 'packaging/rpm/**'
      - 'packaging/gamescope/**'
      - 'packaging/bazzite/**'
      - 'packaging/kde/host.env'
      - 'packaging/linux/*.conf'
      - 'packaging/linux/*.desktop'
      - 'packaging/linux/*.generator'
      - 'packaging/linux/*.pam'
      - 'packaging/linux/apparmor/**'
      - 'packaging/linux/punktfunk-scripting-apparmor-confined'
      - 'packaging/linux/*.rules'
      - 'packaging/linux/*.service'
      - 'packaging/linux/*.sh'
      - 'packaging/linux/*.tmpfiles'
      - 'packaging/linux/*.sysusers'
      - 'packaging/linux/payload.txt'
      - 'packaging/linux/90-punktfunk-frame-adapter'
      - 'packaging/linux/seat-*'
      - 'packaging/linux/door-*'
      - 'packaging/linux/*.xml'
      - 'packaging/linux/icons/**'
      - 'LICENSE-MIT'
      - 'LICENSE-APACHE'
      - 'README.md'
      - 'THIRD-PARTY-NOTICES.txt'
      - 'packaging/README.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/60-punktfunk.rules'
      - 'scripts/60-punktfunk-dualsense.conf'
      - 'scripts/70-punktfunk-client.rules'
      - 'scripts/99-punktfunk-net.conf'
      - 'scripts/99-punktfunk-client-net.conf'
      - 'scripts/headless/**'
      - 'scripts/host.env.example'
      - 'scripts/io.unom.punktfunk.dm-helper.policy'
      - 'scripts/pf-dm-helper'
      - 'scripts/punktfunk-host-desktop-session.conf'
      - 'scripts/punktfunk-host.service'
      - 'scripts/punktfunk-kde-session.service'
      - 'scripts/punktfunk-modules.conf'
      - 'scripts/punktfunk-scripting.service'
      - 'scripts/punktfunk-scripting-seat@.service'
      - 'scripts/punktfunk-web-init.service'
      - 'scripts/punktfunk-web.service'
      - 'scripts/web-init.sh'
      - 'scripts/ci/assert-cap-matrix.sh'
      - 'scripts/ci/assert-payload-parity.sh'
      - 'scripts/ci/check-dualsense-ucm.sh'
      - 'scripts/ci/ensure-sccache.sh'
      - 'scripts/ci/gitea-release.sh'
      - 'scripts/ci/pf-version.sh'
      - 'scripts/ci/retry.sh'
      - 'scripts/alsa-ucm2/**'
      - 'ci/bun.env'
      - 'ci/install-bun.sh'
      - '.gitea/workflows/rpm.yml'
    # Single project version: a `vX.Y.Z` tag is THE release. main publishes to the `*-canary` rpm
    # groups, tags to the base groups (`bazzite`/`fedora-44`/`fedora-45`) — separate repos, so a
    # release never shares a version line with rolling builds.
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: git.unom.io
  OWNER: unom
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: unom-ci-sccache
  SCCACHE_ENDPOINT: https://storage.unom.io
  SCCACHE_REGION: home-central
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
  # The C/C++ half of the cache (aws-lc-sys, the vendored libopus, openh264's C++). Safe at
  # workflow level here: unlike ci.yml/deb.yml this workflow has no cross-compiling job. See
  # ci.yml's `rust` job for why the CC_*/CXX_* pair is job-scoped there. This matters on every
  # Fedora leg (the matrix below).
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  CC_x86_64_unknown_linux_gnu: sccache cc
  CXX_x86_64_unknown_linux_gnu: sccache c++
  # sccache and incremental compilation are mutually exclusive; CI wants the shared
  # cache, dev boxes keep incremental.
  CARGO_INCREMENTAL: "0"

jobs:
  build-publish:
    runs-on: ubuntu-24.04
    # One RPM per target whose sonames must match (a binary RPM is soname-coupled to its base):
    # Fedora 43 == Bazzite, Fedora 44 == the Fedora KDE spin, Fedora 45 == Bazzite 45 and Fedora 45.
    # Each builds in its matching builder image and publishes to its own registry group.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: punktfunk-fedora-rpm     # Fedora 43 == Bazzite base
            group: bazzite
            fedver: 43
          - image: punktfunk-fedora44-rpm   # Fedora 44 == Fedora KDE spin
            group: fedora-44
            fedver: 44
          - image: punktfunk-fedora45-rpm   # Fedora 45 == Bazzite 45 + Fedora 45
            group: fedora-45
            fedver: 45
          # openSUSE Tumbleweed. It has no `fedver`, and the steps that exist once per Fedora
          # release (the patched gamescope, the Bazzite sysext image, the UCM check) are
          # `if: matrix.fedver`.
          - image: punktfunk-opensuse-rpm
            group: opensuse-tumbleweed
    container:
      image: 192.168.1.58:5010/${{ matrix.image }}:latest
    timeout-minutes: 90
    env:
      CARGO_HOME: /usr/local/cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Shared compile cache (sccache -> RustFS S3 over the LAN). Baked into the builder
      # images; this heals the job while the running :latest predates the bake.
      - name: sccache (no-op once the image bakes it)
        run: sh scripts/ci/ensure-sccache.sh

      # rpmbuild + git archive need the checkout trusted.
      - name: Prep
        run: |
          git config --global --add safe.directory "$PWD"
          # bun builds the punktfunk-web console (--with web) and the spec vendors it into
          # punktfunk-bun, so this job signs those bytes. Baked into the image; the script heals an
          # image that lags the pin in ci/bun.env (docker.yml bootstrap note).
          sh ci/install-bun.sh
      # The client link deps are also baked into the fedora-rpm image, but this job runs
      # against the image from the PREVIOUS push (docker.yml bootstrap note) — keep it
      # green across image changes; a no-op once the image has them.
      - name: Prep (Fedora packages)
        if: matrix.fedver
        run: |
          # No vulkan-headers: nothing in the workspace compiles against the system Vulkan headers.
          # The host's Vulkan encode hand-rolls its structs, pyrowave-sys bindgens its own vendored
          # copy, and both host and client reach Vulkan through ash, which dlopens the loader. (The
          # HDR gamescope leg further down does need them, and pulls them itself via `dnf builddep
          # gamescope`.) Matches packaging/rpm/punktfunk.spec, which has no vulkan BuildRequires.
          dnf -y install gtk4-devel libadwaita-devel SDL3-devel
          # sysext build (packaging/bazzite/build-sysext.sh): squashfs + SELinux labeling.
          # libcap = setcap/getcap: the sysext is the ONLY place the image can acquire
          # cap_sys_nice=ep on punktfunk-encode-worker (a merged /usr is read-only squashfs and no
          # scriptlet ever runs), and it is also what the build's host-must-be-uncapped assertion
          # and the capability-matrix CI leg read with. Without it the image ships the lever inert.
          dnf -y install squashfs-tools cpio libselinux-utils selinux-policy-targeted libcap
          # Fedora's own gamescope, for its RUNTIME libraries only — never shipped, never run. The
          # sysext folds in our punktfunk-gamescope and verifies it by executing `--version`, and
          # on a cache hit (the common case) nothing else in this job would have pulled libavif /
          # luajit / seatd / SDL2 in. Cheap, and it tracks gamescope's dep list for us.
          dnf -y install gamescope || true
      # cargo's git dir too, not just the registry: cargo clones every git dependency to resolve
      # the workspace, the Windows client's windows-rs among them (1.5 GB), though nothing
      # Windows is compiled here. The key family is deb.yml's: for one Cargo.lock both lanes
      # hold the same downloads, so one entry serves both.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-

      - name: Version + channel
        # vX.Y.Z tag -> X.Y.Z-1 in the base group (a real release); main push -> <next-minor>-0.ciN.g<sha>
        # in the `<base>-canary` group, whose "0." release sorts below the eventual <next-minor>-1 yet
        # climbs by run number (scripts/ci/pf-version.sh owns the rule). The spec %build stamps
        # PUNKTFUNK_BUILD_VERSION from these macros into the binary (--version provenance).
        run: |
          eval "$(bash scripts/ci/pf-version.sh --format rpm)"   # -> PF_VERSION, PF_RELEASE, PF_CHANNEL
          case "$PF_CHANNEL" in
            stable) GROUP="${{ matrix.group }}" ;;
            *)      GROUP="${{ matrix.group }}-canary" ;;
          esac
          echo "GROUP=$GROUP" >> "$GITHUB_ENV"
          echo "rpm $PF_VERSION-$PF_RELEASE -> group '$GROUP'"

      # ── The web console, built once per (web+sdk content, bun) instead of once per leg ─────────
      # The Fedora legs share one bundle that is a pure function of web/ and sdk/ — see the fuller
      # note in deb.yml, whose key family this shares, so whichever job builds it first warms the
      # rest of the fleet.
      #
      # ⚠ The build has to happen HERE, in the workspace, rather than being left to the spec. Two
      # reasons, and both are load-bearing:
      #   * build-rpm.sh packages a `git archive` tarball and web/.output is gitignored, so a
      #     bundle sitting in the workspace is invisible to rpmbuild — it must be handed over by
      #     absolute path (PF_PREBUILT_WEB_OUTPUT -> the spec's pf_prebuilt_web macro).
      #   * the spec builds into rpmbuild's %{_topdir}, not the workspace, so a console built
      #     there never lands in web/.output and actions/cache's post step has nothing to save:
      #     every run would be a miss that quietly rebuilt, and the cache would look present and
      #     do nothing.
      - name: Web console cache key
        run: echo "bunver=$(bun --version 2>/dev/null || echo none)" >> "$GITHUB_ENV"
      - name: Cache the built web console
        id: webconsole
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.output
          key: web-console-linux-bun${{ env.bunver }}-${{ hashFiles('web/**', 'sdk/**', 'l10n/messages/**') }}

      - name: Build the web console (cache miss only)
        if: steps.webconsole.outputs.cache-hit != 'true'
        run: |
          cd web
          # Retried: bun's download-and-extract is single-shot, and a truncated tarball reads as
          # `Fail extracting tarball` (see ci.yml's web job).
          bash ../scripts/ci/retry.sh 3 bun install --frozen-lockfile --ignore-scripts
          bun run build

      # Same mandatory assertion as deb.yml — a missing or wrong-preset bundle must fail here, not
      # become a quietly console-less RPM. The spec re-checks the marker on whatever it packages.
      - name: The console must exist (cache hit or fresh build)
        run: |
          if [ ! -f web/.output/server/index.mjs ]; then
            echo "::error::web/.output is missing — neither the cache restore nor the build produced it"
            exit 1
          fi
          grep -q 'Bun\.serve' web/.output/server/index.mjs || {
            echo "::error::web/.output is not a bun bundle (wrong nitro preset)"; exit 1; }
          echo "web console present: $(du -sh web/.output | cut -f1)"

      - name: Build RPM
        # PF_WITH_WEB=1 / PF_WITH_SCRIPTING=1 → also build the punktfunk-web console + the
        # punktfunk-scripting runner subpackages, and punktfunk-bun, the runtime both require (the
        # publish loop globs them in; the host RPM Recommends both). Bun is ensured in Prep.
        run: |
          PF_VERSION="$PF_VERSION" PF_RELEASE="$PF_RELEASE" \
            PF_RPM_TOPDIR=/tmp/pf-rpmbuild \
            PF_WITH_WEB=1 PF_WITH_SCRIPTING=1 \
            PF_PREBUILT_WEB_OUTPUT="$GITHUB_WORKSPACE/web/.output" \
            bash packaging/rpm/build-rpm.sh

      # Visibility only — a cache regression on the long RPM legs is the most expensive one to
      # leave undetected.
      - name: sccache stats (visibility only)
        if: always()
        run: sccache --show-stats

      # Signs with packages@unom.io (org secret) and self-verifies before publish. On a v* tag a
      # missing key FAILS the build rather than publishing unsigned RPMs into a gpgcheck=1 repo.
      - name: Sign RPMs
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: bash packaging/rpm/sign-rpms.sh

      - name: The DualSense UCM drop-in must still bite
        if: matrix.fedver
        # scripts/alsa-ucm2/ hooks into alsa-ucm-conf's own dispatcher, so an upstream rename or
        # reorder can neuter it with no error anywhere. The Fedora legs are the ones on a real
        # Fedora tree, hence the two packages. Skips itself on any box without them.
        run: |
          dnf -y install alsa-ucm alsa-ucm-utils
          sh scripts/ci/check-dualsense-ucm.sh

      # Read the file-capability matrix out of the BUILT rpm, before it is published: verify the
      # PACKAGE, never the board. Host must carry NOTHING; the worker must carry exactly
      # cap_sys_nice=ep (scripts/ci/assert-cap-matrix.sh says why). `--self-test` first, so a
      # guard that has quietly stopped being able to fail takes the job down instead of waving
      # the release through.
      - name: Assert the capability matrix (rpm)
        run: |
          bash scripts/ci/assert-cap-matrix.sh --self-test
          # Only the main host package carries binaries; -debuginfo/-debugsource and the
          # client/web/scripting subpackages ship neither and are skipped by the script itself.
          bash scripts/ci/assert-cap-matrix.sh dist/punktfunk-[0-9]*.rpm

      # Every path packaging/linux/payload.txt names, read out of the built host, client and seats rpms.
      - name: Assert the shared payload (rpm)
        run: |
          bash scripts/ci/assert-payload-parity.sh --self-test
          bash scripts/ci/assert-payload-parity.sh dist/punktfunk-[0-9]*.rpm dist/punktfunk-client-[0-9]*.rpm \
            dist/punktfunk-seats-[0-9]*.rpm

      # Tumbleweed is rolling and its builder image is a snapshot of it. An empty root makes the
      # answer honest: zypper must satisfy every dependency from today's repository, as a user's
      # box does, and not from what the image has installed. `--dry-run` resolves and installs
      # nothing. This is arch.yml's gate, for zypper.
      - name: Assert the set installs on a current Tumbleweed box
        if: ${{ !matrix.fedver }}
        run: |
          root="$(mktemp -d)"
          zypper --root "$root" --non-interactive addrepo \
            https://download.opensuse.org/tumbleweed/repo/oss/ oss
          zypper --root "$root" --non-interactive --gpg-auto-import-keys refresh
          if ! zypper --root "$root" --non-interactive install --dry-run --no-recommends \
               --allow-unsigned-rpm dist/*.rpm; then
            echo "::error::refusing to publish: a current Tumbleweed box can't install this set."
            echo "::error::Usual cause: the builder image lags Tumbleweed across a library bump —"
            echo "::error::bump 'refreshed:' in ci/opensuse-rpm.Dockerfile, let docker.yml republish it, re-run."
            exit 1
          fi

      - name: Publish to the Gitea RPM registry
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          # Publish only the main package (skip -debuginfo/-debugsource subpackages).
          for rpm in dist/*.rpm; do
            case "$rpm" in *debuginfo*|*debugsource*) echo "skip $rpm"; continue;; esac
            echo "uploading $rpm"
            # A re-tagged release re-fires this workflow and the rpm registry 409s on duplicate
            # package versions — delete any prior copy of this exact name/version-release/arch
            # first (404 on the first publish is fine).
            NAME=$(rpm -qp --qf '%{NAME}' "$rpm" 2>/dev/null)
            VR=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpm" 2>/dev/null)
            ARCH=$(rpm -qp --qf '%{ARCH}' "$rpm" 2>/dev/null)
            curl -fsS -o /dev/null --user "enricobuehler:$TOKEN" -X DELETE \
              "https://$REGISTRY/api/packages/$OWNER/rpm/$GROUP/package/$NAME/$VR/$ARCH" || true
            curl -fsS --user "enricobuehler:$TOKEN" --upload-file "$rpm" \
              "https://$REGISTRY/api/packages/$OWNER/rpm/$GROUP/upload"
          done
          echo "published to $OWNER/rpm/$GROUP"

      # The HDR-capable gamescope the sysext carries (packaging/gamescope) — what lets the
      # gamescope backend stream 10-bit BT.2020 PQ instead of 8-bit SDR.
      #
      # CACHED, and that is the whole reason this is affordable: it is a ~10-minute C++ meson build
      # of an entirely separate tree that depends on NOTHING in this repo except
      # `packaging/gamescope/**` (the patches and the upstream pin, which lives in the build
      # script). So the key is that directory's hash and a normal push restores a binary instead of
      # building one. Per-Fedora-major, because the binary is soname-coupled to its base exactly
      # like the RPM is — an f43 build does not start on f44.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.fedver
        id: gamescope
        with:
          path: gs-cache
          key: punktfunk-gamescope-f${{ matrix.fedver }}-${{ hashFiles('packaging/gamescope/**') }}

      - name: Build the HDR gamescope
        if: matrix.fedver && steps.gamescope.outputs.cache-hit != 'true'
        # Best-effort ON PURPOSE. The sysext is the primary Bazzite delivery path and works without
        # this binary (the host just stays SDR on the gamescope backend) — so a hiccup building
        # someone else's tree must not cost the whole image. It is loud, though: the warning
        # below, and `--gamescope` silently absent
        # downstream is impossible because build-sysext.sh verifies the +pfhdr marker itself.
        run: |
          set -x
          # `dnf builddep` resolves Fedora's PACKAGED gamescope, which is older than the master we
          # pin, so it can come up short — xorg-x11-server-Xwayland-devel is the one that actually
          # bites (wlroots' configure dies on a missing xserver.wrap several minutes in). It also
          # installs nothing when the mirror has no `updates-source` repo, so the tree's own
          # dependencies are listed below.
          dnf -y install dnf-plugins-core meson ninja-build glslc || true
          dnf builddep -y gamescope || true
          dnf -y install xorg-x11-server-Xwayland-devel || true
          # NOT best-effort: build-punktfunk-gamescope.sh appends `-static-libstdc++` to LDFLAGS
          # (so the binary still starts on SteamOS's older libstdc++ — see its comment), and
          # without the static library meson's very FIRST sanity check dies with
          # "cannot find -lstdc++ / have you installed the static version", so nothing builds at
          # all. A rename here must be LOUD, hence no `|| true`.
          dnf -y install libstdc++-static
          # What the pinned tree and its wlroots look up on the system, by pkg-config name:
          # src/meson.build (X libs, libeis, libudev, libdecor, luajit, libinput, SDL2, libavif,
          # libcap, hwdata), wlroots (libseat, xcb-*) and glslang. A name Fedora drops warns here
          # and the build below fails: this step never costs the sysext.
          dnf -y install \
            'pkgconfig(xdamage)' 'pkgconfig(xcomposite)' 'pkgconfig(xcursor)' 'pkgconfig(xrender)' \
            'pkgconfig(xext)' 'pkgconfig(xfixes)' 'pkgconfig(xxf86vm)' 'pkgconfig(xtst)' \
            'pkgconfig(xres)' 'pkgconfig(xmu)' 'pkgconfig(xi)' 'pkgconfig(libeis-1.0)' \
            'pkgconfig(libudev)' 'pkgconfig(libdecor-0)' 'pkgconfig(luajit)' 'pkgconfig(libinput)' \
            'pkgconfig(sdl2)' 'pkgconfig(libavif)' 'pkgconfig(libcap)' 'pkgconfig(hwdata)' \
            'pkgconfig(libseat)' 'pkgconfig(xcb-errors)' 'pkgconfig(xcb-ewmh)' \
            'pkgconfig(xcb-icccm)' glslang ||
            echo "::warning::punktfunk-gamescope build dependencies did not install for f${{ matrix.fedver }}"
          # The rest of the Arch package's makedepends that Fedora's older packaged gamescope does
          # not necessarily pull. Best-effort: unlike the static runtime, meson finds fallbacks or
          # does without, and a name that moves between Fedora releases should not fail the job.
          dnf -y install wayland-protocols-devel glm-devel cmake libXcursor-devel libei-devel || true
          if bash packaging/gamescope/build-punktfunk-gamescope.sh \
               --destdir "$PWD/gs-stage" --prefix /usr --jobs "$(nproc)"; then
            # The WHOLE staged tree, not just the binary: it also carries the Vulkan WSI layer built
            # beside the compositor, which is the only thing that can give a nested game an HDR10
            # swapchain. Caching the tree rather than a file per artifact is what keeps the next
            # addition from needing a change here as well as in every packaging script.
            mkdir -p gs-cache && cp -a gs-stage/. gs-cache/
          else
            # Warn only, on a tag and on main too — the hard gate is the LAST step of this job.
            # Failing here would skip the sysext build, the sysext feed, AND the release attach
            # below, so a missing gamescope would also withhold the punktfunk RPMs and the .raw
            # images that built perfectly well.
            echo "::warning::punktfunk-gamescope failed to build for f${{ matrix.fedver }} — the sysext ships without it (gamescope sessions stay SDR)"
          fi

      # The same binary, as an ordinary RPM. The sysext below is the Atomic/Bazzite delivery; this
      # is the one a traditional Fedora-family box (Nobara, plain Fedora) can actually install; a
      # stock gamescope tells every game its display is 60 Hz whatever the client negotiated.
      #
      # Same best-effort rule as the build above: no binary, no package, and the host stays on its
      # existing SDR/host-composited path. The spec re-checks the +pfhdr marker itself.
      - name: Package punktfunk-gamescope as an RPM
        if: matrix.fedver
        run: |
          if [ -x gs-cache/usr/bin/punktfunk-gamescope ] && gs-cache/usr/bin/punktfunk-gamescope --version >/dev/null 2>&1; then
            bash packaging/gamescope/build-gamescope-rpm.sh \
              --stage gs-cache \
              --release "$PF_RELEASE"
          else
            # Warn only — see the note on the build step. The gate is the last step of this job.
            echo "::warning::no usable punktfunk-gamescope for f${{ matrix.fedver }} — skipping its RPM"
          fi

      # A SECOND signing pass, for this package only. The main "Sign RPMs" step runs before this
      # RPM exists — the gamescope build sits behind its own ~10-minute cache and deliberately
      # runs after the host RPMs are already published — and the repo file we tell users to
      # install carries gpgcheck=1, so an unsigned punktfunk-gamescope RPM would sit in the
      # channel and still be uninstallable ("The package is not signed").
      #
      # Same fail-closed rule as the first pass: sign-rpms.sh hard-fails on refs/tags/v* if the org
      # secret is missing, rather than republishing something a user's dnf will reject.
      - name: Sign punktfunk-gamescope
        if: matrix.fedver
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          shopt -s nullglob
          rpms=(dist/punktfunk-gamescope-*.rpm)
          # No RPM here is the best-effort skip above, already warned about — not a signing failure.
          if [ "${#rpms[@]}" -eq 0 ]; then
            echo "no punktfunk-gamescope RPM to sign (see the packaging step above)"
            exit 0
          fi
          bash packaging/rpm/sign-rpms.sh "${rpms[@]}"

      - name: Publish punktfunk-gamescope to the Gitea RPM registry
        if: matrix.fedver
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          shopt -s nullglob
          for rpm in dist/punktfunk-gamescope-*.rpm; do
            case "$rpm" in *debuginfo*|*debugsource*) continue;; esac
            NAME=$(rpm -qp --qf '%{NAME}' "$rpm" 2>/dev/null)
            VR=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpm" 2>/dev/null)
            ARCH=$(rpm -qp --qf '%{ARCH}' "$rpm" 2>/dev/null)
            echo "uploading $rpm"
            curl -fsS -o /dev/null --user "enricobuehler:$TOKEN" -X DELETE \
              "https://$REGISTRY/api/packages/$OWNER/rpm/$GROUP/package/$NAME/$VR/$ARCH" || true
            curl -fsS --user "enricobuehler:$TOKEN" --upload-file "$rpm" \
              "https://$REGISTRY/api/packages/$OWNER/rpm/$GROUP/upload"
          done

      # The no-layering Bazzite path: wrap the just-built host + web RPMs into a systemd-sysext
      # image and publish it to the per-Fedora-major feed (punktfunk-sysext/f43[-canary], …) that
      # `punktfunk-sysext install|update` reads. Same RPMs, same channels — just no rpm-ostree.
      - name: Build the sysext image
        if: matrix.fedver
        run: |
          # Execute it here rather than only handing it over: build-sysext.sh treats an unusable
          # --version as fatal (rightly — it is how the +pfhdr marker is read), and a cached binary
          # whose runtime libs are missing from this container must cost the image its HDR, not the
          # image itself.
          gs=()
          if [ -x gs-cache/usr/bin/punktfunk-gamescope ] && gs-cache/usr/bin/punktfunk-gamescope --version >/dev/null 2>&1; then
            gs=(--gamescope-stage gs-cache)
            echo "folding in $(gs-cache/usr/bin/punktfunk-gamescope --version 2>&1 | head -1)"
          else
            echo "::warning::no usable punktfunk-gamescope for f${{ matrix.fedver }} — the sysext ships without it (gamescope sessions stay SDR)"
          fi
          bash packaging/bazzite/build-sysext.sh --version-id "${{ matrix.fedver }}" \
            --out "dist-sysext/punktfunk-${PF_VERSION}-${PF_RELEASE}-x86-64.raw" \
            "${gs[@]}" \
            dist/punktfunk-"${PF_VERSION}-${PF_RELEASE}"*.rpm \
            dist/punktfunk-web-"${PF_VERSION}-${PF_RELEASE}"*.rpm \
            dist/punktfunk-scripting-"${PF_VERSION}-${PF_RELEASE}"*.rpm \
            dist/punktfunk-seats-"${PF_VERSION}-${PF_RELEASE}"*.rpm \
            dist/punktfunk-bun-"${PF_VERSION}-${PF_RELEASE}"*.rpm

      # Read the capability matrix back OUT of the image that is about to be published — the one
      # channel where getting it wrong is unrepairable, because a merged sysext's /usr is read-only
      # squashfs and the only fix is a new image plus a feed republish. Checking it here means a
      # wrong .raw never reaches the feed.
      #
      # The script proves its own reader first (cap a file, squash it, unsquash it, read it back)
      # so a runner that cannot see file capabilities FAILS the leg instead of blessing the image.
      - name: Assert the capability matrix (sysext image)
        if: matrix.fedver
        run: |
          bash scripts/ci/assert-cap-matrix.sh \
            "dist-sysext/punktfunk-${PF_VERSION}-${PF_RELEASE}-x86-64.raw"

      # The feed's SHA256SUMS is OpenPGP-signed with the same packages@unom.io key as the RPMs, and
      # punktfunk-sysext(8) refuses a feed it can't verify — the checksums alone never proved
      # anything, sitting on the same registry as the images they describe.
      - name: Publish the sysext feed
        if: matrix.fedver
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          case "$GROUP" in
            *-canary) FEED="f${{ matrix.fedver }}-canary"; KEEP=6; OTHER="f${{ matrix.fedver }}" ;;
            *)        FEED="f${{ matrix.fedver }}";        KEEP=0; OTHER="f${{ matrix.fedver }}-canary" ;;
          esac
          KEEP=$KEEP bash packaging/bazzite/publish-sysext-feed.sh "$FEED" \
            "dist-sysext/punktfunk-${PF_VERSION}-${PF_RELEASE}-x86-64.raw"
          # Re-seal this Fedora major's OTHER channel too: stable feeds only publish on a tag, and
          # a key rotation must reach both feeds without rebuilding any image.
          # Best-effort: a channel that has never published yet has no manifest to seal.
          bash packaging/bazzite/publish-sysext-feed.sh --seal "$OTHER" \
            || echo "::warning::could not seal the $OTHER feed (no manifest yet?)"

      # On a real release, also attach the .rpms to the unified Gitea Release. The legs can build
      # the SAME filename, so suffix the asset with the group to keep all on the release; canary
      # builds live in the `*-canary` rpm groups (no release page). Only a Fedora leg has an
      # image to attach.
      - name: Attach .rpms to the Gitea release (stable tags only)
        if: startsWith(gitea.ref, 'refs/tags/v')
        env:
          GITEA_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          . scripts/ci/gitea-release.sh
          RID=$(ensure_release "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" auto)
          for rpm in dist/*.rpm; do
            case "$rpm" in *debuginfo*|*debugsource*) continue;; esac
            base="$(basename "$rpm" .rpm)"
            upsert_asset "$RID" "$rpm" "${base}.${{ matrix.group }}.rpm"
          done
          for raw in dist-sysext/*.raw; do
            [ -e "$raw" ] || continue
            upsert_asset "$RID" "$raw" "$(basename "$raw" .raw).f${{ matrix.fedver }}.raw"
          done

      # The notes and docs-site say the patched gamescope is dnf-installable, and the build step
      # above only warns when it fails. A tag or a main build that lacks the RPM goes red here.
      #
      # ⚠ LAST step on purpose: failing at the build step instead would skip the sysext image,
      # the feed publish AND the attach above, withholding the punktfunk RPMs and .raw images
      # that built perfectly well. Everything good ships first; the job goes red after.
      - name: A tag or main build must ship the gamescope RPM
        if: matrix.fedver && (startsWith(gitea.ref, 'refs/tags/v') || gitea.ref == 'refs/heads/main')
        run: |
          shopt -s nullglob
          built=(dist/punktfunk-gamescope-*.rpm)
          keep=()
          for r in "${built[@]}"; do
            case "$r" in *debuginfo*|*debugsource*) continue;; esac
            keep+=("$r")
          done
          if [ ${#keep[@]} -eq 0 ]; then
            echo "::error::no punktfunk-gamescope RPM was built for f${{ matrix.fedver }} — a tag or main build must not ship without it (the release notes and docs-site say it is installable). Everything else in this job published normally; see the gamescope build step above for the cause."
            exit 1
          fi
          echo "gamescope RPM present: ${keep[*]}"
