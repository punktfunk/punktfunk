ShortDescription: Cliente de transmisión de juegos de baja latencia — juega los juegos de tu host Punktfunk en un PC o portátil con Windows.
Description: |-
  Punktfunk Client transmite juegos desde un host Punktfunk a un PC o portátil con Windows 10 u 11,
  en x64 y Arm64. Se conecta por su protocolo QUIC nativo, decodifica el vídeo en la GPU (Vulkan Video
  o D3D11VA) con HDR, reproduce el audio con WASAPI y envía al host la entrada de teclado, ratón y mando.

  El paquete instala también Punktfunk Console, una interfaz para mando pensada para un televisor o un
  HTPC (solo x64), y el comando punktfunk para scripts. Se instala para el usuario actual y no necesita
  permisos de administrador.
Tags:
  - game-streaming
  - remote-desktop
  - streaming
  - remote-play
ReleaseNotesUrl: https://git.unom.io/unom/punktfunk/src/branch/main/docs/releases/v0.47.0.md
InstallationNotes: |-
  Abre Punktfunk desde el menú Inicio y vincúlalo una vez con tu host:
    https://docs.punktfunk.unom.io/docs/pairing

  Punktfunk Console (x64) es la interfaz para mando de un televisor o un HTPC.

  Instalado en:  %LOCALAPPDATA%\Programs\Punktfunk
  El comando `punktfunk` está en el PATH en las ventanas de terminal nuevas.
Documentations:
