ReleaseNotesUrl: https://git.unom.io/unom/punktfunk/src/branch/main/docs/releases/v0.19.2.md
InstallationNotes: |-
  Console de gestion web :  https://<ce-PC>:47992
    Cette installation a généré un mot de passe de connexion sans l’afficher. Affichez-le depuis
    un PowerShell EN TANT QU’ADMINISTRATEUR, AVANT votre première connexion :   punktfunk-host web password
    La console ne conserve ensuite qu’un hachage salé dans %ProgramData%\punktfunk\web-password, donc un
    mot de passe oublié se réinitialise : remettez une ligne PUNKTFUNK_UI_PASSWORD=<votre-mot-de-passe> dans ce
    fichier et exécutez  punktfunk-host service restart

  Configuration :  %ProgramData%\punktfunk\host.env
  Journaux :       %ProgramData%\punktfunk\logs\

  Le service de l’hôte démarre automatiquement avec le système. `punktfunk-host` est dans le PATH de la machine — exécutez
  `punktfunk-host service status` depuis une invite de commandes en tant qu’administrateur pour le vérifier.
