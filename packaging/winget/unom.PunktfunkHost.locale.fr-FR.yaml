ShortDescription: Hôte de streaming de jeux à faible latence — diffusez les jeux de votre PC vers n’importe quel client Punktfunk ou Moonlight.
Description: |-
  Punktfunk Host transforme un PC Windows 11 en serveur de streaming de jeux à faible latence. Il capture
  le bureau ou un écran virtuel dédié, encode avec NVENC / AMF / QSV / Vulkan et diffuse via son
  protocole QUIC natif vers les clients Punktfunk sous Windows, macOS, iOS, tvOS, Android et Linux —
  ou via GameStream vers les clients Moonlight standard.

  Le programme d’installation fournit le pilote d’écran virtuel pf-vdisplay (streaming en résolution native et en HDR
  sans écran physique), des manettes virtuelles DualSense / DualShock 4 / Xbox 360 et une console de gestion
  web servie sur le port 47992.
