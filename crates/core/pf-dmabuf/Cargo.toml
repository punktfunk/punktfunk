# Kernel dma-buf helpers with no GPU stack behind them, in a leaf so the Linux clients can wait a
# decode's fence without compiling the host's CUDA/EGL/Vulkan zero-copy crate (pf-zerocopy).
# Content is Linux-only; the crate compiles to an empty lib elsewhere.
[package]
name = "pf-dmabuf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "punktfunk Linux dma-buf helpers: the implicit-fence wait (EXPORT_SYNC_FILE + poll), a read-only mapping and the i915 decode-clock wait."
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["event", "fs"] }

[lints]
workspace = true
