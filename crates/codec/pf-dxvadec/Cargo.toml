[package]
name = "pf-dxvadec"
description = "Native D3D11VA (DXVA) H.264/HEVC/AV1 decode for the Windows clients (M5, M7): the hand-declared DXVA buffer layouts plus AuPlan → picparams/qmatrix/slice-control (AV1: tile-control) conversion — the CPU-testable half; the ID3D11VideoDecoder plumbing lives in pf-client-video’s video_d3d11_native (design/client-native-decode.md §3.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Byte views of the DXVA buffers. `Pod` rejects padding at compile time; `min_const_generics`
# covers `[u8; 810]` in the H.264 picture parameters.
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }
# Direct dependency on the vendored parser crate, not just pf-bitstream: the picture-parameter
# conversion consumes the parser's `Sps`/`Pps` types wholesale (pf-bitstream re-exports only
# `Level`/`SliceHeader`).
cros-codecs = { workspace = true }
pf-bitstream = { path = "../pf-bitstream" }
tracing = "0.1"

[dev-dependencies]
# `pf_bitstream::testing`: the vendored vectors and access-unit splitters.
pf-bitstream = { path = "../pf-bitstream", features = ["test-vectors"] }

[lints]
workspace = true
