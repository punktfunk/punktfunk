[package]
name = "pf-v4l2"
description = "The ioctl half of the Linux client's V4L2 decode rungs: decoder nodes, media requests, buffer mapping and dma-buf export behind pf-v4l2dec's Device traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
pf-v4l2dec = { path = "../pf-v4l2dec" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The kernel-driver test plans the vendored HEVC stream itself.
pf-bitstream = { path = "../pf-bitstream", features = ["test-vectors"] }

[lints]
workspace = true
