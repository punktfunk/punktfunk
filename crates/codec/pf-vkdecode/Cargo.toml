[package]
name = "pf-vkdecode"
description = "Native Vulkan Video H.264/HEVC/AV1 decode for the clients: StdVideo parameter-set/picture conversion over pf-bitstream's AuPlans, plus the video session, picture pool, upload ring and command recording on the presenter's device (design/client-native-decode.md §3.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ash = { workspace = true }
# Direct dependency on the vendored parser crate, not just pf-bitstream: the parameter-set
# conversion consumes the parser's `Sps`/`Pps` types wholesale (pf-bitstream re-exports only
# `Level`/`SliceHeader`).
cros-codecs = { workspace = true }
pf-bitstream = { path = "../pf-bitstream" }
tracing = "0.1"

[dev-dependencies]
# `pf_bitstream::testing`: the vendored vectors and access-unit splitters.
pf-bitstream = { path = "../pf-bitstream", features = ["test-vectors"] }
# The GPU parity test hashes decoded frames against libavcodec goldens (already
# in the workspace lock via other crates).
sha2 = "0.11"

[lints]
workspace = true
