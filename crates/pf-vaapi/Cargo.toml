[package]
name = "pf-vaapi"
description = "Hand-declared libva buffer layouts, CPU-testable: H.264/HEVC/AV1 decode buffers and profile/format/surface decisions for the Linux clients, plus the encode and VideoProc buffers the host's VAAPI encoder fills; the libva plumbing lives in pf-client-video and pf-libva (design/client-native-decode.md §3.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Direct dependency on the vendored parser crate, not just pf-bitstream: the conversion
# consumes the parser's `Sps`/`Pps`/`SliceType` wholesale (pf-bitstream re-exports only a
# subset).
cros-codecs = { workspace = true }
pf-bitstream = { path = "../pf-bitstream" }

[dev-dependencies]
# `pf_bitstream::testing`: the vendored vectors and access-unit splitters.
pf-bitstream = { path = "../pf-bitstream", features = ["test-vectors"] }

[lints]
workspace = true
