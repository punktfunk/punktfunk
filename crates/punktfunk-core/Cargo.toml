[package]
name = "punktfunk-core"
description = "punktfunk shared protocol/transport/FEC core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "punktfunk_core"

[features]
default = []
# Cert-fingerprint pinning shared across the clients (the one `PinVerify` in `tls.rs`). Light:
# rustls + sha2 only, no QUIC runtime — so a lean consumer (the tray's loopback status poll) can
# pin the host cert without pulling tokio/quinn. The heavier `quic` feature builds on top of it.
tls = ["dep:rustls"]
# Control-plane QUIC (pairing, config, reverse audio). tokio is permitted ONLY here,
# never on the per-frame hot path. Off by default so the core stays runtime-free.
# The SPAKE2 pairing ceremony on its own, so a client that pairs over a transport quinn does
# not speak (the browser, over WebTransport) can have it without the QUIC runtime.
pake = ["dep:spake2"]
quic = ["tls", "pake", "dep:quinn", "dep:tokio", "dep:rcgen", "dep:opus"]
# Blocking-HTTP clients that must speak the SAME pinned TLS as the QUIC plane: `tls::ureq_agent`
# hands ureq a caller-built `rustls::ClientConfig` (which is how `PinVerify` gets installed —
# ureq's own `TlsConfig` has no hook for a custom verifier). Separate from `tls` because the
# cdylib/staticlib embedders (Apple, Android) pin the host themselves over QUIC and have no use
# for an HTTP stack; only the desktop clients and the tray turn this on.
ureq-tls = ["tls", "dep:ureq"]
# Serde derives on the stats-overlay snapshot (`hud`), for the desktop's `stats-json:` line.
serde = ["dep:serde"]
# Optional native backend for armv7 SIMD; preserves the RFC 8439 wire format.
chacha-aws-lc-rs = ["dep:aws-lc-rs"]

[dependencies]
reed-solomon-simd = "3.1"      # GF(2^16) Leopard-RS, SIMD, O(n log n) — the wall-breaker (P2)
# Vendored fork of fec-rs: GF(2^8) classic RS with the *Cauchy* generator matrix
# (M[j][i] = inv[(m+i)^j]) — byte-identical to the `nanors` library Moonlight uses, so our
# parity is decodable by a stock Moonlight client. (reed-solomon-erasure is Vandermonde and is
# NOT interoperable.) See vendor/fec-rs/LICENSE (BSD-2-Clause).
fec-rs = { path = "vendor/fec-rs" }
aes-gcm = "0.11"               # AES-128-GCM session crypto, matches GameStream
crc32fast = "1"                # DualSense Bluetooth output-report CRC (`audio::pad_bt`)
# ChaCha20-Poly1305 session crypto, negotiated by clients without hardware AES (the soft-AES
# armv7 targets — webOS TVs — where GCM caps decrypt at ~100 Mbps; ARX runs 4-7x faster there).
# Same RustCrypto `aead 0.6` generation as aes-gcm: identical trait/nonce/tag shapes, pure Rust,
# cross-compiles like aes-gcm (no cmake). See design/chacha20-session-cipher.md.
chacha20poly1305 = "0.11"
# Optional for chacha-aws-lc-rs.
aws-lc-rs = { workspace = true, optional = true }
socket2 = { version = "0.6", features = [
    "all",
] } # SO_SNDBUF/SO_RCVBUF growth (default UDP buffers too small for 4K/5K bursts) + DSCP/SO_PRIORITY media QoS
thiserror = "2"
# `log`: tracing events are mirrored as `log` records when no tracing subscriber is installed, so
# a `log` backend (the C ABI's log callback, Android's logcat bridge) hears core's lines.
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }
zeroize = "1"
# Interface enumeration for Wake-on-LAN: computes each NIC's subnet-directed broadcast so a
# magic packet reaches the host's L2 segment on multi-homed clients (VPN/docker/multiple LANs),
# not just the default route. Tiny, cross-platform (getifaddrs / GetAdaptersAddresses), no cmake.
# `link-local` is named EXPLICITLY, not inherited. mdns-sd declares if-addrs with it, so any build
# containing both (every host and every client) unifies it on regardless — and a crate whose
# enumeration silently changes depending on who else is in the selection is the worst of both. On
# means fe80::/169.254 interfaces are enumerated too, which for WoL is the behaviour we want: a NIC
# is wake-capable whether or not it currently holds a routable address.
# Declared in the `cfg(not(wasm))` block near the bottom of this file, not here: its Linux path is
# netlink, which emscripten's libc does not declare.

# The aws-lc-rs crypto policy lives on the workspace entries (root Cargo.toml).
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
# `rustls-webpki-roots` (workspace entry) is the CA set for the non-pinned origins (cover-art CDNs).
ureq = { workspace = true, optional = true, features = ["gzip"] }
# `punktfunk/2` media keys expand with HMAC-SHA256 in every build (`crypto::MediaKeys`).
sha2 = "0.11"
serde = { version = "1", features = ["derive"], optional = true }
hmac = "0.13"
spake2 = { version = "0.4", optional = true }
# `io-util` for the `AsyncRead`/`AsyncWrite` extension traits the control framing is generic
# over (`quic::io`), so the same frames run on a quinn stream or a WebTransport one.
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "time"] }
# In-core Opus: `audio::plane` is the one audio-plane decoder, for the Rust clients and the C-ABI
# `punktfunk_connection_next_audio_pcm` (Apple's AudioToolbox is stereo-only), and `audio::mic`
# the Rust clients' mic uplink encoder. Only built with the connection API (quic). Same libopus
# the host vendors; cargo unifies the build.
opus = { version = "0.4", optional = true }

# `libc` for the unix syscall shims: `poll` on the shared socket (`transport::udp`), the
# socket and interface readers (`sockstat`, `ifinfo`), and thread priority and hostname in
# `client`. Cross-compiles (iOS/tvOS) don't pull libc transitively the way the macOS host
# build does, so it must be a direct dep here or those slices fail to link `libc::`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows UDP Send Offload (USO): `WSASendMsg` + `UDP_SEND_MSG_SIZE` is the Windows analogue of
# Linux UDP GSO — the 1 Gbps+ send lever (the host otherwise sends one packet per `send` syscall,
# which caps throughput at high packet rates). See transport/udp.rs.
[target.'cfg(windows)'.dependencies]
# windows-sys (raw FFI, the quinn-udp choice): the high-level `windows` crate doesn't bind the
# `WSASendMsg` extension function. WinSock feature gives WSASendMsg + WSAMSG/WSABUF/CMSGHDR.
# Win32_System_IO too: WSASendMsg's signature references OVERLAPPED, so it's gated on that feature.
# Win32_NetworkManagement_QoS + Win32_Foundation: the qWAVE flow API for real on-the-wire DSCP
# marking (transport/qos_windows.rs) — plain IP_TOS is stripped by the Windows stack.
windows-sys = { workspace = true, features = [
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_NetworkManagement_QoS",
    # GetAdaptersAddresses: the data socket's adapter kind and link speed (transport/ifinfo.rs).
    "Win32_NetworkManagement_IpHelper",
    # SetUnhandledExceptionFilter + GetModuleHandleExW: the crash filter (crash_windows.rs).
    # Kernel gates EXCEPTION_POINTERS (it embeds CONTEXT).
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
] }

# Interface enumeration for Wake-on-LAN and for `discovery`'s address ranking — everywhere but
# wasm. if-addrs' Linux path is netlink (`sockaddr_nl`, `NETLINK_ROUTE`), which emscripten's libc
# does not declare, and a browser has no interface list to enumerate. Both callers already treat
# enumeration failure as an empty list, which is exactly what the wasm arms return.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
if-addrs = { version = "0.15", features = ["link-local"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
# Tier-1 microbenchmarks (benches/pipeline.rs). default-features off → no plotters/HTML (headless
# CI just needs the measurement + target/criterion/**/estimates.json for the regression compare).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[example]]
name = "mu-smoke"
required-features = ["quic"]

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
