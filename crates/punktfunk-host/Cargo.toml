[package]
name = "punktfunk-host"
description = "punktfunk Linux streaming host: virtual display, capture, encode, input injection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Managed emulators: install, detect, remove. Pinned to a commit until it is on crates.io.
hermir = { git = "https://github.com/unom-io/hermir", rev = "a7659cfab40398047db76e437e62ec34e85f8956" }
# `ureq-tls` is for `ctl`: ureq's own `TlsConfig` has no hook for a custom certificate verifier,
# so the pinned operator client hands rustls a `ClientConfig` through core's shared glue — the same
# path the tray and the desktop client already take. `quic` brings `tls` (and `PinVerify`) with it.
punktfunk-core = { path = "../punktfunk-core", features = ["quic", "ureq-tls"] }
# Vendor libraries are dlopen'd at runtime, never linked: `libcuda.so.1` (`zerocopy::cuda`) and
# NVML on every OS (`encoder_sessions`), so one binary runs with or without an NVIDIA driver.
libloading = "0.9"
# Signed update-manifest fetch/verify + install-kind detection, shared with the Linux client.
pf-update-check = { path = "../pf-update-check" }
# Config-dir + owner-private file helpers (moved out of the gamestream junk drawer, plan §W6).
pf-paths = { path = "../pf-paths" }
# Windows owner/DACL checks (planted secrets, admin-only staging dirs).
pf-paths-win = { path = "../pf-paths-win" }
# Process-wide host config global, extracted to a leaf crate (plan §W6).
pf-host-config = { path = "../pf-host-config" }
# GPU vendor/adapter detection + selection, extracted to a leaf crate (plan §W6).
pf-gpu = { path = "../pf-gpu" }
# Linux GPU zero-copy plumbing (CUDA/EGL/Vulkan dmabuf import + the isolated worker), extracted
# to a leaf crate (plan §W6). Compiles empty on non-Linux, so it lives in the main deps.
pf-zerocopy = { path = "../pf-zerocopy" }
# Shared frame/format vocabulary (CapturedFrame/PixelFormat/…), HDR metadata, thread QoS, and the
# Windows DXGI capture identity — the leaf both capture and encode speak (plan §W6).
pf-frame = { path = "../pf-frame" }
# Windows display-topology helpers (CCD/GDI mode-set, PnP monitor devnodes, display-change watch),
# extracted to a leaf crate (plan §W6). Empty on non-Windows, so it lives in the main deps.
pf-win-display = { path = "../pf-win-display" }
# Video encode backends (NVENC/VAAPI/AMF/QSV/Vulkan-Video/PyroWave/openh264) behind one Encoder
# trait, extracted to a subsystem crate (plan §W6). The host's nvenc/qsv/vulkan-encode/pyrowave
# features forward here (see [features]); the heavy encoder deps (ffmpeg-next, the NVENC SDK,
# openh264, pyrowave-sys) moved with it.
pf-encode = { path = "../pf-encode" }
# Frame capture backends (Linux PipeWire portal + Windows IDD direct-push) behind one Capturer
# trait, extracted to a subsystem crate (plan §W6). The facade (src/capture.rs) hands it the
# pre-resolved encode facts + the sealed-channel delivery closure so the edge stays one-way.
pf-capture = { path = "../pf-capture" }
# Input injection backends (per-OS injectors + the virtual-gamepad HID stack), extracted to a
# subsystem crate (plan §W6). Consumes core::input; the heavy input deps (wayland/reis/xkbcommon/
# usbip) moved with it.
pf-inject = { path = "../pf-inject" }
# Host audio (PipeWire/WASAPI capture, the virtual mic, pad audio, the Windows wiring plan),
# extracted to a subsystem crate (plan §W6). The PipeWire binding moved with it.
pf-audio = { path = "../pf-audio" }
# Virtual-display orchestration (per-compositor Linux backends + the Windows IddCx driver backend),
# extracted to a subsystem crate (plan §W6). The DDC panel control + KWin zkde protocol moved with it.
pf-vdisplay = { path = "../pf-vdisplay" }
# Shared clipboard (design/clipboard-and-file-transfer.md §4): the per-OS session-clipboard
# backends + coordinator. Portable dep — the crate's facade (policy / ClipCoordCmd / start)
# compiles everywhere; the backends are cfg-gated inside it.
pf-clipboard = { path = "../pf-clipboard" }
# M3 native control plane (the `punktfunk/1` QUIC handshake; data plane stays native-thread UDP).
quinn = { workspace = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The log ring (log_capture.rs) normalizes `log`-crate events off the bridge's "log" shim target
# back to the real module path, so the console's target column and the ring's noise gate see
# `mdns_sd::…` instead of "log".
tracing-log = "0.2"
# `log::LevelFilter` for the bridge's max-level in `log_capture::install_global` (which inits the
# tracing-log bridge with `ignore_crate("wasapi")`). Already in the tree transitively.
log = "0.4"
axum = "0.8"
mdns-sd = "0.21"
# Wake-on-LAN: report the host's wake-capable NIC MAC(s) to clients via the mDNS `mac` TXT record.
# `mac_address` reads a NIC's hardware address; `if-addrs` maps the routed IP to its interface name.
mac_address = "1"
# `link-local` named explicitly for the same reason as in punktfunk-core: mdns-sd (right above)
# turns it on by unification anyway, and `wake_macs` should not enumerate a different set of NICs
# depending on which other crates share the build.
if-addrs = { version = "0.15", features = ["link-local"] }
# `SO_EXCLUSIVEADDRUSE` on the TCP listeners (gamestream/tls.rs): std's bind leaves a
# wildcard-held port open to a same-account specific bind on Windows.
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
# GameStream-only (behind the `gamestream` feature): the Moonlight RSA-2048 identity generator +
# pairing signer (cert.rs, pairing.rs) and the legacy-client-cert leniency verifier (tls.rs).
# The native planes use the P-256 identity (src/hostsys/identity.rs) and never touch this crate — so a
# native-only build also sheds the accepted Marvin advisory (RUSTSEC-2023-0071, .cargo/audit.toml).
#
# TWO independent `rsa` features, arriving from two different bumps in this wave — both are load-
# bearing, and taking either side alone breaks the build:
#
# `sha2` re-exports the `sha2` that `rsa`'s OWN trait generation speaks. `rsa` 0.9 is built on
# `digest 0.10`, and the rest of this crate is on the `digest 0.11` wave (sha2 0.11 / hmac 0.13) —
# so the digest types that appear as `rsa` TYPE PARAMETERS (`SigningKey<Sha256>` in cert.rs,
# `VerifyingKey<_>` in pairing.rs and tls.rs) must come from `rsa::sha2`, not from the `sha2`
# below. Everything else (plain hashing, HMAC) uses the 0.11 one. Collapsing the two needs `rsa`
# 0.10, which is still release-candidate only — not something the Moonlight pairing ceremony
# should ride.
#
# `getrandom` is NOT one of rsa's defaults; we ask for it because `RsaPrivateKey::new` wants an
# rng implementing rand_core **0.6**'s traits, and since our own `rand` moved to 0.9 no rng we
# hold satisfies that bound any more. The feature exposes `rsa::rand_core::OsRng`, which does —
# see the keygen in gamestream/cert.rs. Getting it from rsa's own re-export is what keeps the two
# rand_core majors from being something this crate has to name.
rsa = { version = "0.9", optional = true, features = ["sha2", "getrandom"] }
# `oid` is default-on in sha2 0.11 and was only ever needed for the RSA signer, which now takes
# its digest from `rsa::sha2` (above).
sha2 = "0.11"
aes = "0.9"
aes-gcm = "0.11"
cbc = { version = "0.2", features = ["alloc"] }
# 0.9, matching punktfunk-core and pf-client-core — the host was the last 0.8 holdout, and that
# was drift, not a pin. NOTE this does NOT take rand 0.8 out of the gamestream build: `rsa` pulls
# it transitively through `num-bigint-dig`, so 0.8 only disappears from the native-only host
# (`--no-default-features`, where `rsa` is absent). What it does buy everywhere is that OUR calls
# all speak one rand major.
rand = "0.9"
hex = "0.4"
# Cover-art delivery in the game library: encode Lutris's local JPEGs into `data:` URLs and decode
# the Epic launcher's base64 `catcache.bin`. Cross-platform (Linux Lutris art + Windows Epic art).
# `default-features = false` + `std` deliberately: 0.23 added a default-ON `simd-unsafe` feature
# (hand-written AVX2/NEON engines). ureq already declares base64 exactly this way, so taking the
# defaults here would unify the feature ON and pull that unsafe code into every build as a side
# effect of a version bump. Turning it on is a perf decision worth making on purpose, with a
# measurement — not one to inherit silently. `std` covers everything we call (`Engine::encode`,
# `decode` to a `Vec`).
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Blocking HTTP for the library art store: the proxy fetches a cover the first time a client asks
# for one, on a `spawn_blocking` thread off the async runtime. `ureq` is small + sync (no tokio
# here) and bundles webpki roots (no system cert dependency).
ureq = { workspace = true, features = ["gzip"] }
rcgen = { workspace = true }
# ⚠ Do not float this back below 0.18. 0.16 was the LAST crate pulling `thiserror` 1.0 into the
# host graph (via asn1-rs 0.6 / der-parser 9 / oid-registry 0.7); 0.18 moves that chain to asn1-rs
# 0.7 + thiserror 2, so the host now links exactly one thiserror major. `cargo tree -p
# punktfunk-host -i thiserror@1` must keep reporting no match.
x509-parser = "0.18"
# (axum-server left with the plain-HTTP nvhttp listener: both nvhttp listeners now run the
# governed tokio-rustls/hyper accept loop in gamestream/tls.rs — connection ceilings + header
# deadlines, security-review 2026-08-31 M-6 — which axum-server could not express.)
# The workspace entry's `prefer-post-quantum` offers X25519MLKEM768 first on the mgmt/native TLS
# 1.3 listeners; classical curves stay in the list, so a client without ML-KEM still connects.
# Keep `tls12` for GameStream/Moonlight clients that negotiate TLS 1.2.
rustls = { workspace = true, features = ["tls12", "logging"] }
# Manual HTTPS+mTLS serve loop for the mgmt API (axum-server can't surface the peer cert): a
# tokio-rustls handshake exposes the client cert, then hyper serves the axum Router with the
# verified fingerprint injected as a request extension. Versions match the workspace lock.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
# The browser plane (`webtransport.rs`, design/web-client-implementation-plan.md Phase 1). Builds
# on the same quinn 0.11 / rustls 0.23 the native plane already resolves, so nothing forks.
#
# ⚠ `default-features = false` is LOAD-BEARING. wtransport's default set is
# `["self-signed", "ring"]`, and `ring` would put a SECOND crypto stack back into a tree that
# moved to aws-lc-rs on purpose — the same trap the `ureq` line above spells out. Name
# `aws-lc-rs` explicitly and the whole graph (quinn, rustls, rcgen) follows this crate's backend.
# `self-signed` is what supplies `Identity::self_signed_builder`, which mints the ECDSA P-256
# certificate the WebTransport spec demands and caps its validity at the two weeks
# `serverCertificateHashes` refuses to exceed.
# `quinn` exposes `Connection::quic_connection()`, the QUIC connection underneath a
# WebTransport session — which is how `native::link` answers path and lifecycle questions
# once for both carriers instead of branching. It is the same quinn this crate already
# resolves, so the feature adds no dependency.
wtransport = { version = "0.7", default-features = false, features = ["aws-lc-rs", "self-signed", "quinn"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
# Stream combinators for the mgmt API's SSE event feed (`GET /api/v1/events`) — already in the
# tree transitively (axum/hyper) and as a Linux target dep; control plane only.
futures-util = "0.3"
# Webhook signing (X-Punktfunk-Signature: sha256=<hex HMAC>) for operator hooks; pairs with
# the existing sha2. Already in the lockfile transitively.
hmac = "0.13"
# GameStream control-stream ENet — a c2rust-style transpile of C ENet (158 unsafe sites; raw
# pointer arithmetic, manual allocation). Its port binds only while a pairing exists (rust-safety
# WP0, gamestream/control.rs) and the whole crate exists only behind the `gamestream` feature
# (WP19) — a native-only build contains no transpiled C ENet at all. Pinned EXACTLY so a bump is
# a deliberate, reviewed act rather than a lockfile refresh, and left to the cargo-audit job
# (audit.yml) to flag advisories against it.
rusty_enet = { version = "=0.4.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Management/control-plane REST API + OpenAPI (control pane, M2). `axum_extras` wires
# utoipa into axum 0.8 extractors; utoipa-axum collects `#[utoipa::path]` routes into the
# spec; utoipa-scalar serves the interactive docs. Codegen-friendly: the spec is emitted
# verbatim by the `openapi` subcommand. Control plane only — never the per-frame path.
# SHA-256 over the downloaded installer and its signing-leaf DER (update/windows.rs) — Windows-only
# in practice, the plugin-store's ed25519 path re-exports pf-update-check's verifier. Already in the
# tree via rustls; its API is ring-compatible by design, which is what made the swap mechanical.
aws-lc-rs = { workspace = true }
# Semver comparisons for the plugin store: `minHost` gating and the revocation list's version
# ranges (`<0.3.2`). Already in the lockfile transitively.
semver = "1"
# RFC3339 timestamps on plugin access grants (`plugins::access`). Std only — no tzdb.
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

[dev-dependencies]
# (`tower` drives the management API router in-process in the handler tests, but it is already a
# normal dependency above and those are visible to tests — the dev-dependency re-declaration was
# redundant.)
http-body-util = "0.1"
# An HTTP/2 client for the management API's multiplexing test (`gamestream/tls.rs`).
h2 = "0.4"
# Disposable directory fixtures for the Steam local-librarycache scan tests (library.rs).
tempfile = "3"
# The C ABI, driven from Rust by the native plane's connection round-trip tests (native.rs).
punktfunk-ffi = { path = "../punktfunk-ffi", features = ["quic"] }

# Opus for the pad-audio encoder (`native::pad_audio`) and `opus::Error` on the audio planes; the
# desktop encoder and the mic pump live in pf-audio. The crate vendors libopus (cmake-built from
# source — no system lib, no vcpkg), so it builds on Windows MSVC too (needs CMake + NASM, both on
# the box) and on macOS, where `punktfunk-core` already vendors it for the client.
[target.'cfg(any(unix, windows))'.dependencies]
opus = "0.3"

[target.'cfg(unix)'.dependencies]
# The POSIX calls behind the `#[cfg(unix)]` helpers in `hooks.rs` (kill) and the SIGTERM
# ladder in `gamelease.rs`. Declared for every unix, not just Linux, or a macOS build fails on
# code whose own cfg already says it is portable.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# `screencast` gates the ScreenCast portal module; `remote_desktop` adds the RemoteDesktop
# portal we use for libei input on KWin/GNOME; `tokio` is the default runtime.
# `open_pipe_wire_remote` is unconditional, so ashpd's own `pipewire` feature is not
# needed — pf-capture and pf-audio drive PipeWire with the `pipewire` crate.
# `settings` adds the org.freedesktop.portal.Settings proxy the console's theme route reads
# (design/web-console-overhaul.md §7) — the only cross-desktop source for the desktop's own
# mode and accent. `inhibit` vetoes the desktop's idle suspend during a stream.
ashpd = { version = "0.13", features = ["screencast", "remote_desktop", "settings", "inhibit"] }
# (ashpd 0.13 drives the one-time portal handshake on tokio; the unconditional `tokio = "full"`
# in [dependencies] already covers that — this block used to re-declare a strict subset of it.)
# NOTE: the Wayland stack (wayland-client / -protocols{,-wlr,-misc} / -scanner / -backend),
# `xkbcommon`, `reis`, `khronos-egl`, `ash` and `usbip-sim` used to be declared here. The code that
# used them moved to `pf-inject` (virtual input, libei, USB/IP) and `pf-zerocopy` (EGL/Vulkan dmabuf)
# in the subsystem extraction, and each of those crates declares them itself — only the manifest
# entries were left behind, along with comments describing code this crate no longer contains.
# Verified unused before removal: zero `use`/path references across src/ + build.rs.

[target.'cfg(target_os = "windows")'.dependencies]
# The seat supervisor the service runs beside the console host (windows/service/seats.rs).
pf-seats = { path = "../pf-seats" }
# Windows host backends. `windows` covers the Win32/CCD APIs the SudoVDA virtual-display backend
# drives (SetupAPI device enumeration, DeviceIoControl IOCTLs, QueryDisplayConfig name resolution);
# capture/encode/input/audio backends extend the feature set as they land.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    # WinVerifyTrust + WTHelper* — Authenticode verification of a downloaded host installer
    # before the update apply spawns it (update/windows.rs). The WTHelper accessors are gated
    # behind the Catalog+Sip features in windows-rs, hence the extra two.
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    # CERT_CONTEXT for the signing-leaf fingerprint pin (same file).
    "Win32_Security_Cryptography",
    # ConvertStringSecurityDescriptorToSecurityDescriptorW — the SDDL on the virtual-DualSense
    # shared-memory section (inject/dualsense_windows.rs) so the UMDF host can open it.
    "Win32_Security_Authorization",
    "Win32_Devices_DeviceAndDriverInstallation",
    # SwDeviceCreate/SwDeviceClose — the per-session virtual-DualSense devnode
    # (inject/dualsense_windows.rs).
    "Win32_Devices_Enumeration_Pnp",
    "Win32_Devices_Display",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_StationsAndDesktops",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Gdi",
    # Session-local user launches (interactive.rs) and the service's active-console host selection.
    "Win32_System_RemoteDesktop",
    # Who listens on a plugin's registered loopback port (plugins/windows.rs): the launch dial
    # carries the UI secret, so the listener must still be the LocalService runner.
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    # The capture worker's three pipes (windows/capture_worker.rs).
    "Win32_System_Pipes",
    "Win32_System_Environment",
    # Module-path crash records and the System32-scoped AVRT loader.
    "Win32_System_LibraryLoader",
    # VirtualProtect — for the inline patch of the win32u GPU-preference shim (Apollo's MinHook port:
    # the hybrid-GPU output-reparenting hook that keeps Desktop Duplication stable on a 4090+iGPU box).
    # See capture/windows/dxgi.rs `install_gpu_pref_hook`. No trampoline (we fully replace the fn) → no detour
    # crate / no C length-disassembler dep; a 12-byte absolute-jmp prologue patch suffices.
    "Win32_System_Memory",
    # Per-monitor-v2 DPI awareness — IDXGIOutput5::DuplicateOutput1 (the modern capture path Apollo
    # uses; FP16/format-list, robust to overlay/format churn) requires the process to be DPI-aware.
    "Win32_UI_HiDpi",
    # Windows service supervisor (src/windows/service/runtime.rs): a kill-on-close job object so a
    # service crash never orphans the SYSTEM host it launched into the active console session.
    "Win32_System_JobObjects",
    # A packaged game's window property store (src/windows/game_term.rs): COM, IPropertyStore, and
    # the PROPVARIANT it returns (StructuredStorage, gated on Variant). The audio endpoint work
    # declares its own in pf-audio.
    "Win32_System_Com",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # The console user's theme values (src/windows/theme.rs).
    "Win32_System_Registry",
    # SetUnhandledExceptionFilter + EXCEPTION_POINTERS — the last-resort native-crash logger
    # (src/windows/crash.rs); Kernel gates the CONTEXT type EXCEPTION_POINTERS embeds.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    # CreateToolhelp32Snapshot/Process32*W — the conflicting-streaming-host process scan
    # (src/detect/windows.rs): is Sunshine/Apollo/... running alongside us?
    "Win32_System_Diagnostics_ToolHelp",
    # GetApplicationUserModelId — a packaged (UWP) game's identity, which its frame window carries
    # (src/windows/game_term.rs).
    "Win32_Storage_Packaging_Appx",
    # The host power actions (src/hostsys/power.rs, design/host-actions.md): SetSuspendState /
    # IsPwrSuspendAllowed (Power) and InitiateSystemShutdownExW + the SeShutdownPrivilege
    # constants (Shutdown).
    "Win32_System_Power",
    "Win32_System_Shutdown",
] }
# The SCM plumbing for the `service` subcommand (define_windows_service! / dispatcher / control
# handler / ServiceManager install). Wraps the Win32 service API; the supervision loop itself uses
# the `windows` crate above.
# ⭐ Keep this at 0.8+: 0.7 was the LAST crate in the tree pulling `windows-sys 0.52`, so it alone
# kept a fourth windows-sys major compiling. 0.8.1 moves to `windows-sys 0.61`, which the tree
# already builds, and that duplicate is gone. (0.8.0 is NOT enough — it lands on 0.59.)
windows-service = "0.8"
# Registry reads the host does on Windows — ergonomic + correct-by-construction vs. hand-rolled
# Reg* FFI for subkey enumeration. Survived the removal of the built-in store scanners (which is
# what first pulled it in): `library/launch.rs` resolves launcher install paths for the typed launch
# kinds a plugin publishes and `procscan/windows.rs` maps processes.
winreg = "0.56"
# The pad-audio capture thread's COM init and the `pad-endpoint reshape` devtest's sample types;
# capture itself lives in pf-audio.
wasapi = "0.24"
# Shared host<->driver wire contract for the pf-vdisplay IddCx virtual-display backend: the
# control-plane IOCTL codes + `#[repr(C)] Pod` request/reply structs, defined ONCE so host<->driver
# ABI drift is a compile error (used from `capture.rs`). The `bytemuck` that serializes those
# structs into the DeviceIoControl buffers is pf-vdisplay's dependency, not this crate's — it was
# declared here too, unused.
pf-driver-proto = { path = "../pf-driver-proto" }

# The encode feature flags now FORWARD to the pf-encode subsystem crate (the heavy encoder deps —
# ffmpeg-next, the NVENC SDK, openh264, pyrowave-sys — moved there, plan §W6). Selecting a feature
# on the host turns on the matching backend inside pf-encode.
[features]
# PyroWave ships in every default build (the codec stays strictly opt-in per session — a client
# must explicitly prefer CODEC_PYROWAVE; nothing changes for normal HEVC/AV1 sessions).
# GameStream ships in every default build too (still runtime-OPT-IN via --gamestream /
# PUNKTFUNK_GAMESTREAM); building with `--no-default-features --features pyrowave` produces the
# hardened NATIVE-ONLY host — no Moonlight-compat planes, no `rusty_enet` (transpiled C), no
# `rsa` (rust-safety WP19). `serve --gamestream` on such a binary refuses to start, loudly.
default = ["pyrowave", "gamestream"]
# The GameStream/Moonlight-compat planes (nvhttp pairing, RTSP, ENet control, `_nvstream` mDNS)
# at COMPILE time — see the `default` note above for what leaving it off buys.
gamestream = ["dep:rusty_enet", "dep:rsa"]
# NVENC hardware encode (Linux CUDA + Windows D3D11). OFF by default; entry points resolved at
# RUNTIME from the driver DLL/so, so the same binary starts fine on AMD/Intel boxes. Build the GPU
# host with `--features nvenc`.
nvenc = ["pf-encode/nvenc"]
# Native Intel QSV via the statically linked VPL dispatcher (Windows). OFF by default: needs
# cmake + libclang at build (both already required by pyrowave); runtime GPU libs come from the
# Intel driver store, so the same binary starts fine on NVIDIA/AMD boxes
# (design/native-qsv-encoder.md). ⚠ Like `nvenc`: hand builds for Intel boxes need
# `--features qsv` or the box has no QSV path.
qsv = ["pf-encode/qsv"]
# Raw Vulkan Video HEVC/AV1 encode on Linux (AMD/Intel) — real reference-frame-invalidation loss
# recovery via explicit DPB reference slots (design/linux-vulkan-video-encode.md). OFF by default;
# reuses pf-encode's `ash` bindings (no new dep). Runtime-gated further by PUNKTFUNK_VULKAN_ENCODE.
vulkan-encode = ["pf-encode/vulkan-encode"]
# PyroWave — the opt-in wired-LAN intra-only wavelet codec (design/pyrowave-codec-plan.md). Builds
# the vendored codec from source in pf-encode. ON by default (see `default`); sessions reach it only
# through explicit client opt-in.
pyrowave = ["pf-encode/pyrowave"]

