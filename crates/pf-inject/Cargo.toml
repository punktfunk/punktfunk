# Input injection (plan §W6): the per-OS injector backends (wlroots virtual-input, KWin fake_input,
# libei/reis, gamescope-EI on Linux; SendInput on Windows) + the virtual-gamepad HID stack (DualSense/
# DualShock4/Switch Pro/Steam Controller/Deck over uhid/usbip and the Windows UMDF drivers), extracted
# into a subsystem crate. Consumes punktfunk_core::input (the neutral GamepadEvent/InputEvent vocabulary,
# moved to core in W5) and the pf-driver-proto wire contract; NEVER reaches the orchestrator (the one
# gamescope-EI socket path is the shared pf-paths contract, not a vdisplay reach-in).
[package]
name = "pf-inject"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "punktfunk host input injection: per-OS keyboard/mouse injectors + the virtual-gamepad HID backends behind one InputInjector trait."
publish = false

[dependencies]
# The input wire types (`input`, `quic::{RichInput, HidOutput, Pen*}`) live outside the `quic`
# feature, so the input crate never builds quinn, rustls or opus.
punktfunk-core = { path = "../punktfunk-core", default-features = false }
pf-driver-proto = { path = "../pf-driver-proto" }
pf-host-config = { path = "../pf-host-config" }
pf-paths = { path = "../pf-paths" }
anyhow = "1"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
parking_lot = "0.12"
# The RemoteDesktop portal for the libei injector on KWin/GNOME (headless grant via kde-authorized).
# `screencast` too: ashpd 0.13's `remote_desktop` names `screencast::Stream` without enabling it.
ashpd = { version = "0.13", features = ["remote_desktop", "screencast"] }
# The shared, never-dropped portal runtime the libei worker parks on.
pf-portal = { path = "../pf-portal" }
# Input injection into headless Sway via the wlroots virtual-input Wayland protocols.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }
# Codegen for KDE's `org_kde_kwin_fake_input` (vendored in `protocols/fake-input.xml`); the generated
# interface tables reference `wayland-backend`.
wayland-scanner = "0.31"
wayland-backend = "0.3"
# libei (EI sender) for the portable input path on KWin/GNOME (RemoteDesktop portal) + gamescope-EI.
reis = { version = "0.7.1", features = ["tokio"] }
futures-util = "0.3"
# `macros` is for the `tokio::select!` in the libei and steam_usbip worker loops. It used to be
# absent and compile anyway, borrowed from punktfunk-core's `quic` feature via unification — i.e. an
# unrelated crate dropping it would have broken this one.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros"] }
# Builds/validates the xkb keymap uploaded to the virtual keyboard + tracks modifier state.
xkbcommon = "0.9"
# Vendored + trimmed usbip server core — presents a virtual Steam Deck over USB/IP for Steam Input.
usbip-sim = { path = "vendor/usbip-sim" }

[target.'cfg(target_os = "windows")'.dependencies]
# The streamed-output desktop rect (CCD source rect) absolute input maps into — the same
# resolver the cursor-readback poller uses, so inject and readback always agree.
pf-win-display = { path = "../pf-win-display" }
# The gamepad-channel bootstrap reuses the IDD-push WUDFHost verification (`open_wudfhost`).
# Windows-only: the one use site is, and on Linux this would drag pipewire, ashpd, x11rb and
# wayland into an input crate's closure.
pf-capture = { path = "../pf-capture" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Enumeration_Pnp",
    # SwDeviceCreate's SW_DEVICE_CREATE_INFO references DEVPROPKEY (Properties).
    "Win32_Devices_Properties",
    # The channel proof: HidD_GetIndexedString + GUID_DEVINTERFACE_HID (the pads/mouse leg) and
    # CreateFileW to open the device interface the proof is asked over.
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    # The xinputhid service probe: a filter service PnP cannot resolve kills the devnode.
    "Win32_System_Registry",
    "Win32_System_IO",
    # The HID selftest's hidden window and low-level hooks.
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    # Raw input, for the HID selftest's recorder.
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    # Synthetic pointer devices (PT_PEN / PT_TOUCH) — the pen/touch injectors. The device
    # create/destroy + POINTER_TYPE_INFO live under Controls in this metadata layout;
    # InjectSyntheticPointerInput + POINTER_*_INFO under Input_Pointer.
    "Win32_UI_Controls",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Reads `crates/punktfunk-core/testdata/gamepad-button-vectors.json`.
serde_json = "1"

[lints]
workspace = true
