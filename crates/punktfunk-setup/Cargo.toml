# The guided installer's engine (design/installer-v2.md). Deliberately tiny: no tokio, no
# async, no platform crates — it has to build static against musl in seconds and run on a box
# where nothing is installed yet. The TUI deps (cliclack/crossterm) arrive with M2.
[package]
name = "punktfunk-setup"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Guided punktfunk installer: probe the box, derive a plan, run it."
publish = false

[dependencies]
console = "0.16"
# The host's own settings store, so a setting lands validated and owner-only. No platform crates.
pf-host-config = { path = "../pf-host-config" }
# host.env's grammar, read the way the Windows service reads it.
pf-paths = { path = "../pf-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NLA network categories for the D12 probe — the one question no locale-safe exe can answer.
# Target-gated: the static musl build never sees it, so D8's tiny-dep promise holds.
[target.'cfg(windows)'.dependencies]
getrandom = "0.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_NetworkListManager",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3"

[lints]
workspace = true
