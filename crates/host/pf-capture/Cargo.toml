# Frame capture (plan §7 / §W6): the Linux xdg-ScreenCast/PipeWire portal capturer and the Windows
# IDD direct-push capturer, plus the synthetic sources + the Capturer trait, extracted into a
# subsystem crate. Depends on the shared frame vocabulary (pf-frame), the zero-copy plumbing
# (pf-zerocopy), and the display leaves (pf-win-display) — never on pf-encode: the encode-backend
# facts arrive pre-resolved (ZeroCopyPolicy) and the sealed-section delivery as a closure
# (SetEncodeSender), so the capture→encode edge is one-way (plan §2.4).
[package]
name = "pf-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "punktfunk host frame capture: Linux PipeWire portal + Windows IDD direct-push capturers behind one Capturer trait."
publish = false

[dependencies]
pf-frame = { path = "../pf-frame" }
pf-zerocopy = { path = "../pf-zerocopy" }
pf-win-display = { path = "../pf-win-display" }
pf-gpu = { path = "../pf-gpu" }
pf-host-config = { path = "../pf-host-config" }
# The host<->driver wire contract: control IOCTL structs and the v7 AU section. Every target:
# the AU reader's pure half is unit-tested off Windows.
pf-driver-proto = { path = "../pf-driver-proto" }
anyhow = "1"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# The xdg ScreenCast + RemoteDesktop portals, and the PipeWire consumer for the capture frames.
ashpd = { version = "0.13", features = ["screencast", "remote_desktop"] }
# `v0_3_49` (as pf-client-core): `Stream::is_driving`/`trigger_process` for the lazy driver.
pipewire = { version = "0.10", features = ["v0_3_49"] }
libc = "0.2"
# The dmabuf read-ready fence wait before a frame is handed on.
pf-dmabuf = { path = "../../core/pf-dmabuf" }
# The shared, never-dropped portal runtime, the bounded handshake steps and the cursor negotiation.
pf-portal = { path = "../pf-portal" }
# ashpd 0.13 uses the tokio runtime for the one-time portal handshake (control plane).
# `sync` is for the `tokio::sync::oneshot` quit channels in the portal/linux capture paths. It used
# to be absent and compile anyway, borrowed from ashpd→zbus via feature unification.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync"] }
# XFixes cursor source for gamescope (remote-desktop-sweep Phase C): gamescope paints no
# `SPA_META_Cursor`, so the pointer never reaches the PipeWire node. We read the shape/hotspot/
# visibility from gamescope's nested Xwayland via XFixes instead and feed the existing cursor slot.
# `RustConnection` is the pure-Rust default (no libxcb link → no new C dependency on the host); the
# `xfixes` feature (auto-pulls `render` + `shape`) is what exposes GetCursorImage/SelectCursorInput.
x11rb = { version = "0.14", default-features = false, features = ["xfixes"] }
# Direct `ext-image-copy-capture-v1` capture (`linux/wl_capture.rs`): the same
# wayland-client + scanner pair pf-vdisplay uses for KWin's screencast, with the protocol
# XML vendored under `protocols/`. The buffers we allocate come from libgbm, which
# pf-zerocopy already links for the EGL importer — no new build dependency.
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
# The scanner emits `bitflags::bitflags!` for linux-dmabuf's tranche/flag bitfields.
bitflags = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# The `Encoder` contract the driver-encode proxy implements, and the D3D11 converters the
# P010 self-test drives.
pf-encode-win = { path = "../pf-encode-win" }
# The capture worker's messages are Pod; pinned to pf-driver-proto's so the graph resolves one.
bytemuck = "1.19"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
