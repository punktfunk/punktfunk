# The seat supervisor (design/multi-seat-product.md). The core builds and tests on every
# platform. Windows runs it inside the punktfunk service behind a SYSTEM-only pipe and adds
# accounts, credentials and job-contained seat hosts; the RDP keeper links IronRDP and builds
# apart, in crates/host/pf-seat-keeper. Linux runs it as the root `punktfunk-seats` daemon behind a
# Unix socket and starts one systemd unit per seat.
[package]
name = "pf-seats"
description = "Multi-seat supervisor: seat ledger, Windows RDP keepers and seat hosts, the Linux seat daemon"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aws-lc-rs = { workspace = true }
hex = "0.4"
pf-paths = { path = "../pf-paths" }
rand = "0.10"
rustls = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
zeroize = "1"

# `net` reads a socket peer's credentials (SO_PEERCRED), `fs` opens a file without following a
# link, `process` names the uid the state directory must belong to, `thread` drops the login
# helper's child to its person and `mount` clones a checked folder onto a seat's stage, all
# through safe wrappers, so this half denies unsafe code except
# in `linux::pam`, `linux::login`, one call of `linux::handover` and `linux::loopback`'s `bpf(2)`.
# `pam` loads libpam at run time,
# since this crate is linked into `punktfunk-host` too and only the seat daemon may need the
# library. PAM frees the answers its conversation returns with `free()`, so they come from
# libc's own allocator.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
libloading = "0.9"
rustix = { version = "1", features = ["fs", "mount", "net", "process", "thread"] }
# Checks the console certificate root installs for Firefox (`linux::firefox`).
x509-parser = "0.18"

[target.'cfg(windows)'.dependencies]
pf-paths-win = { path = "../pf-paths-win" }
# The seat listener's name and port, shared with the keeper and `pf_seat_audio.dll`.
pf-driver-proto = { path = "../pf-driver-proto" }
windows-service = "0.8"
winreg = "0.56"
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[dev-dependencies]
pf-host-config = { path = "../pf-host-config" }
rcgen = { workspace = true }
tempfile = "3"

[lints]
workspace = true
