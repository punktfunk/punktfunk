# Shared clipboard (design/clipboard-and-file-transfer.md §4): the host-side session-clipboard
# backends — `ext-data-control-v1` (KWin/wlroots/Sway/Hyprland), Mutter's *direct*
# `org.gnome.Mutter.RemoteDesktop.Session` clipboard and gamescope's Xwayland selections on
# Linux, the Win32 clipboard (delayed rendering) on Windows — behind one `HostClipboard`, plus the
# backend-agnostic session coordinator bridging it to the QUIC clipboard plane. The wire protocol
# and the client half live in `punktfunk-core`; the orchestrator consumes only the portable
# facade in `src/lib.rs`, so it stays free of platform cfg.
[package]
name = "pf-clipboard"
version.workspace = true
edition.workspace = true
# Not workspace-inherited (1.85): the Wayland transfer pipe is `std::io::pipe`, stable in 1.87.
# rust-toolchain.toml pins 1.96, so this records reality rather than raising it.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "punktfunk host shared clipboard: per-OS session-clipboard backends behind one HostClipboard + the QUIC clipboard-plane coordinator."
publish = false

[dependencies]
pf-host-config = { path = "../pf-host-config" }
punktfunk-core = { path = "../../core/punktfunk-core", features = ["quic"] }
anyhow = "1"
tracing = "0.1"
quinn = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
# CF_DIB <-> PNG conversion (winfmt) - most Windows apps paste bitmaps, not the "PNG" format.
# Unconditional (not windows-gated) so winfmt's pure-conversion unit tests also run on Linux.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Mutter's direct RemoteDesktop clipboard is raw D-Bus via `ashpd::zbus` — NOT the xdg
# `org.freedesktop.portal.Clipboard`, which needs an interactive grant a headless host can't
# answer. Reusing ashpd's zbus re-export keeps one zbus version across the workspace.
ashpd = "0.13"
# `session_bus`: the live session's bus, by the address the host detected.
pf-portal = { path = "../pf-portal" }
futures-util = "0.3"
# Raw fd plumbing: `poll` on the Wayland and X sockets and on host selection reads, `fcntl`
# un-nonblocking on Mutter's transfer fds.
libc = "0.2"
wayland-client = "0.31"
# `staging`: `ext_data_control_v1` (the session-clipboard protocol) ships in the staging set.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# gamescope's clipboard lives on its Xwayland as ICCCM selections; `xfixes` reports owner changes.
x11rb = { version = "0.14", default-features = false, features = ["xfixes"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The Win32 clipboard on a hidden message-loop window: `WM_CLIPBOARDUPDATE` listener + delayed
# rendering (`WM_RENDERFORMAT`) for text / CF_HTML / RTF / images.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # `WNDCLASSW` / `RegisterClassW` exist only with the Gdi feature (`hbrBackground` is an
    # `HBRUSH`). Declared here so a standalone `cargo check -p pf-clipboard` builds.
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# NSPasteboard.
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }

[lints]
workspace = true
