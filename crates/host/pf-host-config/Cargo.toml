# The process-wide host configuration (HostConfig + the config() snapshot) in a leaf crate, so
# every subsystem crate (pf-encode, pf-capture, pf-vdisplay, pf-gpu) can read config WITHOUT
# depending on the orchestrator.
[package]
name = "pf-host-config"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Process-wide punktfunk host configuration: the settings registry, its store, and the env knobs."
publish = false

[dependencies]
pf-paths = { path = "../pf-paths" }
serde_json = "1"

[lints]
workspace = true
