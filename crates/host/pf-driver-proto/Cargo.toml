# Shared host<->driver binary contracts for punktfunk's Windows drivers (display, pads, mouse).
#
# Deliberately self-contained (no workspace-inherited dependencies, no Windows deps): this crate is a
# path dependency of BOTH the host workspace (crates/host/punktfunk-host) AND the out-of-workspace driver
# workspace (packaging/windows/drivers/), so it must resolve identically from either build graph. It is
# `no_std` (+ alloc) and platform-neutral; the GUID/LUID are plain integers each side converts to its
# own OS type. Defining every wire struct ONCE here — with `const` size/offset asserts + bytemuck
# round-trips — makes host<->driver ABI drift a COMPILE error instead of a silent frame/IOCTL corruption.
[package]
name = "pf-driver-proto"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Shared host<->driver binary contracts for the punktfunk Windows drivers: virtual display (control IOCTLs, encode transport, cursor), gamepads and mouse."
publish = false

[dependencies]
# `min_const_generics`: Pod/Zeroable for `[u8; N]` of any N (the gamepad SHM reserved tails are >32).
bytemuck = { version = "1.19", features = ["derive", "min_const_generics"] }

[dev-dependencies]
# Reads `clients/shared/sc2-vectors.json`. A path dependency's dev-dependencies never reach
# the driver workspace's graph.
serde_json = "1"

[lints]
workspace = true
