[package]
name = "pf-console-ui"
description = "The Skia console UI for the Vulkan session binary — stats OSD, capture HUD, and (next) the gamepad library; renders on the presenter's device via the Overlay contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The Vulkan session's overlay (`SkiaOverlay` over pf-presenter's shared device + the SDL event
# path). ON by default so `clients/session` is unchanged; the Android host turns it off
# (`default-features = false`) and drives the portable `Console` over its own EGL surface.
# ⚠ Also what puts `vulkan` (+ `ganesh`) on skia-safe: with it the desktop's prebuilt key is
# `ganesh-jpegd-jpege-pdf-textlayout-vulkan`, which the flatpak pins by hand. Without it Android
# resolves `ganesh-gl-jpegd-jpege-pdf-textlayout`. A key that drifts makes skia-bindings
# build Skia from source for hours.
default = ["vulkan-overlay"]
vulkan-overlay = ["dep:pf-presenter", "dep:ash", "dep:sdl3", "skia-safe/vulkan", "skia-safe/ganesh", "desktop"]

# pf-client-core's desktop half, mirrored as a feature HERE so this crate's own sources can
# test for it — `cfg(feature = "desktop")` in this crate means THIS feature, never the
# dependency's, which is the trap that makes the two drift.
#
# Two things need it. `skia_overlay` names `video::QueueLock`. And `ring::actions` calls
# `host_actions::cached`, whose cache only ever fills from a ureq fetch the desktop client
# makes — so a GL host takes the same empty list Android already takes.
desktop = ["pf-client-core/desktop"]

# Skia's GL backend for a Linux consumer that has no Vulkan presenter and no SDL3 — a TV app
# drawing on an EGL surface it owns (design/webos-skia-console-port.md §2.1). Android already
# asks for `gl` from its own target block; this is the same ask spelled for Linux, where the
# default is Vulkan and there was previously no way to request a GPU canvas at all.
# ⚠ Changes the prebuilt key to `ganesh-gl-jpegd-jpege-pdf-textlayout`. rust-skia publishes no
# armv7-unknown-linux-gnueabi archive for it; ours is built and hosted like the armeabi-v7a one
# (provenance in clients/android/kit/build.gradle.kts).
gl = ["skia-safe/gl"]

# Skia's Metal backend for an Apple host (`clients/apple/native`). Take it with
# `default-features = false`: rust-skia publishes no archive that has both `metal` and `vulkan`.
metal = ["skia-safe/metal", "skia-safe/ganesh"]

# Same Linux+Windows gating as the rest of the client stack.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
pf-presenter = { path = "../pf-presenter", optional = true }
# MenuEvent/MenuPulse (the gamepad service's menu mode drives the library).
# `default-features = false` like every other consumer (pf-presenter, cli, session, clients/windows):
# pf-client-core's default is `pyrowave`, which compiles the vendored PyroWave C++ — fatal on
# Windows ARM64. Whether that backend is on is the session binary's call (it forwards a `pyrowave`
# feature); this crate needs none of it, and taking defaults here quietly turned it on.
pf-client-core = { path = "../pf-client-core", default-features = false }

# Skia on the presenter's VkDevice (`vulkan`, which needs `ganesh`); `textlayout` = skparagraph
# for the console's typography. rust-skia 0.153.3 (skia hash b7f043e0b1e2a850e702) prebuilds
#   skia-binaries-b7f043e0b1e2a850e702-<target>-ganesh-jpegd-jpege-pdf-textlayout-vulkan.tar.gz
# for x86_64/aarch64 linux and x86_64 windows. A missing asset does not fail the build.
# 🛑 Check the log for `DOWNLOAD AND INSTALL SUCCEEDED` on every bump: the fallback is a
# from-source Skia build that turns a 2-minute CI leg into hours.
#
# 🛑 Half the bump is by hand: packaging/flatpak/io.unom.Punktfunk.yml pins the archives by
# URL + sha256 (the sandbox is offline) and nothing derives them from this line. A stale pin
# unpacks the old bindings.rs under the new crate and fails to compile (that is how #193 shipped).
skia-safe = { version = "0.153", features = ["textlayout"] }
ash = { workspace = true, features = ["loaded"], optional = true }

# Android (design/android-skia-console-port.md D1): the same crate over Skia's GL backend on
# the client's own EGL surface. `gl` not `vulkan` — universal on every Android device this
# client ships to (GLES 2 boxes included) and the emulator, and prebuilt:
#   skia-binaries-b7f043e0b1e2a850e702-{aarch64,x86_64}-linux-android-ganesh-gl-jpegd-jpege-pdf-textlayout.tar.gz
# ⚠ armv7-linux-androideabi has no rust-skia archive; the 32-bit TV ABI is served from our own
# release (kit/build.gradle.kts), as are byte-for-byte copies of the two 64-bit ones.
[target.'cfg(target_os = "android")'.dependencies]
skia-safe = { version = "0.153", features = ["gl", "textlayout"] }
pf-client-core = { path = "../pf-client-core", default-features = false }

# The web client (design/web-client-implementation-plan.md §1 R4): the same crate over Skia's GL
# backend, this time on a WebGL2 canvas the JS glue owns. `gl` for the same reason Android has it
# — and rust-skia publishes the key for this target too, so nothing builds Skia from source:
#   skia-binaries-b7f043e0b1e2a850e702-wasm32-unknown-emscripten-ganesh-gl-jpegd-jpege-pdf-textlayout.tar.gz
# ⚠ Emscripten's `gl` means GLES over WebGL2; a Ganesh context comes up on the canvas the
# `-sOFFSCREEN_FRAMEBUFFER`-free default binds. The WebGPU swap replaces the VIDEO canvas only
# (R1/R2), never this one.
[target.'cfg(target_family = "wasm")'.dependencies]
skia-safe = { version = "0.153", features = ["gl", "textlayout"] }
pf-client-core = { path = "../pf-client-core", default-features = false }

# Apple: the Mac runs the tests on CPU raster; an Apple host draws through `metal`. rust-skia
# 0.153.3 publishes `ganesh-jpegd-jpege-metal-pdf-textlayout` for darwin and iOS. tvOS and
# visionOS have none: our four come from `scripts/skia-apple/build.sh` and
# git.unom.io/unom/skia-binaries/releases/download/0.153.3/, with `build.rs` naming the system
# libraries skia-bindings does not link there. scripts/build-xcframework.sh pins their SHA-256s.
[target.'cfg(target_vendor = "apple")'.dependencies]
skia-safe = { version = "0.153", features = ["textlayout"] }
pf-client-core = { path = "../pf-client-core", default-features = false }

# Everything the shell itself needs, on every platform it runs on.
[target.'cfg(any(target_os = "linux", windows, target_os = "android", target_vendor = "apple", target_family = "wasm"))'.dependencies]
anyhow = "1"
tracing = "0.1"
# The host-facing model types (`HostRow`, `ConsoleCmd`, `LibraryGame`, …) derive serde so a host
# that lives across a language boundary (Android's Kotlin services, over JNI) can hand them over
# as JSON — the wire IS the model, no second set of mirror types to drift.
serde = { version = "1", features = ["derive"] }
# The Android-only settings rows live in `trust::Settings::extra` (a JSON map), so the desktop
# settings struct never grows a field only one platform reads.
serde_json = "1"
# `config::GamepadPref` keys the button-glyph style (PlayStation shapes vs ABXY).
punktfunk-core = { path = "../../core/punktfunk-core" }
# Flexbox for the element layer (`el/`). Pure Rust; flexbox and the content-size pass only.
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }

# Linux links the system SDL3; Windows builds it from source (same choice as the rest
# of the workspace's Windows SDL consumers).
[target.'cfg(target_os = "linux")'.dependencies]
sdl3 = { version = "0.20", features = ["hidapi", "ash"], optional = true }

[target.'cfg(windows)'.dependencies]
sdl3 = { version = "0.20", features = ["hidapi", "ash", "build-from-source"], optional = true }

# The shared console parity vectors (`clients/shared/console-vectors.json`) are read by tests
# here — the tab names and the transition motion — and the library
# collation vectors (`clients/shared/library-collate-vectors.json`) by a fourth (`collate.rs`).
# Dev-only: nothing in the shipping crate parses JSON. `pf-client-core` reads its own deeplink
# vectors the same way.
[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
