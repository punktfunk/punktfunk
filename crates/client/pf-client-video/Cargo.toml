[package]
name = "pf-client-video"
description = "Client video decode — the native rung ladder (Vulkan Video, VAAPI, V4L2, D3D11VA, then openh264 or rav1d), the presenter's colour vocabulary and SPIR-V, and PyroWave decode; pf-client-core re-exports it as `video`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Linux and Windows build the ladder; the other listed targets (Android, PS5, Horizon) build the
# colour, Vulkan-handoff, SPIR-V and PyroWave modules (pyrowave-sys builds for Linux, Windows,
# Android and PS5, and is an empty stub elsewhere). webOS, Apple and wasm never build this crate:
# pf-client-core pulls it only with `desktop` or `d3d11va`.
# `ash` only wraps the owner's existing raw handles.
[target.'cfg(any(target_os = "linux", windows, target_os = "android", all(target_os = "freebsd", target_vendor = "sie"), target_os = "horizon"))'.dependencies]
anyhow = "1"
tracing = "0.1"
pyrowave-sys = { path = "../../codec/pyrowave-sys", optional = true }
ash = { workspace = true, optional = true }
# The AU memory the PyroWave decoder lends the reassembler (`punktfunk_core::au`).
punktfunk-core = { path = "../../core/punktfunk-core" }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
# Native Vulkan Video decode (H.264, H.265, AV1): `auto` tries it first except where
# video_ladder puts D3D11VA ahead; also pinnable via `PUNKTFUNK_DECODER=native-vulkan`.
# video_vk_native.rs runs pf-vkdecode's VkH264Decoder/VkH265Decoder/VkAv1Decoder on the
# presenter's shared device.
pf-vkdecode = { path = "../../codec/pf-vkdecode", optional = true }
# The ladder's notices.
pf-l10n = { path = "../../../l10n", features = ["desktop"], optional = true }
# The one bitstream parser: the SOFTWARE rung reads its per-picture colour signalling,
# IDR flag and recovery-point SEI from the same `AuPlan` every hardware rung submits
# from (`video_software.rs`), so there is no second colour source to disagree with.
pf-bitstream = { path = "../../codec/pf-bitstream", optional = true }

# The software rung, the ladder's last one.
#
# H.264: openh264 (BSD-2), which the host's GPU-less encoder also uses
# (`pf-encode/src/enc/sw.rs`).
#
# AV1: rav1d (BSD-2), dav1d ported to Rust: no linker, no system library in any package.
# The `dav1d` crate would reach libdav1d through `dav1d-sys`, which is `system-deps`-only:
# it needs `dav1d.pc` and headers at build time and `libdav1d.so`/`dav1d.dll` at run time
# on every client package.
#
# `default-features = false` drops two things deliberately:
#  * `asm` — rav1d's hand-written assembly needs `nasm` at build time. openh264-sys2's
#    `try_compile_nasm` returns quietly when nasm is missing and the C build still
#    succeeds, whereas rav1d's build.rs PANICS ("NASM build failed. Make sure you have
#    nasm installed or disable the \"asm\" feature"). So turning `asm` on makes nasm a
#    hard build requirement of every client package, and `ci/rust-ci.Dockerfile` (the
#    container the client .deb and the workspace CI build in) does not have it. The rung that only ever runs BECAUSE the GPU already failed must not break
#    the legs that ship it. Turn it back on the day every client leg provisions nasm —
#    and expect a large speedup when you do; this is dav1d's asm, and the Rust fallbacks
#    are much slower.
#  * `bitdepth_16` — the CPU rung is 8-bit by contract (`video_software.rs` refuses
#    anything else rather than mis-scaling it), so building the 10/12-bit half would be
#    compiling a path the code refuses to take.
#
# One packaging risk this DOESN'T carry: rav1d exports dav1d's C ABI as `#[no_mangle]`
# symbols (`dav1d_open`, `dav1d_send_data`, …), which could in principle interpose on a
# real libdav1d loaded into the same process. It cannot here — these are Rust `staticlib`
# symbols in an executable with no `-rdynamic` and no dynamic export table entry, so the
# loader never offers them to anyone. That changes if a `cdylib` links this crate with
# `desktop` on, or a leg adds `-rdynamic`/`--export-dynamic`; re-check it then.
openh264 = { version = "0.9", optional = true }
rav1d = { version = "1", default-features = false, features = ["bitdepth_8"], optional = true }
# errno names for rav1d's negated-`c_int` returns (`video_software.rs`): `ENOPROTOOPT` —
# the code a `bitdepth_8`-only build answers a 10-bit stream with — is 92 on Linux and
# 123 on Windows, and rav1d re-exports only `Dav1dResult`, so the typed enum that would
# otherwise name it is out of reach. Already in the tree (rav1d's own dependency).
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Native VAAPI decode: the hand-declared libva buffer
# layouts, the profile/format/surface decisions, the AuPlan → picparams/IQ/slice
# conversion and the DRM-PRIME export descriptor that `video_vaapi_native` marshals.
# Cross-platform on purpose — everything decidable without a device is tested by the
# ordinary macOS and container gates, exactly as pf-dxvadec does for Windows.
pf-vaapi = { path = "../../codec/pf-vaapi", optional = true }
pf-libva = { path = "../../codec/pf-libva", optional = true }
# V4L2 decode: the hand-declared uAPI and the stateful and stateless queue state machines
# that `video_v4l2` and `video_v4l2_hevc` drive with ioctls. Device-free, so its tests run
# on every gate.
pf-v4l2dec = { path = "../../codec/pf-v4l2dec", optional = true }
# Its ioctl half: decoder nodes, media requests, buffer mapping, dma-buf export.
pf-v4l2 = { path = "../../codec/pf-v4l2", optional = true }
# `fence`: the decode's write fence as a sync_file, so the presenter waits it
# on the GPU instead of the pump blocking in `vaSyncSurface`.
pf-dmabuf = { path = "../../core/pf-dmabuf", optional = true }
# libva itself is dlopen'd, never linked (see `video_vaapi_native`'s module docs): the
# container can then compile and clippy the whole rung without `libva-dev`, and a machine
# without a VAAPI runtime gets a clean refusal instead of a packaging dependency.
libloading = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
# Native D3D11VA decode: the hand-declared DXVA buffer
# layouts and the AuPlan → picparams/qmatrix/slice-control conversion that video_d3d11_native
# submits. Windows-only because the rung is; the crate itself is cross-platform CPU code so
# its tests run on every CI leg (which is the point — `cfg(windows)` code cannot be tested by
# the Linux or macOS gates at all).
pf-dxvadec = { path = "../../codec/pf-dxvadec", optional = true }
# D3D11 decode-device plumbing (video_d3d11.rs): device/adapter selection, DXVA probes, and
# the shared NT-handle hand-off ring `video_d3d11_native` fills. The workspace entry's pinned
# rev.
windows = { workspace = true, features = [
    # Features are header-named: windows-rs generates from the SDK headers directly, one
    # feature per header.
    "d3d11",
    "d3dcommon",
    "dxgi",
    "handleapi",
    # RECT/HMONITOR for DXGI_OUTPUT_DESC1 (the display-HDR volume query).
    "windef",
    # HMODULE (D3D11CreateDevice's `software` argument, video_d3d11.rs) and the NT `HANDLE`
    # the shared-surface hand-off uses.
    "minwindef",
    "winnt",
    # IDXGIResource1::CreateSharedHandle takes an optional SECURITY_ATTRIBUTES.
    "minwinbase",
] }

[target.'cfg(any(target_os = "linux", windows))'.dev-dependencies]
# The two platform native rungs' frame-hash parity tests (`video_d3d11_native::parity` on
# Windows, `video_vaapi_native::parity` on Linux) compare decoded surfaces against the
# libavcodec goldens — the same SHA-256 list, and the same crate, pf-vkdecode's Vulkan
# parity legs use. The goldens are checked-in hashes; nothing links FFmpeg to read them.
# A DEV dependency, so no shipped binary gains anything — which is also part of why the
# VAAPI readback cannot reach the production video path.
sha2 = "0.11"
# `pf_bitstream::testing`: the vendored vectors and access-unit splitters.
pf-bitstream = { path = "../../codec/pf-bitstream", features = ["test-vectors"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `pf_v4l2dec::testing`: the device-free decoder the V4L2 rung's tests drive.
pf-v4l2dec = { path = "../../codec/pf-v4l2dec", features = ["testing"] }

[features]
# `desktop` is the Linux/Windows decode ladder; pf-client-core's `desktop` turns it on. ON by
# default. Without it this crate is the four modules Android links.
default = ["desktop", "pyrowave"]
desktop = [
    "dep:pf-vkdecode", "dep:pf-bitstream", "dep:openh264", "dep:rav1d", "dep:libc",
    "dep:pf-vaapi", "dep:pf-libva", "dep:pf-v4l2dec", "dep:pf-v4l2", "dep:libloading",
    "dep:pf-dmabuf", "dep:pf-l10n", "d3d11va",
]
# DXVA device and native rung. `desktop` includes it; it also builds alone, without the ladder.
d3d11va = ["dep:pf-dxvadec", "dep:pf-bitstream"]
# PyroWave client decode ships in every default build (flatpak included; pyrowave-sys is a
# vendored in-repo tree, offline-safe, and an empty stub off Linux/Windows/Android/PS5). The
# codec is still strictly per-session opt-in (Settings codec pick / PUNKTFUNK_PREFER_PYROWAVE=1).
pyrowave = ["dep:pyrowave-sys", "dep:ash"]

# Headless wavelet decode bench over a `PUNKTFUNK_DUMP_VIDEO` capture.
[[example]]
name = "pyrowave_bench"
required-features = ["pyrowave"]

# build.rs names the `desktop` module gate.
[build-dependencies]
cfg_aliases = "0.2"

[lints]
workspace = true
