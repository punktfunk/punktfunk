[package]
name = "pf-console-ui"
description = "The Skia console UI for the Vulkan session binary — stats OSD, capture HUD, and (next) the gamepad library; renders on the presenter's device via the Overlay contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The Vulkan session's overlay (`SkiaOverlay` over pf-presenter's shared device + the SDL event
# path). ON by default so `clients/session` is unchanged; the Android host turns it off
# (`default-features = false`) and drives the portable `Console` over its own EGL surface.
# ⚠ Also what puts `vulkan` on skia-safe: with it, the desktop's prebuilt key stays
# `jpegd-jpege-pdf-textlayout-vulkan` (the flatpak pins that archive by hand — see below);
# without it Android resolves `gl-jpegd-jpege-pdf-textlayout`, which rust-skia also prebuilds
# for aarch64/x86_64/i686-linux-android. Neither key must drift or skia-bindings silently
# builds Skia from source for hours.
default = ["vulkan-overlay"]
vulkan-overlay = ["dep:pf-presenter", "dep:ash", "dep:sdl3", "skia-safe/vulkan", "desktop"]

# pf-client-core's desktop half, mirrored as a feature HERE so this crate's own sources can
# test for it — `cfg(feature = "desktop")` in this crate means THIS feature, never the
# dependency's, which is the trap that makes the two drift.
#
# Two things need it. `skia_overlay` names `video::QueueLock`. And `ring::actions` calls
# `host_actions::cached`, whose cache only ever fills from a ureq fetch the desktop client
# makes — so a GL host takes the same empty list Android already takes.
desktop = ["pf-client-core/desktop"]

# Skia's GL backend for a Linux consumer that has no Vulkan presenter and no SDL3 — a TV app
# drawing on an EGL surface it owns (design/webos-skia-console-port.md §2.1). Android already
# asks for `gl` from its own target block; this is the same ask spelled for Linux, where the
# default is Vulkan and there was previously no way to request a GPU canvas at all.
# ⚠ Changes the prebuilt key to `gl-jpegd-jpege-pdf-textlayout`, for which rust-skia publishes
# NO armv7-unknown-linux-gnueabi archive — that one is ours to build and host, exactly as the
# armeabi-v7a one is (see the provenance note in clients/android/kit/build.gradle.kts).
gl = ["skia-safe/gl"]

# Skia's Metal backend for an Apple host (`clients/apple/native`). Take it with
# `default-features = false`: rust-skia publishes no archive that has both `metal` and `vulkan`.
metal = ["skia-safe/metal"]

# Same Linux+Windows gating as the rest of the client stack.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
pf-presenter = { path = "../pf-presenter", optional = true }
# MenuEvent/MenuPulse (the gamepad service's menu mode drives the library).
# `default-features = false` like every other consumer (pf-presenter, cli, session, clients/windows):
# pf-client-core's default is `pyrowave`, which compiles the vendored PyroWave C++ — fatal on
# Windows ARM64. Whether that backend is on is the session binary's call (it forwards a `pyrowave`
# feature); this crate needs none of it, and taking defaults here quietly turned it on.
pf-client-core = { path = "../pf-client-core", default-features = false }

# Skia on the presenter's VkDevice (`vulkan`); `textlayout` = skparagraph/harfbuzz for
# the typography the console library needs (~15 MB stripped, prebuilt binaries exist for
# this feature set on x86_64-unknown-linux-gnu AND x86_64-pc-windows-msvc — a source
# build is never triggered on either).
#
# The prebuilt-binary claim is the whole reason this dep is affordable, so re-verify it on
# EVERY bump: the build log must say `DOWNLOAD AND INSTALL SUCCEEDED`. skia-bindings does not
# fail when no matching asset exists — it silently falls back to a gn/ninja build of Skia from
# source, which turns a 2-minute CI leg into a multi-hour one. Verified at 0.99.0, both targets:
#   skia-binaries-a25a0fdb7d90429aa2d1-<target>-jpegd-jpege-pdf-textlayout-vulkan.tar.gz
# ⚠ The asset name CHANGED across this bump — at 0.87 it was `<target>-pdf-textlayout-vulkan`,
# because `jpeg` was not yet in skia-safe's DEFAULT feature set (0.87: binary-cache, embed-icudtl,
# pdf; 0.99: + jpeg). We take defaults, so the JPEG codecs came along with the bump. That is a
# feature here rather than bloat: `screens/library.rs` feeds host poster art straight to
# `Image::from_encoded`, which silently returned `None` for JPEG posters before.
#
# 🛑 BUMPING THIS LINE IS ONLY HALF THE BUMP. packaging/flatpak/io.unom.Punktfunk.yml pins the
# archive above by URL + sha256 BY HAND (the offline sandbox can't fetch it) and nothing derives
# that pin from this file. Leave it stale and the flatpak leg unpacks the OLD archive's
# pre-generated bindings.rs under the NEW crate, failing with `no variant, associated function,
# or constant named 'Default' found for enum SkPathFillType`. That is exactly how #193 shipped.
skia-safe = { version = "0.99", features = ["textlayout"] }
ash = { version = "0.38", features = ["loaded"], optional = true }

# Android (design/android-skia-console-port.md D1): the same crate over Skia's GL backend on
# the client's own EGL surface. `gl` not `vulkan` — universal on every Android device this
# client ships to (GLES 2 boxes included) and the emulator, and prebuilt:
#   skia-binaries-a25a0fdb7d90429aa2d1-{aarch64,x86_64,i686}-linux-android-gl-jpegd-jpege-pdf-textlayout.tar.gz
# ⚠ armv7-linux-androideabi has NO published archive (rust-skia's CI does not build it) — the
# 32-bit TV ABI is served from a self-hosted archive via `SKIA_BINARIES_URL` (WP6); until that
# is hosted the Android client only enables its console feature on the 64-bit ABIs.
[target.'cfg(target_os = "android")'.dependencies]
skia-safe = { version = "0.99", features = ["gl", "textlayout"] }
pf-client-core = { path = "../pf-client-core", default-features = false }

# The web client (design/web-client-implementation-plan.md §1 R4): the same crate over Skia's GL
# backend, this time on a WebGL2 canvas the JS glue owns. `gl` for the same reason Android has it
# — and rust-skia publishes the key for this target too, so nothing builds Skia from source:
#   skia-binaries-a25a0fdb7d90429aa2d1-wasm32-unknown-emscripten-gl-jpegd-jpege-pdf-textlayout.tar.gz
# ⚠ Emscripten's `gl` means GLES over WebGL2; a Ganesh context comes up on the canvas the
# `-sOFFSCREEN_FRAMEBUFFER`-free default binds. The WebGPU swap replaces the VIDEO canvas only
# (R1/R2), never this one.
[target.'cfg(target_family = "wasm")'.dependencies]
skia-safe = { version = "0.99", features = ["gl", "textlayout"] }
pf-client-core = { path = "../pf-client-core", default-features = false }

# Apple: the Mac runs the tests on CPU raster; an Apple host draws through `metal`. With this
# crate's default features the darwin key is `jpegd-jpege-pdf-textlayout-vulkan`, and with
# `default-features = false, features = ["metal"]` it is `jpegd-jpege-metal-pdf-textlayout`.
# rust-skia publishes both for darwin and iOS at 0.99.0. tvOS has no rust-skia archive: its two
# are ours, built by `scripts/skia-tvos/build.sh` (a patched skia-bindings), fetched through
# `SKIA_BINARIES_URL` from git.unom.io/unom/skia-binaries/releases/download/0.99.0/, and
# `build.rs` names the system libraries skia-bindings does not link there. Their SHA-256s
# are pinned in scripts/build-xcframework.sh, which fetches and verifies every Apple slice's.
[target.'cfg(target_vendor = "apple")'.dependencies]
skia-safe = { version = "0.99", features = ["textlayout"] }
pf-client-core = { path = "../pf-client-core", default-features = false }

# Everything the shell itself needs, on every platform it runs on.
[target.'cfg(any(target_os = "linux", windows, target_os = "android", target_vendor = "apple", target_family = "wasm"))'.dependencies]
anyhow = "1"
tracing = "0.1"
# The host-facing model types (`HostRow`, `ConsoleCmd`, `LibraryGame`, …) derive serde so a host
# that lives across a language boundary (Android's Kotlin services, over JNI) can hand them over
# as JSON — the wire IS the model, no second set of mirror types to drift.
serde = { version = "1", features = ["derive"] }
# The Android-only settings rows live in `trust::Settings::extra` (a JSON map), so the desktop
# settings struct never grows a field only one platform reads.
serde_json = "1"
# `config::GamepadPref` keys the button-glyph style (PlayStation shapes vs ABXY).
punktfunk-core = { path = "../punktfunk-core" }

# Linux links the system SDL3; Windows builds it from source (same choice as the rest
# of the workspace's Windows SDL consumers).
[target.'cfg(target_os = "linux")'.dependencies]
sdl3 = { version = "0.18", features = ["hidapi", "ash"], optional = true }

[target.'cfg(windows)'.dependencies]
sdl3 = { version = "0.18", features = ["hidapi", "ash", "build-from-source"], optional = true }

# The shared console parity vectors (`clients/shared/console-vectors.json`) are read by three
# tests here — the palette table, the tab names and the transition motion — and the library
# collation vectors (`clients/shared/library-collate-vectors.json`) by a fourth (`collate.rs`).
# Dev-only: nothing in the shipping crate parses JSON. `pf-client-core` reads its own deeplink
# vectors the same way.
[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
