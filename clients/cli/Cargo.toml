[package]
name = "punktfunk-cli"
description = "punktfunk — the headless client CLI: pair, list and edit hosts, wake, enumerate a library, start a stream, open a punktfunk:// URL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The binary is `punktfunk` — the command users and plugins type. The crate name carries the
# `-cli` suffix only because `punktfunk` is taken by the workspace's own naming.
[[bin]]
name = "punktfunk"
path = "src/main.rs"

# Console subsystem, no GUI toolkit: this links `pf-client-core` (the brain) and nothing else
# UI-shaped, which is what lets it ship in every client package without dragging GTK, WinUI or
# Skia along (design/client-architecture-split.md §4).
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
pf-client-core = { path = "../../crates/client/pf-client-core", default-features = false, features = ["desktop"] }
punktfunk-core = { path = "../../crates/core/punktfunk-core", features = ["quic"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Icon + version-info resources (build.rs); Windows hosts only, like clients/session.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
