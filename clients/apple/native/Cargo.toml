[package]
name = "punktfunk-client-apple"
description = "punktfunk Apple client's static library: the punktfunk C ABI plus the Skia console on Metal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# `libpunktfunk_apple.a` — scripts/build-xcframework.sh ships it as PunktfunkCore.xcframework's
# library. It links punktfunk-ffi whole, so the `punktfunk_*` C ABI is in it unchanged.
name = "punktfunk_apple"
crate-type = ["staticlib"]

[dependencies]
punktfunk-ffi = { path = "../../../crates/punktfunk-ffi", features = ["quic"] }

# The console: the shell every other client shows, drawn through Skia's Metal backend into a
# texture Swift hands over (`src/console.rs`). `metal` + `ganesh` + `textlayout` = the prebuilt key
# `ganesh-jpegd-jpege-metal-pdf-textlayout`; build-xcframework.sh fetches and SHA-verifies each slice's.
[target.'cfg(target_vendor = "apple")'.dependencies]
pf-console-ui = { path = "../../../crates/pf-console-ui", default-features = false, features = [
    "metal",
] }
pf-client-core = { path = "../../../crates/pf-client-core", default-features = false }
skia-safe = { version = "0.153", features = ["metal", "ganesh", "textlayout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shell logs through `tracing`; with no subscriber, its `log` feature forwards each event
# to the `log` backend `punktfunk_set_log_callback` installs, which hands it to Swift.
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }

[lints]
workspace = true
