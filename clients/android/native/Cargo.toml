[package]
name = "punktfunk-client-android"
description = "punktfunk Android client — JNI bridge ('nativecore') over punktfunk-core (Rust-heavy client model)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# `libpunktfunk_android.so` — loaded by Kotlin via `System.loadLibrary("punktfunk_android")`.
name = "punktfunk_android"
crate-type = ["cdylib"]

[dependencies]
# The whole protocol/transport/FEC/crypto + the embeddable NativeClient connector. `quic` pulls
# the punktfunk/1 control plane, whose TLS runs on aws-lc-rs (see punktfunk-core/Cargo.toml) —
# aws-lc-sys cross-compiles for all three ABIs with the NDK clang cargo-ndk already exports.
punktfunk-core = { path = "../../../crates/punktfunk-core", features = ["quic"] }
# 0.22, NOT 0.21 — and the version is load-bearing beyond currency: `rustls-platform-verifier`
# (via quinn-proto, for Android cert verification) already depends on jni 0.22, so pinning 0.21
# here compiled TWO jni copies into the one .so. Matching it collapses them and, with them, the
# whole windows-rs 0.42 generation jni 0.21 dragged in behind `cfg(windows)` (windows-sys 0.45 —
# the oldest crate in the tree — plus windows-targets 0.42.2 and its seven per-arch import libs)
# and jni 0.21's `cesu8`: 11 crates, for a dependency that never even builds on Android.
#
# NOTE for whoever next tries to retire thiserror 1.0 or the jni-sys 0.3/0.4 split: jni is no
# longer why they are here. Both now come solely from `vendor/ndk` 0.9.0 (thiserror 1.0.23,
# jni-sys 0.3) and the crates.io `ndk-sys` 0.6 (jni-sys 0.3). jni-sys 0.3.1 is itself a facade
# over 0.4.1, so the "split" cannot close until ndk + ndk-sys move — and ndk is vendored for one
# visibility patch, so bumping its deps would mean rewriting the vendor rather than a version edit.
jni = "0.22"
log = "0.4"
# LAN host discovery: `pf_client_core::discovery::try_browse`, the browse the Linux and Windows
# clients run, in place of Android's per-OEM `NsdManager`. Shared, not in the Android table below,
# so the JNI seam and its tests build on the Linux and Windows hosts too. Kotlin keeps only the
# Wi-Fi `MulticastLock` + permission UX. `async-channel` names the browse's event receiver.
pf-client-core = { path = "../../../crates/pf-client-core", default-features = false, features = [
    "discovery",
] }
async-channel = "2"
# Shared, NOT in the Android table below: `session::connect` parses the `ConnectRequest`
# JSON Kotlin hands `nativeConnect`, and that module compiles on the host too — CI's
# workspace clippy builds this crate as a host cdylib.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ARMv7 TV boxes use software AES. Add the faster streaming backend only to that ABI; arm64 keeps
# its hardware-accelerated AES path and the emulator does not pay for an unused backend.
[target.'cfg(all(target_os = "android", target_arch = "arm"))'.dependencies]
punktfunk-core = { path = "../../../crates/punktfunk-core", features = ["chacha-aws-lc-rs"] }

# Android-only deps. Gated so `cargo build --workspace` on the Linux/macOS dev boxes + CI still
# compiles this crate (as a host cdylib) — the Android-framework glue (logging, AMediaCodec + AAudio
# via `ndk`, the Opus codec) is only pulled in for the real `*-linux-android` targets.
[target.'cfg(target_os = "android")'.dependencies]
# Default features only, DELIBERATELY: 0.15 added an opt-in `android-api-30` feature that routes
# level filtering through `__android_log_is_loggable_len` so logcat's system-wide/process-wide
# level overrides (`setprop log.tag.*`) are honoured. That symbol is API 30 and the feature
# HARD-LINKS it — on our minSdk-28 floor (Android 9/10) `System.loadLibrary` would fail outright,
# the same way ndk 0.9.0 hard-linking `AMediaCodec_setOnFrameRenderedCallback` broke every
# pre-Android-13 device (see the `ndk-sys` note below). Do not enable it while minSdk is 28.
android_logger = "0.15"
# Feature bridge, no code here: punktfunk-core logs through `tracing`, but this client only
# installs `android_logger` (a `log` backend). Core transport warnings (e.g. "UDP socket buffer
# capped well below target") reach logcat only via tracing's "log" feature, which forwards events
# as `log` records when no tracing subscriber is set (always, here). Today that feature happens to
# be enabled transitively — quinn's default `log` feature unifies `tracing/log` onto the whole
# graph — but nothing about this client's logging should hinge on a QUIC crate's default feature
# set, so declare it explicitly.
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }
# NDK bindings. "media" = AMediaCodec/ANativeWindow (video); "audio" = AAudio (audio playback).
# Pure-Rust FFI to libmediandk/libnativewindow/libaaudio — no C++/libc++_shared to bundle. Decode +
# audio run entirely in Rust on native threads (the "no async on the hot path" invariant).
# api-level-28 matches the app's minSdk floor (Android 9). AAudio (26), AMediaCodec (21) and
# ANativeWindow_setBuffersDataSpace (28) are all ≤28; every call above the floor —
# ANativeWindow_setFrameRate (30), …WithChangeStrategy (31), AMediaCodec_setOnFrameRenderedCallback
# (33), the ADPF hints — is dlsym-resolved at runtime (decode::try_set_frame_rate,
# decode::install_render_callback, adpf), never linked, so the .so still loads on API 28+.
ndk = { version = "0.9", features = ["media", "audio", "nativewindow", "api-level-28"] }
# Raw FFI *types* for the one AMediaCodec entry point the `ndk` wrapper lacks:
# `AMediaCodec_setOnFrameRenderedCallback` — the per-frame render-timestamp callback behind the
# HUD's `display` stage (see decode::DisplayTracker). The symbol is API 33 ("Available since
# Android T"), ABOVE the minSdk-28 floor, so it is dlsym-resolved at runtime
# (decode::install_render_callback), NEVER hard-linked: 0.9.0 hard-linked it and
# `System.loadLibrary` failed on every pre-Android-13 device. Only ndk-sys's pointer/typedef
# types are referenced, which creates no import. Reaching it needs the codec's raw pointer, which
# is why the workspace pins `ndk` to the vendored copy whose only patch makes `MediaCodec::as_ptr`
# public (vendor/ndk, wired in the root Cargo.toml).
ndk-sys = { version = "0.6", features = ["media"] }
# setpriority/gettid to raise the decode thread toward URGENT_DISPLAY (see decode::boost_thread_priority).
libc = "0.2"
# Tier-A pad audio (WP9). Android's audio framework denylists the DualSense's output by VID/PID,
# so the pad's isochronous endpoint is driven directly on the fd `UsbDeviceConnection` hands over.
# Our own crates, developed openly because the hole they fill — isochronous USB in Rust — is an
# ecosystem-wide one: https://github.com/unom-io/usbfs-iso
# Pinned by revision rather than floating: this is a transport under a real-time deadline and it
# should move when we choose to. Becomes a plain version dependency once the crates are published.
uac-host = { git = "https://github.com/unom-io/usbfs-iso", rev = "ff5468ac68cea3de64ecc4a1e16b4dbdba2f8b39" }
usbfs-iso = { git = "https://github.com/unom-io/usbfs-iso", rev = "ff5468ac68cea3de64ecc4a1e16b4dbdba2f8b39" }

# The Skia console UI (design/android-skia-console-port.md): the SAME `pf-console-ui` shell the
# Linux/Windows session binary shows, drawn here through Skia's GL backend on an EGL surface
# (`src/console/`). `default-features = false` turns its Vulkan overlay off — this host owns the
# surface. `pf-client-core` for the portable types the shell speaks (settings, menu events,
# overlay actions). `pf-client-video` with `pyrowave` and without `desktop`: the shared Vulkan
# wavelet decoder behind `src/pyro/` (design/pyrowave-codec-plan.md) and its colour, queue-lock
# and SPIR-V modules, no decode ladder. It brings the vendored C++/Vulkan codec into the `.so` on
# the 64-bit ABIs (arm64-v8a, x86_64) and nothing at all on armeabi-v7a, where pyrowave-sys
# stubs itself out — see its build.rs.
#
# All three shipping ABIs. rust-skia publishes prebuilt Skia archives for aarch64/x86_64 but NOT
# armv7-linux-androideabi (the 32-bit TV boxes) — that one comes from OUR mirror
# through `SKIA_BINARIES_URL` (kit/build.gradle.kts forwards it; the CI variable of
# the same name; sha256 table beside it), built once with skia-bindings itself (design
# android-skia-console-port.md WP6). 🛑 skia-bindings does not fail when no archive matches — it
# silently builds Skia from source — so an armeabi-v7a build WITHOUT the mirror url is a
# multi-minute source build, and every ABI's log must show `DOWNLOAD AND INSTALL SUCCEEDED`.
# (Continues the `cfg(target_os = "android")` table above — TOML allows a table header once.)
pf-console-ui = { path = "../../../crates/pf-console-ui", default-features = false }
pf-client-core = { path = "../../../crates/pf-client-core", default-features = false }
pf-client-video = { path = "../../../crates/pf-client-video", default-features = false, features = [
    "pyrowave",
] }
# The PyroWave lane's own Vulkan: device bring-up, swapchain on the `SurfaceView`, and the
# planar CSC pipeline (`src/pyro/`). `loaded` dlopens libvulkan.so at RUNTIME rather than
# linking it, which is what keeps the `.so` loading on a device with no Vulkan at all — there
# the probe simply answers no and the client never advertises the codec.
ash = { workspace = true, features = ["loaded"] }
# `gl` (implies `ganesh`) + `textlayout` = the key `ganesh-gl-jpegd-jpege-pdf-textlayout` (verify
# `DOWNLOAD AND INSTALL SUCCEEDED` in the build log on every bump — see pf-console-ui/Cargo.toml).
skia-safe = { version = "0.153", features = ["gl", "textlayout"] }
anyhow = "1"

[lints]
workspace = true
