# Workspace-wide build flags.
#
# THERE ARE DELIBERATELY NONE. This file stays so the aarch64 AES cfgs are not reintroduced:
# `--cfg aes_armv8` and `--cfg polyval_armv8` do nothing. `aes` 0.9 runtime-detects the ARMv8
# backend on aarch64 with `cpufeatures::new!(features_aes, "aes")` (lib.rs), as it does AES-NI
# on x86_64, and `polyval` 0.7 selects `backend/intrinsics/armv8.rs` by `target_arch` alone.
#
# A RUSTFLAGS ENVIRONMENT VARIABLE OVERRIDES CONFIG RUSTFLAGS ENTIRELY — it does not merge and
# does not append. A flag set here is dropped by every lane that sets its own RUSTFLAGS, and
# cargo-ndk sets RUSTFLAGS internally for its linker configuration.
#
# If a slowdown on the aarch64 per-packet decrypt path is suspected, run
# `cargo bench -p punktfunk-core --bench pipeline -- in_place` rather than reaching for a cfg.
