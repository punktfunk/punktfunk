# cargo-audit configuration — consumed by `.gitea/workflows/audit.yml` (`cargo audit`).
#
# Silence only advisories that are KNOWN-UNFIXABLE and either not applicable to how we use the crate
# or an accepted, documented risk. Keep this list TIGHT and justify every entry — an ignore here
# means the audit job stops flagging it, so the reasoning must hold up.
#
# An entry here covers every lockfile the workflow scans. An exception that belongs to one
# lockfile goes on that lockfile's line in the workflow as `--ignore`, as the seat keeper's does.
#
# The workflow's `--deny unsound` fails vulnerabilities and unsound advisories. Unmaintained
# advisories stay visible without failing CI, so we keep the maintenance signal. paste is the
# root one: transitive with no successor, through utoipa-axum (host), rav1d (every client) and
# metal, so dropping utoipa-axum alone would not clear it.

[advisories]
ignore = []
